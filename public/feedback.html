<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babel Fish — דיווח באג</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap');

  :root {
    --bg:       #0f1620;
    --surface:  #1a2333;
    --border:   #2a3a52;
    --text:     #dde4ef;
    --muted:    #7a8fa8;
    --amber:    #e6a13d;
    --teal:     #4d9b95;
    --danger:   #d9694f;
    --radius:   10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Splash screen */
  #splash {
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.5rem;
    transition: opacity .5s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash img { width: min(220px, 62vw); object-fit: contain; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
    -webkit-user-select: none;
    user-select: none;
  }

  input, textarea, select, button, label {
    -webkit-user-select: text;
    user-select: text;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .header img { height: 40px; object-fit: contain; }
  .header-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
  }

  .page-title {
    font-size: 22px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 28px;
  }

  /* ── Card ── */
  .card {
    width: 100%;
    max-width: 500px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 20px;
    direction: rtl;
    text-align: right;
  }

  /* ── Fields ── */
  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .field label .opt {
    font-weight: 400;
    color: var(--muted);
    font-size: 12px;
    margin-right: 4px;
  }
  .field label .req { color: var(--amber); margin-right: 2px; }

  input[type="text"], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    padding: 10px 13px;
    border-radius: var(--radius);
    direction: auto;
    transition: border-color .15s;
    outline: none;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--amber);
  }
  textarea { resize: vertical; min-height: 80px; line-height: 1.55; }

  /* ── Severity ── */
  .sev-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .sev-grid input[type="radio"] { display: none; }
  .sev-grid label {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 10px 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    transition: all .15s;
    line-height: 1.3;
  }
  .sev-grid label .emoji { font-size: 20px; }
  .sev-grid input[type="radio"]:checked + label {
    border-color: var(--amber);
    background: rgba(230,161,61,.1);
    color: var(--amber);
    font-weight: 700;
  }

  /* ── Submit ── */
  .btn-submit {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    background: var(--amber);
    color: #0f1620;
    font-family: 'Heebo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn-submit:disabled { opacity: .45; cursor: default; }

  /* ── Toast ── */
  .toast {
    display: none;
    margin-top: 14px;
    padding: 11px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    text-align: center;
  }
  .toast.ok  { display: block; background: rgba(77,155,149,.15); color: var(--teal); border: 1px solid rgba(77,155,149,.3); }
  .toast.err { display: block; background: rgba(217,105,79,.15);  color: var(--danger); border: 1px solid rgba(217,105,79,.3); }

  /* ── Toggle reports ── */
  .btn-toggle {
    display: block;
    margin: 22px auto 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    font-family: 'Heebo', sans-serif;
  }

  /* ── Reports list ── */
  .reports-wrap {
    width: 100%;
    max-width: 500px;
    margin-top: 16px;
    display: none;
  }
  .reports-wrap.open { display: block; }

  .report-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.6;
    direction: rtl;
    text-align: right;
  }
  .report-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .report-who { font-weight: 700; }
  .report-date { color: var(--muted); font-size: 11px; }
  .sev-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 5px;
  }
  .sev-low  { background: rgba(77,155,149,.2);  color: var(--teal); }
  .sev-med  { background: rgba(230,161,61,.2);   color: var(--amber); }
  .sev-high { background: rgba(217,105,79,.2);   color: var(--danger); }

  .report-row { color: var(--text); margin-bottom: 2px; }
  .report-row .k { color: var(--muted); font-size: 12px; margin-left: 4px; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
  }
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <img src="logo.png" alt="עומדים ביחד">
  <img src="babel-fish.png" alt="Babel Fish">
</div>

<!-- Main -->
<div id="main">
<div class="header">
  <img src="/babel-fish.png" alt="Babel Fish">
  <div class="header-divider"></div>
  <img src="/logo.png" alt="Logo">
</div>

<h1 class="page-title">דיווח באג / Bug Report</h1>
<p class="page-sub">עוזר לנו לשפר · يساعدنا على التحسين</p>

<div class="card">
  <form id="reportForm" novalidate>

    <div class="field">
      <label>שם / الاسم <span class="req">*</span></label>
      <input type="text" id="f-name" placeholder="השם שלך" autocomplete="name" required>
    </div>

    <div class="field">
      <label>קוד חדר / رمز الغرفة <span class="opt">— אם רלוונטי</span></label>
      <input type="text" id="f-room" placeholder="למשל: A1B2C" autocomplete="off">
    </div>

    <div class="field">
      <label>מכשיר / الجهاز <span class="opt">— מה השתמשת בו</span></label>
      <input type="text" id="f-device" placeholder="למשל: iPhone 15, Chrome על Windows">
    </div>

    <div class="field">
      <label>חומרה / الخطورة</label>
      <div class="sev-grid">
        <div>
          <input type="radio" name="sev" id="sev-low" value="low" checked>
          <label for="sev-low"><span class="emoji">🟢</span>קל<br><span style="font-size:11px;color:inherit">خفيف</span></label>
        </div>
        <div>
          <input type="radio" name="sev" id="sev-med" value="med">
          <label for="sev-med"><span class="emoji">🟡</span>בינוני<br><span style="font-size:11px;color:inherit">متوسط</span></label>
        </div>
        <div>
          <input type="radio" name="sev" id="sev-high" value="high">
          <label for="sev-high"><span class="emoji">🔴</span>חוסם<br><span style="font-size:11px;color:inherit">حرج</span></label>
        </div>
      </div>
    </div>

    <div class="field">
      <label>מה קרה? / ما الذي حدث؟ <span class="req">*</span></label>
      <textarea id="f-what" placeholder="תאר את הבאג בפירוט..." required></textarea>
    </div>

    <div class="field">
      <label>מה ציפית שיקרה? <span class="opt">— לא חובה</span></label>
      <textarea id="f-expected" placeholder="מה היית מצפה לראות..." style="min-height:60px;"></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">שלח דיווח ✓</button>
    <div class="toast" id="toast"></div>
  </form>
</div>

<button class="btn-toggle" id="toggleBtn" onclick="toggleReports()">
  צפייה בדיווחים קיימים ▾
</button>

<div class="reports-wrap" id="reportsWrap">
  <div id="reportsList"></div>
</div>

</div><!-- /main -->

<script>
  // Splash — same logic as home.html
  const splash = document.getElementById('splash');
  const navType = performance.getEntriesByType('navigation')[0]?.type;
  const isFreshLoad = navType === 'reload' || !sessionStorage.getItem('bf_splash_shown');
  if (!isFreshLoad) {
    splash.remove();
  } else {
    sessionStorage.setItem('bf_splash_shown', '1');
    setTimeout(() => {
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 500);
    }, 1200);
  }

  const SEV_LABEL = { low: 'קל / خفيف', med: 'בינוני / متوسط', high: 'חוסם / حرج' };
  const SEV_CLASS = { low: 'sev-low', med: 'sev-med', high: 'sev-high' };

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = String(s ?? '');
    return d.innerHTML;
  }

  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleString('he-IL', {
        day: '2-digit', month: '2-digit', year: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    } catch { return iso; }
  }

  // ── Submit ────────────────────────────────────────────────────────────────
  document.getElementById('reportForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name       = document.getElementById('f-name').value.trim();
    const what       = document.getElementById('f-what').value.trim();
    if (!name || !what) {
      showToast('err', 'שם ותיאור הן שדות חובה');
      return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          room_id:      document.getElementById('f-room').value.trim() || null,
          device:       document.getElementById('f-device').value.trim() || null,
          severity:     document.querySelector('input[name="sev"]:checked').value,
          what_happened: what,
          expected:     document.getElementById('f-expected').value.trim() || null
        })
      });
      if (!res.ok) throw new Error();
      showToast('ok', '✓ הדיווח נשלח — תודה! شكراً!');
      e.target.reset();
      document.getElementById('sev-low').checked = true;
    } catch {
      showToast('err', 'שגיאה בשליחה — נסה שוב');
    } finally {
      btn.disabled = false;
    }
  });

  function showToast(type, msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    setTimeout(() => { t.className = 'toast'; }, 5000);
  }

  // ── Reports toggle ────────────────────────────────────────────────────────
  let reportsLoaded = false;
  async function toggleReports() {
    const wrap = document.getElementById('reportsWrap');
    const btn  = document.getElementById('toggleBtn');
    const open = !wrap.classList.contains('open');
    wrap.classList.toggle('open', open);
    btn.textContent = open ? 'הסתרת דיווחים ▴' : 'צפייה בדיווחים קיימים ▾';
    if (!open || reportsLoaded) return;
    reportsLoaded = true;
    await loadReports();
  }

  async function loadReports() {
    const list = document.getElementById('reportsList');
    list.innerHTML = '<p class="empty-state">טוען…</p>';
    try {
      const data = await fetch('/api/feedback').then(r => r.json());
      if (!Array.isArray(data) || !data.length) {
        list.innerHTML = '<p class="empty-state">אין דיווחים עדיין</p>';
        return;
      }
      list.innerHTML = data.map(r => `
        <div class="report-card">
          <div class="report-meta">
            <div>
              <span class="report-who">${esc(r.name)}</span>
              <span class="report-date"> · ${fmtDate(r.created_at)}</span>
            </div>
            <span class="sev-badge ${SEV_CLASS[r.severity] || 'sev-low'}">${SEV_LABEL[r.severity] || r.severity}</span>
          </div>
          ${r.room_id ? `<div class="report-row"><span class="k">חדר:</span>${esc(r.room_id)}</div>` : ''}
          ${r.device  ? `<div class="report-row"><span class="k">מכשיר:</span>${esc(r.device)}</div>` : ''}
          <div class="report-row"><span class="k">מה קרה:</span>${esc(r.what_happened)}</div>
          ${r.expected ? `<div class="report-row"><span class="k">ציפייה:</span>${esc(r.expected)}</div>` : ''}
        </div>
      `).join('');
    } catch {
      list.innerHTML = '<p class="empty-state">שגיאה בטעינה</p>';
    }
  }
</script>
</body>
</html>
