<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babel Fish — דיווח | تقرير</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;900&display=swap');
  :root{--ink:#151d2b;--ink2:#1e2a3d;--paper:#eef0e9;--amber:#e6a13d;--teal:#4d9b95;--line:#33445e;--danger:#d9694f;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:var(--paper);font-family:'Heebo',sans-serif;min-height:100vh;padding:28px 16px 56px;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center;}
  input,textarea,label{-webkit-user-select:text;user-select:text;}
  .wrap{width:100%;direction:rtl;text-align:right;}
  h1{font-size:20px;font-weight:900;margin-bottom:2px;}
  .sub{color:#9fb0c3;font-size:13px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .field{margin-bottom:14px;}
  label{display:block;font-size:13px;font-weight:600;color:#dfe6ee;margin-bottom:5px;}
  label span{color:#9fb0c3;font-weight:400;}
  input,textarea{
    width:100%;background:var(--ink2);border:1px solid var(--line);
    color:var(--paper);font-family:'Heebo',sans-serif;font-size:14px;
    padding:10px 12px;border-radius:8px;transition:border-color .15s;direction:auto;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--amber);}
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .sev-row{display:flex;gap:6px;}
  .sev-opt{flex:1;}
  .sev-opt input{position:absolute;opacity:0;}
  .sev-opt label{
    display:block;text-align:center;padding:9px 4px;border-radius:8px;
    border:1px solid var(--line);background:var(--ink2);font-size:12px;
    cursor:pointer;color:#9fb0c3;transition:all .15s;line-height:1.3;
  }
  .sev-opt input:checked+label{border-color:var(--amber);background:rgba(230,161,61,.12);color:var(--amber);font-weight:700;}
  .submit-btn{
    width:100%;background:var(--amber);color:var(--ink);border:none;
    font-family:'Heebo',sans-serif;font-weight:700;font-size:15px;
    padding:13px;border-radius:9px;cursor:pointer;margin-top:6px;
  }
  .submit-btn:disabled{opacity:.5;cursor:default;}
  .status{display:none;text-align:center;margin-top:12px;font-size:13px;padding:10px;border-radius:8px;}
  .status.ok{display:block;background:rgba(77,155,149,.15);color:var(--teal);}
  .status.err{display:block;background:rgba(217,105,79,.15);color:var(--danger);}
  .toggle-reports{background:none;border:none;color:#5c7089;font-size:11px;cursor:pointer;text-decoration:underline;display:block;margin:24px auto 0;}
  .admin-panel{display:none;margin-top:20px;border-top:1px solid var(--line);padding-top:16px;}
  .admin-panel.show{display:block;}
  .report{background:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;font-size:12px;line-height:1.6;}
  .report-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:#7b8ba0;font-size:11px;}
  .sev-tag{font-weight:700;padding:1px 7px;border-radius:4px;}
  .sev-low{background:rgba(77,155,149,.2);color:var(--teal);}
  .sev-med{background:rgba(230,161,61,.2);color:var(--amber);}
  .sev-high{background:rgba(217,105,79,.2);color:var(--danger);}
  .k{color:#7b8ba0;}
  .empty{color:#7b8ba0;text-align:center;padding:16px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="/babel-fish.png" style="height:32px;vertical-align:middle;margin-left:8px;"> Babel Fish</h1>
  <p class="sub">דיווח באגים / בדיקה &nbsp;·&nbsp; تقرير أخطاء / اختبار</p>

  <form id="form">
    <div class="field">
      <label>שם / الاسم <span>*</span></label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label>קוד חדר / رمز الغرفة <span>— אם רלוונטי / إن وجد</span></label>
      <input type="text" id="roomId">
    </div>
    <div class="field">
      <label>מכשיר / الجهاز <span>— למשל: Android, Chrome / مثلاً: iPhone, Safari</span></label>
      <input type="text" id="device">
    </div>
    <div class="field">
      <label>חומרה / الخطورة</label>
      <div class="sev-row">
        <div class="sev-opt"><input type="radio" name="sev" id="s1" value="low" checked><label for="s1">קל<br>خفيف</label></div>
        <div class="sev-opt"><input type="radio" name="sev" id="s2" value="med"><label for="s2">בינוני<br>متوسط</label></div>
        <div class="sev-opt"><input type="radio" name="sev" id="s3" value="high"><label for="s3">חוסם<br>حرج</label></div>
      </div>
    </div>
    <div class="field">
      <label>מה קרה / ما الذي حدث <span>*</span></label>
      <textarea id="what" required></textarea>
    </div>
    <div class="field">
      <label>מה ציפית / ما توقعته <span>— לא חובה / اختياري</span></label>
      <textarea id="expected" style="min-height:50px;"></textarea>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">שלח דיווח / إرسال التقرير</button>
    <div class="status" id="status"></div>
  </form>

  <button class="toggle-reports" id="toggleBtn" onclick="toggleReports()">צפייה בדיווחים / عرض التقارير</button>
  <div class="admin-panel" id="adminPanel">
    <div id="reportsList"></div>
  </div>
</div>

<script>
const sevLabels = { low: 'קל / خفيف', med: 'בינוני / متوسط', high: 'חוסם / حرج' };
const sevClass  = { low: 'sev-low', med: 'sev-med', high: 'sev-high' };

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const st  = document.getElementById('status');
  btn.disabled = true;
  st.className = 'status';
  try {
    const r = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name:         document.getElementById('name').value.trim(),
        room_id:      document.getElementById('roomId').value.trim(),
        device:       document.getElementById('device').value.trim(),
        severity:     document.querySelector('input[name=sev]:checked').value,
        what_happened:document.getElementById('what').value.trim(),
        expected:     document.getElementById('expected').value.trim()
      })
    });
    if (!r.ok) throw new Error();
    st.textContent = '✓ הדיווח נשלח, תודה! / تم الإرسال، شكراً!';
    st.className = 'status ok';
    e.target.reset();
  } catch {
    st.textContent = 'שגיאה — נסה שוב / خطأ — حاول مجدداً';
    st.className = 'status err';
  } finally { btn.disabled = false; }
});

async function toggleReports() {
  const panel = document.getElementById('adminPanel');
  const btn   = document.getElementById('toggleBtn');
  const show  = !panel.classList.contains('show');
  panel.classList.toggle('show', show);
  btn.textContent = show ? 'הסתרה / إخفاء' : 'צפייה בדיווחים / عرض التقارير';
  if (!show) return;
  const list = document.getElementById('reportsList');
  list.innerHTML = '<p class="empty">טוען… / جارٍ التحميل…</p>';
  try {
    const entries = await fetch('/api/feedback').then(r => r.json());
    if (!entries.length) { list.innerHTML = '<p class="empty">אין דיווחים עדיין / لا توجد تقارير</p>'; return; }
    list.innerHTML = entries.map(en => `
      <div class="report">
        <div class="report-head">
          <span>${esc(en.name)} · ${new Date(en.created_at).toLocaleString('he-IL')}</span>
          <span class="sev-tag ${sevClass[en.severity]||'sev-low'}">${sevLabels[en.severity]||en.severity}</span>
        </div>
        ${en.room_id ? `<div><span class="k">חדר:</span> ${esc(en.room_id)}</div>` : ''}
        ${en.device  ? `<div><span class="k">מכשיר:</span> ${esc(en.device)}</div>` : ''}
        <div><span class="k">מה קרה:</span> ${esc(en.what_happened)}</div>
        ${en.expected ? `<div><span class="k">ציפייה:</span> ${esc(en.expected)}</div>` : ''}
      </div>`).join('');
  } catch { list.innerHTML = '<p class="empty">שגיאה / خطأ</p>'; }
}

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
</script>
</body>
</html>
