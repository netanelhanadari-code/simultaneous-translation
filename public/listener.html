<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגום סימולטני – עומדים ביחד</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #12082a;
      --surface: #1e0f3a;
      --border:  #3d1f6b;
      --accent:  #8B2FC9;
      --accent2: #7928b0;
      --text:    #f0e8ff;
      --muted:   #9b7fc4;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      gap: 1.6rem;
      text-align: center;
    }

    .logo { height: 56px; object-fit: contain; }
    h1 { font-size: 1.3rem; color: var(--muted); }

    .no-room {
      background: var(--surface); border-radius: 14px;
      padding: 2rem 1.5rem; max-width: 340px;
      display: flex; flex-direction: column; gap: 1rem; align-items: center;
    }
    .no-room p { font-size: .95rem; color: var(--muted); line-height: 1.5; }

    .lang-pick {
      background: var(--surface); border-radius: 14px;
      padding: 1.25rem 1.5rem; width: 100%; max-width: 340px;
      display: flex; flex-direction: column; gap: .75rem;
    }
    .lang-pick label { font-size: .82rem; color: var(--muted); }
    select {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: .5rem .75rem; font-size: 1rem; cursor: pointer;
    }

    .icon-wrap {
      width:130px; height:130px; border-radius:50%;
      background:var(--surface); display:flex; align-items:center;
      justify-content:center; font-size:3.2rem;
      transition: background .4s, box-shadow .4s;
      position:relative; cursor:pointer;
    }
    .icon-wrap:hover { background: #2a1550; }
    .icon-wrap.active { animation: wave 2s ease-in-out infinite; cursor:default; }
    .icon-wrap.ended  { opacity:.4; cursor:default; }
    .play-badge {
      position:absolute; bottom:8px; right:8px;
      width:28px; height:28px; border-radius:50%;
      background:var(--accent); color:#fff;
      font-size:.75rem; display:flex; align-items:center; justify-content:center;
      box-shadow:0 2px 6px rgba(0,0,0,.4);
    }
    .icon-wrap.active .play-badge,
    .icon-wrap.ended  .play-badge { display:none; }
    @keyframes wave {
      0%,100% { box-shadow: 0 0 0  8px rgba(139,47,201,.25), 0 0 0 18px rgba(139,47,201,.12); }
      50%      { box-shadow: 0 0 0 14px rgba(139,47,201,.30), 0 0 0 28px rgba(139,47,201,.15); }
    }

    .status { font-size:1.05rem; font-weight:600; }
    .sub    { font-size:.82rem; color:var(--muted); min-height:1.1em; }
    .green  { color:#22c55e; }
    .yellow { color:#f59e0b; }
    .red    { color:#f87171; }
    .muted  { color:var(--muted); }

    .tap-btn {
      background:var(--accent); color:#fff; border:none;
      border-radius:999px; padding:.85rem 2.25rem;
      font-size:1rem; cursor:pointer;
      transition: background .15s, transform .1s;
    }
    .tap-btn:hover  { background:var(--accent2); transform:scale(1.03); }
    .tap-btn:active { transform:scale(.97); }

    .vol-wrap {
      display:flex; flex-direction:column; align-items:center;
      gap:.55rem; width:100%; max-width:250px;
    }
    .vol-label { font-size:.8rem; color:var(--muted); }
    input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }

    .ai-display {
      width:100%; max-width:400px;
      display:flex; flex-direction:column; gap:1rem;
    }
    .translation-card {
      background:var(--surface); border-radius:14px;
      padding:1.25rem 1.1rem;
    }
    .card-label { font-size:.72rem; color:var(--muted); margin-bottom:.4rem; }
    .card-text {
      font-size:1.4rem; font-weight:600; color:#67e8f9; line-height:1.5;
      max-height: 9rem; overflow-y: auto;
    }
    .original-card {
      background:var(--bg); border-radius:10px;
      padding:.85rem 1rem;
    }
    .original-text {
      font-size:.95rem; color:var(--muted); line-height:1.4;
      max-height: 5rem; overflow-y: auto;
    }

    .tts-row {
      display:flex; align-items:center; justify-content:center;
      gap:.6rem; font-size:.82rem; color:var(--muted);
    }
    .tts-toggle {
      width:38px; height:22px; background:var(--border);
      border-radius:999px; border:none; cursor:pointer;
      position:relative; transition:background .2s;
    }
    .tts-toggle::after {
      content:''; position:absolute; top:3px; right:3px;
      width:16px; height:16px; border-radius:50%;
      background:#fff; transition:transform .2s;
    }
    .tts-toggle.on { background:var(--accent); }
    .tts-toggle.on::after { transform:translateX(-16px); }

    .tip  { font-size:.76rem; color:var(--border); }
    .hidden { display:none !important; }
    audio { display:none; }
    .version { position:fixed; bottom:.6rem; left:.8rem; font-size:.7rem; color:var(--muted); opacity:.5; pointer-events:none; }

    /* ── Translation log ── */
    .log-wrap {
      width:100%; max-width:400px;
      background:var(--surface); border-radius:14px;
      padding:.85rem 1rem; display:none; flex-direction:column; gap:.5rem;
    }
    .log-header {
      display:flex; justify-content:space-between; align-items:center;
      font-size:.75rem; color:var(--muted);
    }
    .log-toggle-btn {
      background:none; border:1px solid var(--border); color:var(--muted);
      border-radius:6px; padding:.2rem .6rem; font-size:.72rem; cursor:pointer;
    }
    .log-entries {
      max-height:220px; overflow-y:auto;
      display:flex; flex-direction:column; gap:.4rem;
    }
    .log-entry {
      background:var(--bg); border-radius:8px;
      padding:.5rem .7rem; font-size:.78rem; line-height:1.5;
      border-right:2px solid var(--border);
    }
    .log-src { color:var(--muted); }
    .log-tgt { color:#67e8f9; margin-top:.2rem; }
  </style>
</head>
<body>

  <div style="display:flex;align-items:center;gap:1rem;justify-content:center;">
    <img src="logo.png" class="logo" alt="עומדים ביחד">
    <img src="babel-fish.png" style="height:56px;object-fit:contain;" alt="Babel Fish">
  </div>
  <h1>🎧 תרגום סימולטני</h1>

  <div class="no-room hidden" id="noRoom">
    <div style="font-size:2.5rem">🔗</div>
    <p>סרוק את קוד ה-QR מהמשדר, או בקש קישור ישיר.</p>
  </div>

  <div class="lang-pick hidden" id="langPick">
    <label>בחר את השפה שלך:</label>
    <select id="langSelect" onchange="startListening()">
      <option value="" disabled selected>בחר שפה</option>
      <option value="he">עברית</option>
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="ru">Русский</option>
      <option value="am">አማርኛ</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="uk">Українська</option>
      <option value="de">Deutsch</option>
    </select>
  </div>

  <div class="icon-wrap hidden" id="iconWrap" onclick="startListening()">
    🎧
    <div class="play-badge">▶</div>
  </div>

  <div class="hidden" id="statusBlock">
    <div class="status muted" id="statusTxt">מתחבר...</div>
    <div class="sub" id="subTxt">ממתין לשרת</div>
  </div>


  <div class="vol-wrap hidden" id="volWrap">
    <div class="vol-label">🔊 עוצמת קול</div>
    <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1"
           oninput="audioEl.volume = +this.value">
  </div>

  <div class="ai-display hidden" id="aiDisplay">
    <div class="translation-card">
      <div class="card-label">תרגום:</div>
      <div class="card-text" id="translatedCard">ממתין לשידור…</div>
    </div>
    <div class="original-card">
      <div class="card-label">מקור:</div>
      <div class="original-text" id="originalCard">—</div>
    </div>
    <div class="tts-row">
      <span>קריאה בקול</span>
      <button class="tts-toggle on" id="ttsToggle" onclick="toggleTTS()"></button>
    </div>
  </div>

  <div class="tip hidden" id="tip">🎧 מומלץ להשתמש באוזניות</div>

  <div class="log-wrap hidden" id="logWrap">
    <div class="log-header">
      <span>📋 לוג תרגום</span>
      <button class="log-toggle-btn" onclick="clearLog()">נקה</button>
    </div>
    <div class="log-entries" id="logEntries"></div>
  </div>

  <audio id="audioEl" playsinline></audio>
  <div class="version">v0.6</div>

  <script>
    // ── Room ID ───────────────────────────────────────────────────────────────
    const roomId = new URLSearchParams(location.search).get('room');

    if (!roomId) {
      document.getElementById('noRoom').classList.remove('hidden');
    } else {
      document.getElementById('langPick').classList.remove('hidden');
      document.getElementById('iconWrap').classList.remove('hidden');
      document.getElementById('statusBlock').classList.remove('hidden');

      document.getElementById('tip').classList.remove('hidden');
      init();
    }

    // ── State ─────────────────────────────────────────────────────────────────
    const audioEl   = document.getElementById('audioEl');
    const iconWrap  = document.getElementById('iconWrap');
    const statusTxt = document.getElementById('statusTxt');
    const subTxt    = document.getElementById('subTxt');

    // ── Wake Lock ─────────────────────────────────────────────────────────────
    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch(_) {}
      }
    }
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock && document.visibilityState === 'visible') requestWakeLock();
    });

    let started = false;
    let ttsOn   = true;
    let mode    = null; // 'audio' | 'ai'

    const pendingChunks = [];
    let mediaSource = null, sourceBuffer = null;
    const msQueue   = [];
    let msUpdating  = false;

    const LANG_BCP47 = {
      he: 'he-IL', ar: 'ar-SA', en: 'en-US', ru: 'ru-RU',
      am: 'am-ET', fr: 'fr-FR', es: 'es-ES', uk: 'uk-UA', de: 'de-DE'
    };

    // ── Translation queue — sequential, no drops ──────────────────────────────
    const translationQueue = [];
    let queueProcessing = false;

    async function queueTranslation(text, srcLang, tgtLang, ttsLang) {
      translationQueue.push({ text, srcLang, tgtLang, ttsLang: ttsLang || tgtLang });
      if (!queueProcessing) processTranslationQueue();
    }

    async function processTranslationQueue() {
      queueProcessing = true;
      while (translationQueue.length > 0) {
        const item = translationQueue.shift();
        const sameLang = item.srcLang === item.tgtLang;
        const translated = sameLang ? item.text : await translate(item.text, item.srcLang, item.tgtLang);
        const translationFailed = !sameLang && translated === item.text;
        await showTranslation(item.text, translated, translationFailed ? null : item.ttsLang);
      }
      queueProcessing = false;
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    function init() {
      const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(wsProto + '//' + location.host + '/ws?role=listener&room=' + roomId);
      ws.binaryType = 'arraybuffer';

      ws.onopen  = () => {};
      ws.onclose = () => setStatus('red', '🔴 החיבור נותק', 'רענן את הדף');
      ws.onerror = () => setStatus('red', '❌ שגיאת חיבור', '');

      ws.onmessage = async e => {
        if (typeof e.data === 'string') {
          handleText(JSON.parse(e.data));
        } else {
          if (!started) { pendingChunks.push(e.data); return; }
          if (mode === null) switchMode('audio');
          enqueue(e.data);
        }
      };
    }

    function handleText(msg) {
      if (msg.type === 'original') {
        if (!started) return;
        if (mode === null) switchMode('ai');
        const tgtFull = document.getElementById('langSelect').value;
        const tgtLang = tgtFull.split('-')[0]; // strip dialect for translation API
        const srcLang = msg.sourceLang || 'he';
        queueTranslation(msg.text, srcLang, tgtLang, tgtFull);
      } else if (msg.type === 'status') {
        if (msg.broadcasting) setStatus('yellow','⏳ שידור פעיל','לחץ להתחיל האזנה');
        else                  setStatus('muted','ממתין לשידור','המשדר טרם התחיל');
      } else if (msg.type === 'ended') {
        setStatus('red','🔴 השידור הסתיים','');
        iconWrap.classList.remove('active');
        iconWrap.classList.add('ended');
      }
    }

    // ── Translation ───────────────────────────────────────────────────────────
    async function translate(text, from, to) {
      try {
        const res = await fetch(
          '/api/translate?text=' + encodeURIComponent(text) + '&from=' + from + '&to=' + to + '&room=' + roomId
        );
        const d = await res.json();
        if (d.text) return d.text;
      } catch(_) {}
      return text;
    }

    // ── Display: show current chunk, wait for TTS ────────────────────────────
    async function showTranslation(original, translated, lang) {
      document.getElementById('translatedCard').textContent = translated;
      document.getElementById('originalCard').textContent   = original;
      addLog(original, translated);
      if (lang) await speakText(translated, lang);
    }

    // ── Log ───────────────────────────────────────────────────────────────────
    function addLog(src, tgt) {
      const wrap = document.getElementById('logWrap');
      wrap.style.display = 'flex';
      wrap.classList.remove('hidden');
      const entries = document.getElementById('logEntries');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML =
        `<div class="log-src">▶ ${src}</div>` +
        `<div class="log-tgt">← ${tgt}</div>`;
      entries.appendChild(entry);
      entries.scrollTop = entries.scrollHeight;
    }
    function clearLog() {
      document.getElementById('logEntries').innerHTML = '';
    }

    // ── Mode switching ────────────────────────────────────────────────────────
    function switchMode(m) {
      mode = m;
      if (m === 'audio') {
        document.getElementById('volWrap').classList.remove('hidden');
        iconWrap.textContent = '🔊';
        setStatus('green','🟢 מאזין לשידור','');
      } else {
        document.getElementById('aiDisplay').classList.remove('hidden');
        iconWrap.textContent = '🤖';
        setStatus('green','🟢 תרגום AI פעיל','');
      }
      iconWrap.classList.add('active');
    }

    // ── Tap to start ──────────────────────────────────────────────────────────
    function startListening() {
      if (started) return;
      started = true;
      initMediaSource();
      pendingChunks.forEach(c => enqueue(c));
      pendingChunks.length = 0;
      requestWakeLock();
    }

    function setStatus(cls, text, sub) {
      statusTxt.className = 'status ' + cls;
      statusTxt.textContent = text;
      subTxt.textContent = sub;
    }

    // ── TTS — Web Speech API ──────────────────────────────────────────────────
    async function speakText(text, lang) {
      if (!ttsOn) return;
      return new Promise(resolve => {
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = LANG_BCP47[lang] || lang;
        utt.rate = 1.05;
        const timeout = setTimeout(resolve, 15000);
        utt.onend  = () => { clearTimeout(timeout); resolve(); };
        utt.onerror = () => { clearTimeout(timeout); resolve(); };
        window.speechSynthesis.speak(utt);
      });
    }

    function toggleTTS() {
      ttsOn = !ttsOn;
      document.getElementById('ttsToggle').classList.toggle('on', ttsOn);
      if (!ttsOn) window.speechSynthesis.cancel();
    }

    // ── Audio pipeline (human mode) ───────────────────────────────────────────
    function initMediaSource() {
      mediaSource = new MediaSource();
      audioEl.src = URL.createObjectURL(mediaSource);
      mediaSource.addEventListener('sourceopen', () => {
        const mimes = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
        const mime  = mimes.find(t => MediaSource.isTypeSupported(t));
        if (!mime) { setStatus('red','❌ הדפדפן לא נתמך','השתמש ב-Chrome'); return; }
        try { sourceBuffer = mediaSource.addSourceBuffer(mime); }
        catch(e) { setStatus('red','❌ שגיאת אודיו', e.message); return; }
        sourceBuffer.mode = 'sequence';
        sourceBuffer.addEventListener('updateend', () => {
          msUpdating = false; processMS(); keepLive(); trimBuffer();
        });
        processMS();
        audioEl.play().catch(() => {});
      });
    }
    function enqueue(chunk) { msQueue.push(chunk); processMS(); }
    function processMS() {
      if (msUpdating || !msQueue.length || !sourceBuffer || sourceBuffer.updating) return;
      msUpdating = true;
      try { sourceBuffer.appendBuffer(msQueue.shift()); }
      catch(e) { msUpdating = false; if (e.name === 'QuotaExceededError') trimBuffer(); }
    }
    function keepLive() {
      if (!audioEl.buffered.length) return;
      const end = audioEl.buffered.end(audioEl.buffered.length - 1);
      if (end - audioEl.currentTime > 2.5) audioEl.currentTime = end - 0.15;
    }
    function trimBuffer() {
      if (!sourceBuffer || sourceBuffer.updating || !audioEl.buffered.length) return;
      const s = audioEl.buffered.start(0), c = audioEl.currentTime;
      if (c - s > 20) try { sourceBuffer.remove(s, c - 15); } catch(_) {}
    }
  </script>
</body>
  </html>
