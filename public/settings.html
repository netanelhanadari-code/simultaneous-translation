<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הגדרות — Babel Fish</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #12082a; --surface: #1e0f3a; --border: #3d1f6b;
      --accent: #8B2FC9; --text: #f0e8ff; --muted: #9b7fc4;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; padding: 1.5rem 1.25rem 2rem; gap: 1.1rem;
    }
    header {
      width: 100%; max-width: 360px;
      display: flex; align-items: center; gap: .75rem;
    }
    .back-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }
    h1 { font-size: 1.1rem; color: var(--text); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.2rem; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .field { display: flex; flex-direction: column; gap: .4rem; }
    label { font-size: .8rem; color: var(--muted); }
    input, select {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: .65rem .9rem; font-size: .95rem; direction: rtl; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }
    .save-btn {
      width: 100%; background: var(--accent); color: white;
      border: none; border-radius: 10px; padding: .75rem;
      font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: .3rem;
    }
    .save-btn:active { opacity: .85; }
    .saved-msg { text-align: center; color: #7fc47f; font-size: .85rem; min-height: 1.2em; }
    .emoji-grid {
      display: flex; flex-wrap: wrap; gap: .4rem; padding: .4rem 0;
    }
    .emoji-opt {
      font-size: 1.5rem; cursor: pointer; border-radius: 8px;
      padding: .2rem .3rem; border: 2px solid transparent;
      transition: border-color .1s;
    }
    .emoji-opt.selected { border-color: var(--accent); background: rgba(139,47,201,.15); }
    .emoji-clear {
      font-size: .8rem; color: var(--muted); cursor: pointer;
      text-decoration: underline; align-self: center;
    }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" id="backBtn">‹</button>
    <h1>⚙️ הגדרות</h1>
  </header>

  <div class="card">
    <div class="field">
      <label>שם</label>
      <input id="nameInput" type="text" placeholder="שמך" maxlength="30" autocomplete="name">
    </div>
    <div class="field">
      <label>אימוג'י (אופציונלי — יופיע ברשימת החברים)</label>
      <div class="emoji-grid" id="emojiGrid">
        <span class="emoji-opt">☮️</span><span class="emoji-opt">🕊️</span><span class="emoji-opt">✌️</span>
        <span class="emoji-opt">❤️</span><span class="emoji-opt">💜</span><span class="emoji-opt">💚</span>
        <span class="emoji-opt">🤝</span><span class="emoji-opt">🫂</span><span class="emoji-opt">🙏</span>
        <span class="emoji-opt">🤲</span><span class="emoji-opt">🌍</span><span class="emoji-opt">🌈</span>
        <span class="emoji-opt">✡️</span><span class="emoji-opt">☪️</span><span class="emoji-opt">✝️</span>
        <span class="emoji-opt">☯️</span><span class="emoji-opt">🕉️</span><span class="emoji-opt">🔯</span>
        <span class="emoji-opt">🌺</span><span class="emoji-opt">🌸</span><span class="emoji-opt">🌻</span>
        <span class="emoji-opt">💫</span><span class="emoji-opt">🌟</span><span class="emoji-opt">🦋</span>
      </div>
      <input id="emojiInput" type="text" placeholder="או הדבק כל אימוג'י 😊" maxlength="4" style="text-align:center;font-size:1.5rem;letter-spacing:.2rem;">
      <span class="emoji-clear" onclick="clearEmoji()">ללא אימוג'י</span>
    </div>
    <div class="field">
      <label>מספר טלפון (יוצג לחברים בקבוצה)</label>
      <input id="phoneInput" type="tel" placeholder="05X-XXXXXXX" dir="ltr" style="text-align:left;">
    </div>
    <div class="field">
      <label>שפה מועדפת</label>
      <select id="langSelect">
        <option value="ar">عربي</option>
        <option value="he">עברית</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="am">አማርኛ</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="uk">Українська</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
    <button class="save-btn" onclick="save()">שמור</button>
    <p class="saved-msg" id="savedMsg"></p>
  </div>

  <script>
    const nameInput = document.getElementById('nameInput');
    const langSelect = document.getElementById('langSelect');
    const savedMsg = document.getElementById('savedMsg');

    // Load current values
    nameInput.value = localStorage.getItem('bf_name') || '';
    langSelect.value = localStorage.getItem('bf_lang') || 'he';

    // Phone
    const phoneInput = document.getElementById('phoneInput');
    phoneInput.value = localStorage.getItem('bf_phone') || '';

    // Emoji input + grid
    const emojiInput = document.getElementById('emojiInput');
    emojiInput.value = localStorage.getItem('bf_emoji') || '';
    function clearEmoji() {
      emojiInput.value = '';
      document.querySelectorAll('.emoji-opt').forEach(o => o.classList.remove('selected'));
    }
    function markSelected() {
      const cur = emojiInput.value.trim();
      document.querySelectorAll('.emoji-opt').forEach(o => o.classList.toggle('selected', o.textContent.trim() === cur));
    }
    document.querySelectorAll('.emoji-opt').forEach(opt => {
      opt.addEventListener('click', () => { emojiInput.value = opt.textContent.trim(); markSelected(); });
    });
    emojiInput.addEventListener('input', markSelected);
    markSelected();

    // Back button — return to previous page
    const returnTo = new URLSearchParams(location.search).get('from') || '/home.html';
    document.getElementById('backBtn').onclick = () => location.href = returnTo;

    function save() {
      const name = nameInput.value.trim();
      const lang = langSelect.value;
      if (!name) { nameInput.focus(); return; }
      localStorage.setItem('bf_name', name);
      localStorage.setItem('bf_lang', lang);
      localStorage.setItem('bf_emoji', emojiInput.value.trim());
      localStorage.setItem('bf_phone', phoneInput.value.trim());
      savedMsg.textContent = '✓ נשמר';
      setTimeout(() => {
        savedMsg.textContent = '';
        location.href = returnTo;
      }, 800);
    }

    // Save on Enter
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  </script>
</body>
</html>
