<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הגדרות | Babel Fish | עומדים ביחד | نقف معاً</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #12082a; --surface: #1e0f3a; --border: #3d1f6b;
      --accent: #8B2FC9; --text: #f0e8ff; --muted: #9b7fc4;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; padding: 1.5rem 1.25rem 2rem; gap: 1.1rem;
    }
    header {
      width: 100%; max-width: 360px;
      display: flex; align-items: center; gap: .75rem;
    }
    .back-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }
    h1 { font-size: 1.1rem; color: var(--text); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.2rem; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .field { display: flex; flex-direction: column; gap: .4rem; }
    label { font-size: .8rem; color: var(--muted); }
    input, select {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: .65rem .9rem; font-size: .95rem; direction: rtl; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }
    .save-btn {
      width: 100%; background: var(--accent); color: white;
      border: none; border-radius: 10px; padding: .75rem;
      font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: .3rem;
    }
    .save-btn:active { opacity: .85; }
    .saved-msg { text-align: center; color: #7fc47f; font-size: .85rem; min-height: 1.2em; }
    .emoji-grid {
      display: flex; flex-wrap: wrap; gap: .4rem; padding: .4rem 0;
    }
    .emoji-opt {
      font-size: 1.5rem; cursor: pointer; border-radius: 8px;
      padding: .2rem .3rem; border: 2px solid transparent;
      transition: border-color .1s;
    }
    .emoji-opt.selected { border-color: var(--accent); background: rgba(139,47,201,.15); }
    .emoji-clear {
      font-size: .8rem; color: var(--muted); cursor: pointer;
      text-decoration: underline; align-self: center;
    }
    /* OTP overlay */
    #otpOverlay {
      display: none; position: fixed; inset: 0; z-index: 400;
      background: rgba(0,0,0,.6); align-items: center; justify-content: center;
    }
    #otpOverlay.open { display: flex; }
    #otpBox {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.8rem 1.4rem; width: 90%; max-width: 320px;
      display: flex; flex-direction: column; gap: 1rem; text-align: center;
    }
    #otpTitle { font-size: 1rem; font-weight: 600; }
    #otpSub { font-size: .82rem; color: var(--muted); }
    #otpInput {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: .75rem; font-size: 1.6rem; letter-spacing: .4rem;
      text-align: center; dir: ltr; outline: none;
    }
    #otpInput:focus { border-color: var(--accent); }
    #otpError { font-size: .8rem; color: #e07070; min-height: 1.1em; }
    #otpSubmit {
      width: 100%; background: var(--accent); color: white;
      border: none; border-radius: 10px; padding: .75rem;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    #otpResend {
      font-size: .8rem; color: var(--muted); cursor: pointer;
      text-decoration: underline; background: none; border: none;
    }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" id="backBtn">‹</button>
    <h1>⚙️ הגדרות</h1>
  </header>

  <div class="card">
    <!-- Avatar -->
    <div class="field" style="align-items:center;">
      <div id="avatarPreview" style="width:80px;height:80px;border-radius:50%;background:var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;border:2px solid var(--border);flex-shrink:0;" onclick="document.getElementById('avatarFile').click()">
        📷
      </div>
      <input type="file" id="avatarFile" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
      <span id="avatarClear" style="font-size:.8rem;color:var(--muted);cursor:pointer;text-decoration:underline;display:none;" onclick="clearAvatar()">הסר תמונה</span>
      <span style="font-size:.75rem;color:var(--muted);margin-top:.2rem;" id="avatarHint">תמונה מחליפה אימוג'י</span>
    </div>
    <canvas id="avatarCanvas" style="display:none;"></canvas>

    <!-- Name -->
    <div class="field">
      <label id="labelName">שם</label>
      <input id="nameInput" type="text" placeholder="שמך" maxlength="30" autocomplete="name">
    </div>

    <!-- Emoji (hidden when avatar exists) -->
    <div class="field" id="emojiField">
      <label id="labelEmoji">אימוג'י (אופציונלי — יופיע ברשימת החברים)</label>
      <div class="emoji-grid" id="emojiGrid">
        <span class="emoji-opt">☮️</span><span class="emoji-opt">🕊️</span><span class="emoji-opt">✌️</span>
        <span class="emoji-opt">❤️</span><span class="emoji-opt">💜</span><span class="emoji-opt">💚</span>
        <span class="emoji-opt">🤝</span><span class="emoji-opt">🫂</span><span class="emoji-opt">🙏</span>
        <span class="emoji-opt">🤲</span><span class="emoji-opt">🌍</span><span class="emoji-opt">🌈</span>
        <span class="emoji-opt">✡️</span><span class="emoji-opt">☪️</span><span class="emoji-opt">✝️</span>
        <span class="emoji-opt">☯️</span><span class="emoji-opt">🕉️</span><span class="emoji-opt">🔯</span>
        <span class="emoji-opt">🌺</span><span class="emoji-opt">🌸</span><span class="emoji-opt">🌻</span>
        <span class="emoji-opt">💫</span><span class="emoji-opt">🌟</span><span class="emoji-opt">🦋</span>
      </div>
      <input id="emojiInput" type="text" placeholder="או הדבק כל אימוג'י 😊" maxlength="4" style="text-align:center;font-size:1.5rem;letter-spacing:.2rem;">
      <span class="emoji-clear" id="emojiClear" onclick="clearEmoji()">ללא אימוג'י</span>
    </div>

    <!-- Phone -->
    <div class="field">
      <label id="labelPhone">מספר טלפון <span style="color:#e07070;">*</span></label>
      <input id="phoneInput" type="tel" placeholder="05X-XXXXXXX" dir="ltr" style="text-align:left;">
    </div>

    <!-- Communication language -->
    <div class="field">
      <label id="labelLang">שפת תקשורת — שפה שבה אני כותב/ת ומדבר/ת</label>
      <select id="langSelectMain" onchange="onMainLangChange(this.value)">
        <option value="he">עברית</option>
        <option value="ar">عربي</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="am">አማርኛ</option>
        <option value="other">אחר / Other...</option>
      </select>
      <input type="hidden" id="langSelect">
    </div>

    <!-- Language search sheet -->
    <div id="langSheetOverlay" onclick="closeLangSheet()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;"></div>
    <div id="langSheet" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--border);padding:1rem;z-index:301;max-height:70vh;display:none;flex-direction:column;gap:.5rem;">
      <div style="text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:.2rem;">בחר שפה / اختر لغة / Choose language</div>
      <input id="langSheetSearch" type="text" autocomplete="off" placeholder="חפש / Search..." oninput="filterLangSheet(this.value)" style="-webkit-user-select:text;user-select:text;">
      <div id="langSheetList" style="overflow-y:auto;flex:1;"></div>
    </div>

    <!-- UI language -->
    <div class="field">
      <label id="labelUiLang">שפת ממשק — שפת הכפתורים והתפריטים</label>
      <select id="uiLangSelect">
        <option value="he">עברית</option>
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>
    </div>

    <button class="save-btn" id="saveBtn" onclick="save()">🌐 תרגם</button>
    <p class="saved-msg" id="savedMsg"></p>
  </div>

  <!-- Name translations card -->
  <div class="card" id="nameTransCard" style="display:none;">
    <div class="field">
      <label id="labelNameTrans" style="font-size:.9rem;font-weight:600;color:var(--text);">🌐 תרגום שם — בדוק ותקן</label>
      <p style="font-size:.75rem;color:var(--muted);margin-top:.1rem;" id="nameTransHint">השם תורגם אוטומטית בשמירה. תקן לפי הצורך ולחץ שמור.</p>
    </div>
    <div class="field">
      <label id="labelNameEn">English</label>
      <input id="nameEnInput" type="text" dir="ltr" style="text-align:left;" placeholder="Your name in English">
    </div>
    <div class="field">
      <label id="labelNameHe">עברית</label>
      <input id="nameHeInput" type="text" dir="rtl" placeholder="שמך בעברית">
    </div>
    <div class="field">
      <label id="labelNameAr">العربية</label>
      <input id="nameArInput" type="text" dir="rtl" placeholder="اسمك بالعربية">
    </div>
    <button class="save-btn" id="retransFromNameBtn" onclick="retranslateFromName()" style="background:var(--surface);border:1px solid var(--border);color:var(--text);width:100%;">🌐 תרגם שמות</button>
    <button class="save-btn" id="saveTransBtn" onclick="saveAndClose()">✓ שמור הגדרות</button>
    <p class="saved-msg" id="transSavedMsg"></p>
  </div>

  <!-- OTP overlay -->
  <div id="otpOverlay">
    <div id="otpBox">
      <div id="otpTitle">אימות מספר טלפון</div>
      <div id="otpSub">שלחנו קוד ל-<strong id="otpPhoneDisplay"></strong></div>
      <input id="otpInput" type="tel" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
      <div id="otpError"></div>
      <button id="otpSubmit" onclick="submitOTP()">אמת</button>
      <button id="otpResend" onclick="resendOTP()">שלח שוב</button>
    </div>
  </div>

  <script>
    const nameInput    = document.getElementById('nameInput');
    const langSelect   = document.getElementById('langSelect');
    const uiLangSelect = document.getElementById('uiLangSelect');
    const savedMsg     = document.getElementById('savedMsg');

    const myUiLang = localStorage.getItem('bf_ui_lang') || localStorage.getItem('bf_lang') || 'he';
    if (myUiLang === 'ar') { document.documentElement.setAttribute('lang', 'ar'); }
    if (myUiLang === 'en') { document.documentElement.setAttribute('dir', 'ltr'); document.documentElement.setAttribute('lang', 'en'); }

    const SETT_UI = {
      he: { title: '⚙️ הגדרות', name: 'שם', namePh: 'שמך', emoji: "אימוג'י (אופציונלי — יופיע ברשימת החברים)", emojiPh: "או הדבק כל אימוג'י 😊", emojiClear: "ללא אימוג'י", phone: 'מספר טלפון', phoneSub: 'משמש לזיהוי ייחודי + מוצג לחברים', lang: 'שפת תקשורת — שפה שבה אני כותב/ת ומדבר/ת', uiLang: 'שפת ממשק — שפת הכפתורים והתפריטים', save: '🌐 תרגם שם ושמור', saved: '✓ נשמר', avatarHint: 'תמונה מחליפה אימוג\'י', nameTrans: '🌐 תרגום שם — בדוק ותקן', nameTransHint: 'השם תורגם אוטומטית בשמירה. תקן לפי הצורך ולחץ שמור.', retrans: '🔁 תקן מאנגלית — תרגם מחדש מהשדה למעלה', saveTrans: '✓ שמור שמות', saving: '⏳ שומר ומתרגם...', translated: '✓ תורגם ונשמר', transError: 'שגיאה', otpTitle: 'אימות מספר טלפון', otpSub: 'שלחנו קוד ל-', otpSubmit: 'אמת', otpResend: 'שלח שוב', otpError: 'קוד שגוי', otpExpired: 'הקוד פג — שלח שוב', otpTooMany: 'יותר מדי ניסיונות', otpFail: 'שגיאה בשליחת SMS' },
      ar: { title: '⚙️ الإعدادات', name: 'الاسم', namePh: 'اسمك', emoji: 'إيموجي (اختياري — يظهر في قائمة الأعضاء)', emojiPh: 'أو الصق أي إيموجي 😊', emojiClear: 'بدون إيموجي', phone: 'رقم الهاتف', phoneSub: 'يُستخدم للتعريف الفريد + يُعرض للأعضاء', lang: 'لغة التواصل — اللغة التي أكتب وأتحدث بها', uiLang: 'لغة الواجهة — لغة الأزرار والقوائم', save: '🌐 ترجم الاسم واحفظ', saved: '✓ تم الحفظ', avatarHint: 'الصورة تحل محل الإيموجي', nameTrans: '🌐 ترجمة الاسم — راجع وصحّح', nameTransHint: 'تُرجم الاسم تلقائياً عند الحفظ. صحّح حسب الحاجة ثم احفظ.', retrans: '🔁 صحّح من الإنجليزية — أعد الترجمة من الحقل أعلاه', saveTrans: '✓ حفظ الأسماء', saving: '⏳ جارٍ الحفظ والترجمة...', translated: '✓ تمت الترجمة والحفظ', transError: 'خطأ', otpTitle: 'التحقق من رقم الهاتف', otpSub: 'أرسلنا رمزاً إلى ', otpSubmit: 'تحقق', otpResend: 'أعد الإرسال', otpError: 'رمز خاطئ', otpExpired: 'انتهت صلاحية الرمز — أعد الإرسال', otpTooMany: 'محاولات كثيرة جداً', otpFail: 'خطأ في إرسال الرسالة' },
      en: { title: '⚙️ Settings', name: 'Name', namePh: 'Your name', emoji: 'Emoji (optional — shown in members list)', emojiPh: 'Or paste any emoji 😊', emojiClear: 'No emoji', phone: 'Phone number', phoneSub: 'Used for unique ID + shown to members', lang: 'Communication language — language I write and speak in', uiLang: 'Interface language — language of buttons and menus', save: '🌐 Translate name & save', saved: '✓ Saved', avatarHint: 'Photo replaces emoji', nameTrans: '🌐 Name translation — review & fix', nameTransHint: 'Your name was auto-translated on save. Correct as needed and save.', retrans: '🔁 Fix from English — re-translate from the field above', saveTrans: '✓ Save names', saving: '⏳ Saving & translating...', translated: '✓ Translated & saved', transError: 'Error', otpTitle: 'Verify phone number', otpSub: 'We sent a code to ', otpSubmit: 'Verify', otpResend: 'Resend', otpError: 'Wrong code', otpExpired: 'Code expired — resend', otpTooMany: 'Too many attempts', otpFail: 'Failed to send SMS' },
    };
    function applySettUI(su) {
      document.querySelector('h1').textContent          = su.title;
      document.getElementById('labelName').textContent  = su.name;
      nameInput.placeholder                             = su.namePh;
      document.getElementById('labelEmoji').textContent = su.emoji;
      document.getElementById('emojiInput').placeholder = su.emojiPh;
      document.getElementById('emojiClear').textContent = su.emojiClear;
      document.getElementById('labelPhone').innerHTML   = `${su.phone} <span style="color:#e07070;">*</span> <small style="font-weight:normal;color:var(--muted)">(${su.phoneSub})</small>`;
      document.getElementById('labelLang').textContent  = su.lang;
      document.getElementById('labelUiLang').textContent= su.uiLang;
      document.getElementById('saveBtn').textContent    = su.save;
      document.getElementById('avatarHint').textContent = su.avatarHint;
      // Name translation card
      if (su.nameTrans)     document.getElementById('labelNameTrans').textContent  = su.nameTrans;
      if (su.nameTransHint) document.getElementById('nameTransHint').textContent   = su.nameTransHint;
      if (su.retrans)       document.getElementById('retransBtn').textContent      = su.retrans;
      if (su.saveTrans)     document.getElementById('saveTransBtn').textContent    = su.saveTrans;
    }
    const su = SETT_UI[myUiLang] || SETT_UI.he;
    applySettUI(su);

    // If lang not in built-in dictionary → try DB, then translate+cache
    if (!SETT_UI[myUiLang]) {
      (async () => {
        try {
          const cached = await fetch(`/api/page-content?lang=${encodeURIComponent(myUiLang)}`).then(r => r.json());
          const keys = ['title','name','namePh','emoji','emojiPh','emojiClear',
                        'phone','phoneSub','lang','uiLang','save','saved','avatarHint',
                        'nameTrans','nameTransHint','retrans','saveTrans','saving','translated','transError'];
          const fromDB = {};
          keys.forEach(k => { if (cached['sett_' + k]) fromDB[k] = cached['sett_' + k]; });
          if (Object.keys(fromDB).length === keys.length) { applySettUI(fromDB); return; }
          // Translate missing
          const toTranslate = {};
          keys.forEach(k => { if (!fromDB[k]) toTranslate['sett_' + k] = SETT_UI.he[k]; });
          const result = await fetch('/api/page-content/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lang: myUiLang, texts: toTranslate })
          }).then(r => r.json());
          const su2 = { ...fromDB };
          Object.entries(result).forEach(([k, v]) => { su2[k.replace(/^sett_/, '')] = v; });
          applySettUI(su2);
        } catch(e) { /* keep default */ }
      })();
    }

    // ── Language search ───────────────────────────────────────────────────────
    const ALL_LANGS = [
      { code:'ar', name:'عربي', en:'Arabic' },
      { code:'he', name:'עברית', en:'Hebrew' },
      { code:'en', name:'English', en:'English' },
      { code:'ru', name:'Русский', en:'Russian' },
      { code:'am', name:'አማርኛ', en:'Amharic' },
      { code:'fr', name:'Français', en:'French' },
      { code:'es', name:'Español', en:'Spanish' },
      { code:'uk', name:'Українська', en:'Ukrainian' },
      { code:'de', name:'Deutsch', en:'German' },
      { code:'pt', name:'Português', en:'Portuguese' },
      { code:'it', name:'Italiano', en:'Italian' },
      { code:'sv', name:'Svenska', en:'Swedish' },
      { code:'nl', name:'Nederlands', en:'Dutch' },
      { code:'pl', name:'Polski', en:'Polish' },
      { code:'tr', name:'Türkçe', en:'Turkish' },
      { code:'fa', name:'فارسی', en:'Persian' },
      { code:'ur', name:'اردو', en:'Urdu' },
      { code:'hi', name:'हिन्दी', en:'Hindi' },
      { code:'zh', name:'中文', en:'Chinese' },
      { code:'ja', name:'日本語', en:'Japanese' },
      { code:'ko', name:'한국어', en:'Korean' },
      { code:'ro', name:'Română', en:'Romanian' },
      { code:'cs', name:'Čeština', en:'Czech' },
      { code:'hu', name:'Magyar', en:'Hungarian' },
      { code:'fi', name:'Suomi', en:'Finnish' },
      { code:'da', name:'Dansk', en:'Danish' },
      { code:'no', name:'Norsk', en:'Norwegian' },
      { code:'el', name:'Ελληνικά', en:'Greek' },
      { code:'vi', name:'Tiếng Việt', en:'Vietnamese' },
      { code:'id', name:'Indonesia', en:'Indonesian' },
      { code:'th', name:'ภาษาไทย', en:'Thai' },
      { code:'bg', name:'Български', en:'Bulgarian' },
      { code:'hr', name:'Hrvatski', en:'Croatian' },
      { code:'sk', name:'Slovenčina', en:'Slovak' },
      { code:'ms', name:'Melayu', en:'Malay' },
    ];

    const MAIN_LANGS = ['he','ar','en','ru','am'];

    function onMainLangChange(val) {
      if (val === 'other') {
        openLangSheet();
      } else {
        document.getElementById('langSelect').value = val;
      }
    }

    function openLangSheet() {
      const overlay = document.getElementById('langSheetOverlay');
      const sheet   = document.getElementById('langSheet');
      overlay.style.display = '';
      sheet.style.display = 'flex';
      filterLangSheet('');
      setTimeout(() => document.getElementById('langSheetSearch').focus(), 100);
    }

    function closeLangSheet() {
      document.getElementById('langSheetOverlay').style.display = 'none';
      document.getElementById('langSheet').style.display = 'none';
      // if nothing was picked, revert select to previous valid value
      const cur = document.getElementById('langSelect').value;
      const sel = document.getElementById('langSelectMain');
      if (!cur) sel.value = 'he';
    }

    function filterLangSheet(q) {
      const lower = q.toLowerCase();
      const filtered = q
        ? ALL_LANGS.filter(l => l.name.toLowerCase().includes(lower) || l.en.toLowerCase().includes(lower))
        : ALL_LANGS;
      document.getElementById('langSheetList').innerHTML = filtered.map(l => `
        <div onclick="selectLang('${l.code}','${l.name} — ${l.en}')"
          style="padding:.65rem .8rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:.9rem;">
          <span>${l.name}</span><span style="color:var(--muted);font-size:.78rem;">${l.en}</span>
        </div>`).join('');
    }

    function selectLang(code, label) {
      const sel = document.getElementById('langSelectMain');
      // add option if not exists
      if (!sel.querySelector(`option[value="${code}"]`)) {
        const opt = document.createElement('option');
        opt.value = code; opt.textContent = label;
        sel.insertBefore(opt, sel.querySelector('option[value="other"]'));
      } else {
        sel.querySelector(`option[value="${code}"]`).textContent = label;
      }
      sel.value = code;
      document.getElementById('langSelect').value = code;
      closeLangSheet();
    }

    // Load current values
    nameInput.value    = localStorage.getItem('bf_name') || '';
    const savedLang = localStorage.getItem('bf_lang') || 'he';
    document.getElementById('langSelect').value = savedLang;
    if (MAIN_LANGS.includes(savedLang)) {
      document.getElementById('langSelectMain').value = savedLang;
    } else {
      const savedLangObj = ALL_LANGS.find(l => l.code === savedLang);
      if (savedLangObj) selectLang(savedLang, `${savedLangObj.name} — ${savedLangObj.en}`);
    }
    uiLangSelect.value = myUiLang;
    document.getElementById('phoneInput').value = localStorage.getItem('bf_phone') || '';

    // ── Avatar ────────────────────────────────────────────────────────────────
    function loadAvatarPreview() {
      const av = localStorage.getItem('bf_avatar');
      const preview  = document.getElementById('avatarPreview');
      const clearBtn = document.getElementById('avatarClear');
      const emojiField = document.getElementById('emojiField');
      if (av) {
        preview.innerHTML = `<img src="${av}" style="width:100%;height:100%;object-fit:cover;">`;
        clearBtn.style.display = '';
        emojiField.style.display = 'none'; // photo replaces emoji
      } else {
        preview.textContent = '📷';
        clearBtn.style.display = 'none';
        emojiField.style.display = ''; // show emoji picker
      }
    }
    loadAvatarPreview();

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.getElementById('avatarCanvas');
          canvas.width = canvas.height = 40;
          const ctx = canvas.getContext('2d');
          const size = Math.min(img.width, img.height);
          const ox = (img.width - size) / 2;
          const oy = (img.height - size) / 2;
          ctx.drawImage(img, ox, oy, size, size, 0, 0, 40, 40);
          localStorage.setItem('bf_avatar', canvas.toDataURL('image/jpeg', 0.75));
          loadAvatarPreview();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearAvatar() {
      localStorage.removeItem('bf_avatar');
      document.getElementById('avatarFile').value = '';
      loadAvatarPreview();
    }

    // ── Emoji ─────────────────────────────────────────────────────────────────
    const emojiInput = document.getElementById('emojiInput');
    emojiInput.value = localStorage.getItem('bf_emoji') || '';
    function clearEmoji() {
      emojiInput.value = '';
      document.querySelectorAll('.emoji-opt').forEach(o => o.classList.remove('selected'));
    }
    function markSelected() {
      const cur = emojiInput.value.trim();
      document.querySelectorAll('.emoji-opt').forEach(o => o.classList.toggle('selected', o.textContent.trim() === cur));
    }
    document.querySelectorAll('.emoji-opt').forEach(opt => {
      opt.addEventListener('click', () => { emojiInput.value = opt.textContent.trim(); markSelected(); });
    });
    emojiInput.addEventListener('input', markSelected);
    markSelected();

    // ── OTP ───────────────────────────────────────────────────────────────────
    let _otpPhone = '';
    let _otpResolve = null;

    function applyOtpUI() {
      document.getElementById('otpTitle').textContent  = su.otpTitle  || 'אימות מספר טלפון';
      document.getElementById('otpSubmit').textContent = su.otpSubmit || 'אמת';
      document.getElementById('otpResend').textContent = su.otpResend || 'שלח שוב';
    }

    async function requestOTP(phone) {
      _otpPhone = phone;
      document.getElementById('otpPhoneDisplay').textContent = phone;
      document.getElementById('otpSub').childNodes[0].textContent = su.otpSub || 'שלחנו קוד ל-';
      document.getElementById('otpError').textContent = '';
      document.getElementById('otpInput').value = '';
      applyOtpUI();

      const r = await fetch('/api/send-otp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        throw new Error(d.error || 'send_fail');
      }
      document.getElementById('otpOverlay').classList.add('open');
      document.getElementById('otpInput').focus();

      return new Promise(resolve => { _otpResolve = resolve; });
    }

    async function submitOTP() {
      const code = document.getElementById('otpInput').value.trim();
      if (code.length < 6) return;
      const btn = document.getElementById('otpSubmit');
      btn.disabled = true;
      const r = await fetch('/api/verify-otp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: _otpPhone, code })
      });
      btn.disabled = false;
      if (r.ok) {
        document.getElementById('otpOverlay').classList.remove('open');
        if (_otpResolve) { _otpResolve(true); _otpResolve = null; }
        return;
      }
      const d = await r.json().catch(() => ({}));
      const errMap = { invalid: su.otpError, expired: su.otpExpired, too_many: su.otpTooMany };
      document.getElementById('otpError').textContent = errMap[d.error] || su.otpError || 'שגיאה';
      if (d.error === 'expired' || d.error === 'too_many') {
        if (_otpResolve) { _otpResolve(false); _otpResolve = null; }
        document.getElementById('otpOverlay').classList.remove('open');
      }
    }

    async function resendOTP() {
      document.getElementById('otpError').textContent = '';
      document.getElementById('otpInput').value = '';
      try {
        const r = await fetch('/api/send-otp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: _otpPhone })
        });
        if (!r.ok) throw new Error();
      } catch(e) {
        document.getElementById('otpError').textContent = su.otpFail || 'שגיאה';
      }
    }

    document.getElementById('otpInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitOTP();
    });

    // ── Back button ───────────────────────────────────────────────────────────
    const returnTo = new URLSearchParams(location.search).get('from') || '/home.html';
    document.getElementById('backBtn').onclick = () => location.href = returnTo;

    // ── Save ──────────────────────────────────────────────────────────────────
    async function save() {
      const name  = nameInput.value.trim();
      const lang  = langSelect.value;
      const phone = document.getElementById('phoneInput').value.trim();
      if (!name) { nameInput.focus(); return; }
      if (!lang) { document.getElementById('langSearch').focus(); return; }
      if (!phone) {
        const pi = document.getElementById('phoneInput');
        pi.focus();
        pi.style.borderColor = '#e07070';
        setTimeout(() => pi.style.borderColor = '', 2000);
        return;
      }

      const oldPhone = localStorage.getItem('bf_phone') || '';
      // Require OTP when phone is new or changed
      if (phone !== oldPhone) {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.textContent = '⏳';
        let verified = false;
        try {
          verified = await requestOTP(phone);
        } catch(e) {
          savedMsg.textContent = su.otpFail || 'שגיאה בשליחת SMS';
          setTimeout(() => { savedMsg.textContent = ''; }, 3000);
          btn.disabled = false;
          btn.textContent = su.save;
          return;
        }
        btn.disabled = false;
        btn.textContent = su.save;
        if (!verified) return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = su.saving || '⏳';

      const oldName = localStorage.getItem('bf_name') || '';
      localStorage.setItem('bf_name',    name);
      localStorage.setItem('bf_lang',    lang);
      localStorage.setItem('bf_ui_lang', uiLangSelect.value);
      localStorage.setItem('bf_emoji',   emojiInput.value.trim());
      localStorage.setItem('bf_phone',   phone);
      // Name changed for an already-registered user — reattribute past messages
      if (oldName && oldPhone && oldName !== name) {
        try {
          await fetch('/api/rename-member', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: oldPhone, oldName, newName: name })
          });
        } catch(e) { console.error('rename-member:', e); }
      }

      // Auto-translate name in the background (fire-and-forget — don't block redirect)
      try {
        const tr = await fetch('/api/profile/translate-name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        }).then(r => r.json());
        // Persist translations to server
        await fetch('/api/profile/name-translations', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, name_translations: tr })
        });
        currentNameTrans = tr;
        document.getElementById('nameEnInput').value = tr.en || '';
        document.getElementById('nameHeInput').value = tr.he || '';
        document.getElementById('nameArInput').value = tr.ar || '';
      } catch(e) { console.error('auto-translate:', e); }

      savedMsg.textContent = su.saved || '✓';
      btn.disabled = false;
      btn.textContent = su.save || '🌐 תרגם';
      document.getElementById('nameTransCard').style.display = '';
      setTimeout(() => { savedMsg.textContent = ''; }, 1500);
    }

    async function saveAndClose() {
      await saveNameTranslations();
      location.href = returnTo;
    }

    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });

    // ── Name translations ─────────────────────────────────────────────────────
    let currentNameTrans = {};

    async function loadNameTranslations() {
      const phone = localStorage.getItem('bf_phone') || '';
      if (!phone) return;
      document.getElementById('nameTransCard').style.display = '';
      try {
        const profile = await fetch(`/api/profile?phone=${encodeURIComponent(phone)}`).then(r => r.json());
        currentNameTrans = profile.name_translations || {};
        document.getElementById('nameEnInput').value = currentNameTrans.en || '';
        document.getElementById('nameHeInput').value = currentNameTrans.he || '';
        document.getElementById('nameArInput').value = currentNameTrans.ar || '';
      } catch(e) { console.error('loadNameTranslations:', e); }
    }

    async function retranslateFromName() {
      const name = nameInput.value.trim();
      const phone = localStorage.getItem('bf_phone') || '';
      if (!name) return;
      const btn = document.getElementById('retransFromNameBtn');
      btn.disabled = true; btn.textContent = '⏳';
      try {
        const tr = await fetch('/api/profile/translate-name', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        }).then(r => r.json());
        if (phone) {
          await fetch('/api/profile/name-translations', {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, name_translations: tr })
          }).catch(() => {});
        }
        currentNameTrans = tr;
        document.getElementById('nameEnInput').value = tr.en || '';
        document.getElementById('nameHeInput').value = tr.he || '';
        document.getElementById('nameArInput').value = tr.ar || '';
        document.getElementById('transSavedMsg').textContent = su.translated || '✓';
        setTimeout(() => { document.getElementById('transSavedMsg').textContent = ''; }, 2000);
      } catch(e) { console.error('retranslateFromName:', e); }
      btn.disabled = false; btn.textContent = '🌐 תרגם';
    }

    async function retranslateNames() {
      const phone = localStorage.getItem('bf_phone') || '';
      const en = document.getElementById('nameEnInput').value.trim();
      if (!phone || !en) return;
      const btn = document.getElementById('retransBtn');
      btn.disabled = true; btn.textContent = '⏳';
      try {
        const r = await fetch('/api/profile/name-translations', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, name_translations: { ...currentNameTrans, en } })
        });
        const data = await r.json();
        currentNameTrans = data.name_translations || {};
        document.getElementById('nameEnInput').value = currentNameTrans.en || en;
        document.getElementById('nameHeInput').value = currentNameTrans.he || '';
        document.getElementById('nameArInput').value = currentNameTrans.ar || '';
        document.getElementById('transSavedMsg').textContent = su.translated || '✓';
        setTimeout(() => { document.getElementById('transSavedMsg').textContent = ''; }, 2000);
      } catch(e) { console.error('retranslateNames:', e); }
      btn.disabled = false; btn.textContent = su.retrans || '🔁';
    }

    async function saveNameTranslations() {
      const phone = localStorage.getItem('bf_phone') || '';
      if (!phone) return;
      const en = document.getElementById('nameEnInput').value.trim();
      const he = document.getElementById('nameHeInput').value.trim();
      const ar = document.getElementById('nameArInput').value.trim();
      const btn = document.getElementById('saveTransBtn');
      btn.disabled = true;
      try {
        await fetch('/api/profile/name-translations', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, name_translations: { en, he, ar } })
        });
        currentNameTrans = { en, he, ar };
        document.getElementById('transSavedMsg').textContent = su.translated || '✓';
        setTimeout(() => { document.getElementById('transSavedMsg').textContent = ''; }, 2000);
      } catch(e) {
        document.getElementById('transSavedMsg').textContent = su.transError || '!';
        console.error('saveNameTranslations:', e);
      } finally {
        btn.disabled = false;
      }
    }


    loadNameTranslations();
  </script>
  <script src="/pull-refresh.js"></script>
</body>
</html>
