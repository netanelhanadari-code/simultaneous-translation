<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Babel Fish | עומדים ביחד | نقف معاً</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Babel Fish">
  <link rel="apple-touch-icon" href="/babel-fish.png">
  <meta name="theme-color" content="#8B2FC9">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { -webkit-user-select: none; user-select: none; }
    .bubble-text, .bubble-original { -webkit-user-select: text; user-select: text; }
    :root {
      --bg: #12082a; --surface: #1e0f3a; --border: #3d1f6b;
      --accent: #8B2FC9; --accent2: #7928b0; --text: #f0e8ff; --muted: #9b7fc4;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      height: calc(var(--vh, 1vh) * 100);
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: .7rem 1rem; display: flex; align-items: center; gap: .7rem;
      flex-shrink: 0;
    }
    .back-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 0 .2rem;
    }
    .room-info { flex: 1; min-width: 0; }
    .room-name { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-code {
      font-size: .72rem; color: var(--muted); cursor: pointer;
      display: inline-flex; align-items: center; gap: .25rem;
    }
    .lang-badge {
      background: var(--border); border-radius: 6px;
      padding: .2rem .55rem; font-size: .72rem; color: var(--muted); flex-shrink: 0;
    }
    #messages {
      flex: 1; min-height: 0; overflow-y: scroll; overflow-x: hidden;
      overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    #messages-inner {
      display: flex; flex-direction: column; gap: .65rem;
      padding: .9rem 1rem; min-height: 100%;
    }
    .empty { text-align: center; color: var(--muted); font-size: .9rem; margin: auto; }
    .bubble { max-width: 82%; display: flex; flex-direction: column; gap: .18rem; }
    .bubble.mine  { align-self: flex-start; }
    .bubble.other { align-self: flex-end; }
    .bubble-inner { padding: .55rem .85rem; border-radius: 12px; line-height: 1.5; transition: opacity .15s; }
    .bubble-inner.long-press-active { opacity: .55; }
    .bubble.mine  .bubble-inner { background: var(--accent2); border-radius: 12px 4px 12px 12px; border: 1px solid var(--accent); }
    .bubble.other .bubble-inner { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 12px 12px 12px; }
    .bubble.mine .bubble-text { font-weight: 500; }
    .bubble-sender { font-size: .7rem; color: var(--muted); padding: 0 .2rem; display: flex; align-items: center; gap: .3rem; }
    .bubble-sender .avatar { font-size: 1rem; }
    .bubble-main-row { display: flex; align-items: center; gap: .6rem; width: 100%; }
    .bubble-main-row .bubble-text { flex: 1; min-width: 0; }
    .bubble-text { font-size: .95rem; }
    .bubble-original {
      font-size: .75rem; color: var(--muted); margin-top: .3rem;
      padding-top: .3rem; border-top: 1px solid rgba(255,255,255,.08);
      display: none;
    }
    .bubble-original.visible { display: block; }
    .bubble-footer { display: flex; align-items: center; justify-content: space-between; padding: 0 .2rem; gap: .4rem; }
    /* Image bubbles */
    .bubble-image { display: block; max-width: 100%; border-radius: 8px; cursor: pointer; }
    .bubble-image-wrap { padding: .35rem .35rem .1rem; }
    /* Image upload button */
    #attachBtn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); font-size: 1.1rem; width: 38px; height: 38px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: border-color .15s, color .15s;
    }
    #attachBtn:hover { border-color: var(--accent); color: var(--accent); }
    #attachBtn.uploading { opacity: .5; pointer-events: none; }
    .unread-sep { display: flex; align-items: center; gap: .5rem; margin: .6rem 0; color: var(--accent); font-size: .78rem; font-weight: 600; }
    .unread-sep::before, .unread-sep::after { content: ''; flex: 1; height: 1px; background: var(--accent); opacity: .4; }
    .reply-quote {
      font-size: .75rem; color: var(--muted);
      border-right: 3px solid var(--accent); padding: .25rem .55rem;
      margin-bottom: .3rem; border-radius: 0 4px 4px 0;
      background: rgba(139,47,201,.08); cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .reply-quote strong { color: var(--text); display: block; font-size: .7rem; }
    .reply-bar {
      display: none; align-items: center; gap: .5rem;
      border-bottom: 1px solid var(--accent);
      padding: .35rem .8rem; font-size: .8rem; color: var(--muted);
    }
    .reply-bar.open { display: flex; }
    .reply-bar-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reply-bar strong { color: var(--text); }
    .reply-cancel { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; flex-shrink: 0; }
    .bubble-time { font-size: .67rem; color: var(--muted); }
    .icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: .8rem; padding: 0; line-height: 1;
    }
    .icon-btn:active { color: var(--text); }

    /* Long-press message action menu (bottom sheet) */
    #msgMenuOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 200; display: none;
    }
    #msgMenuOverlay.open { display: block; }
    #msgMenu {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0; padding: .5rem;
      padding-bottom: calc(.5rem + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column; gap: .2rem;
    }
    .msg-menu-btn {
      background: none; border: none; color: var(--text);
      font-size: .95rem; text-align: right; padding: .85rem 1rem;
      border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: .6rem;
    }
    .msg-menu-btn:active { background: var(--bg); }
    .msg-menu-btn.danger { color: #e07070; }
    .msg-menu-cancel { color: var(--muted); border-top: 1px solid var(--border); margin-top: .2rem; padding-top: .85rem; }

    /* Inline edit mode */
    .bubble-edit-area {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--accent); border-radius: 10px;
      padding: .5rem .7rem; font-size: .95rem; font-family: inherit;
      resize: none; direction: auto;
    }
    .bubble-edit-actions { display: flex; gap: .4rem; margin-top: .4rem; justify-content: flex-end; }
    .bubble-edit-actions button {
      border: none; border-radius: 8px; padding: .35rem .8rem; font-size: .8rem; cursor: pointer;
    }
    .bubble-edit-save { background: var(--accent); color: #fff; }
    .bubble-edit-cancel { background: var(--border); color: var(--text); }

    /* Members bar */
    #members-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: .35rem .6rem .35rem 1rem; display: flex; gap: .5rem; flex-wrap: nowrap;
      flex-shrink: 0; overflow: hidden; align-items: center;
    }
    #members-bar.expanded { flex-wrap: wrap; overflow-y: auto; max-height: 8rem; }
    #members-toggle {
      flex-shrink: 0; order: 999; margin-right: auto;
      background: none; border: 1px solid var(--border); border-radius: 10px;
      color: var(--muted); font-size: .7rem; padding: .18rem .5rem;
      cursor: pointer; white-space: nowrap; line-height: 1.4;
    }
    #members-toggle:hover { border-color: var(--accent); color: var(--accent); }
    #members-panel {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: .3rem .8rem .5rem; display: none; flex-direction: column; gap: .15rem;
      max-height: 14rem; overflow-y: auto; flex-shrink: 0;
    }
    #members-panel.open { display: flex; }
    .member-row {
      display: flex; align-items: center; gap: .5rem;
      padding: .35rem .3rem; border-radius: 8px; font-size: .83rem; color: var(--muted);
    }
    .member-row.online { color: var(--text); }
    .member-row.me { color: var(--accent); }
    .member-row .dot { width: 6px; height: 6px; border-radius: 50%; background: #555; flex-shrink: 0; }
    .member-row.online .dot { background: #4caf50; }
    .row-avatar { font-size: 1.1rem; flex-shrink: 0; }
    .row-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-phone { font-size: .78rem; color: var(--muted); direction: ltr; flex-shrink: 0; text-decoration: none; }
    .row-phone:hover { color: var(--accent); }
    .row-lang { font-size: .7rem; color: var(--muted); flex-shrink: 0; }
    .member-row[style*="cursor"]:hover { background: rgba(139,47,201,.1); }
    .member-chip {
      background: var(--border); border-radius: 20px;
      padding: .2rem .65rem; font-size: .72rem; color: var(--muted);
      display: flex; align-items: center; gap: .3rem; cursor: pointer;
      position: relative; user-select: none;
    }
    .member-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #555; flex-shrink: 0; }
    .member-chip.online .dot { background: #4caf50; }
    .member-chip.me { background: var(--accent2); border: 1px solid var(--accent); color: var(--text); font-weight: 600; order: -1; }
    .member-chip .chip-avatar { font-size: 1rem; line-height: 1; }
    .chip-avatar img, .row-avatar img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
    .member-chip .chip-avatar { width:22px;height:22px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .member-row .row-avatar { width:28px;height:28px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .member-chip .chip-label { max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-tooltip {
      position: fixed; background: #222; color: #fff; font-size: .75rem;
      border-radius: 6px; padding: .25rem .55rem; white-space: nowrap;
      pointer-events: none; z-index: 100; display: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }

    /* Footer / input area */
    footer {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: .5rem .8rem calc(.6rem + env(safe-area-inset-bottom, 0px)) .8rem;
      display: flex; flex-direction: column; gap: .3rem; flex-shrink: 0;
    }
    #textInput {
      flex: 1; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 20px;
      padding: .55rem 1rem; font-size: .95rem; outline: none;
      font-family: inherit; resize: none; max-height: 100px;
      direction: auto;
    }
    #textInput:focus { border-color: var(--accent); }
    #textInput::placeholder { color: var(--muted); }
    #sendBtn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      font-size: 1.1rem; display: none; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity .15s;
    }
    #recordBtn {
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--accent); border: none;
      cursor: pointer; font-size: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .15s;
      -webkit-user-select: none; user-select: none; touch-action: none; flex-shrink: 0;
    }
    #recordBtn.recording {
      background: #c0392b; transform: scale(1.05);
      animation: pulse 1s infinite;
    }
    .speak-main-btn {
      background: rgba(139,47,201,.18); border: 1.5px solid var(--accent);
      border-radius: 50%; width: 2.2rem; height: 2.2rem;
      font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .speak-main-btn:active { background: rgba(139,47,201,.35); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 4px rgba(192,57,43,.3); }
      50%      { box-shadow: 0 0 0 9px rgba(192,57,43,.1); }
    }
    #status { color: var(--muted); font-size: .75rem; min-width: 50px; text-align: center; flex-shrink: 0; }
    .consent-line {
      text-align: center; font-size: .68rem; color: var(--muted);
      padding: .2rem .8rem .35rem; flex-shrink: 0;
      background: var(--surface);
    }
    .consent-line a { color: var(--muted); text-decoration: underline; }
    .tts-toggle {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); border-radius: 20px; padding: .35rem .6rem;
      font-size: .8rem; cursor: pointer; flex-shrink: 0;
    }
    .tts-toggle.on { border-color: var(--accent); color: var(--accent); }
    .reactions { display: flex; flex-wrap: wrap; gap: .3rem; padding: .25rem .2rem 0; }
    .reaction-chip {
      background: var(--border); border-radius: 20px; padding: .15rem .5rem;
      font-size: .82rem; cursor: pointer; display: flex; align-items: center; gap: .2rem;
      border: 1px solid transparent; color: var(--text); transition: all .1s;
    }
    .reaction-chip.mine { border-color: var(--accent); background: rgba(139,47,201,.2); }
    .reaction-chip:active { opacity: .8; }
    .emoji-picker {
      display: none; gap: .2rem; padding: .35rem .5rem; margin-top: .3rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    .emoji-picker.open { display: flex; }
    .emoji-pick-btn {
      font-size: 1.3rem; cursor: pointer; padding: .2rem .25rem;
      border-radius: 8px; background: none; border: none;
    }
    .emoji-pick-btn:hover, .emoji-pick-btn:active { background: var(--border); }
    .dm-badge {
      font-size: .7rem; background: var(--border); border-radius: 6px;
      padding: .15rem .45rem; color: var(--muted);
    }

    /* QR / room settings sheet */
    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px 20px 0 0; border-bottom: none;
      padding: 1.4rem 1.5rem 2.5rem; width: 100%; max-width: 420px;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
    }
    .sheet h3 { font-size: 1rem; align-self: flex-start; }
    .sheet-close {
      position: absolute; top: 1rem; left: 1rem;
      background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer;
    }
    .qr-wrap { background: #fff; border-radius: 12px; padding: .7rem; }
    .qr-wrap img { display: block; width: 180px; height: 180px; }
    .join-url {
      font-size: .78rem; color: var(--muted); word-break: break-all; text-align: center;
      background: var(--bg); border-radius: 8px; padding: .5rem .8rem; width: 100%;
    }
    .copy-btn {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 10px; padding: .65rem; font-size: .95rem; cursor: pointer; font-weight: 600;
    }
    .sheet-section { width: 100%; display: flex; flex-direction: column; align-items: center; gap: .6rem; }
    .section-label { align-self: flex-start; font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .notif-check-label {
      display: flex; align-items: center; gap: .75rem; width: 100%; cursor: pointer;
      font-size: .95rem; padding: .65rem .9rem; background: var(--bg);
      border-radius: 10px; border: 1px solid var(--border);
    }
    .notif-check-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
    .sheet-btn-row { display: flex; gap: .5rem; width: 100%; }
    .sheet-member-row {
      display: flex; align-items: center; gap: .6rem;
      padding: .55rem .9rem; background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px;
      font-size: .9rem; color: var(--text);
    }
    .sheet-member-row.clickable { cursor: pointer; transition: background .12s; }
    .sheet-member-row.clickable:hover { background: rgba(255,255,255,.05); }
    .sheet-member-row.clickable:active { background: rgba(139,47,201,.15); }
    .sheet-member-me { color: var(--muted); font-size: .78rem; margin-right: auto; }
    .dm-action-row {
      display: flex; justify-content: center; padding: .3rem .8rem .5rem;
    }
    .dm-action-row button {
      background: var(--accent); border: none; color: #fff;
      border-radius: 10px; padding: .45rem 1.4rem;
      font-size: .88rem; font-weight: 600; cursor: pointer; font-family: inherit;
      box-shadow: 0 2px 8px rgba(139,47,201,.4);
    }
    .dm-action-row button:active { opacity: .85; }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" onclick="location.href='/home.html'">‹</button>
    <div class="room-info">
      <div class="room-name" id="roomNameEl">טוען...</div>
      <span class="room-code" id="codeEl" title="לחץ להעתיק">📋 ...</span>
    </div>
    <button class="tts-toggle" id="ttsBtn" onclick="toggleTTS()" title="קריאה אוטומטית">🔊</button>
    <button class="tts-toggle" id="notifyBtn" onclick="toggleNotify()" title="צליל התרעה">🔔</button>
    <button class="back-btn" id="roomSettingsBtn" onclick="openRoomSettings()" title="הגדרות קבוצה" style="display:none;">⚙️</button>
  </header>

  <div id="chip-tooltip" class="chip-tooltip"></div>
  <div id="members-bar">
    <button id="members-toggle" onclick="toggleMembersBar()"><span id="members-count">0</span> ▾</button>
  </div>
  <div id="members-panel"></div>
  <div id="messages"><div id="messages-inner"><div class="empty" id="emptyMsg">📭 אין הודעות עדיין<br><small>הקלד או לחץ והחזק את הכפתור לשליחה קולית</small></div></div></div>
  <div id="unreadBadge" onclick="dismissUnread()" style="display:none;position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border-radius:20px;padding:.35rem .9rem;font-size:.82rem;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:20;white-space:nowrap;"></div>

  <!-- Long-press message action menu -->
  <div id="msgMenuOverlay" onclick="closeMessageMenu()"></div>
  <div id="msgMenu" style="display:none;"></div>

  <div id="roomSettingsSheet" style="display:none;" class="sheet-overlay" onclick="if(event.target===this)closeRoomSettings()">
    <div class="sheet" style="position:relative;">
      <button class="sheet-close" onclick="closeRoomSettings()">✕</button>
      <h3 id="settingsTitle">הגדרות קבוצה</h3>

      <!-- שיתוף -->
      <div class="sheet-section">
        <div class="section-label" id="shareLabelEl">שיתוף</div>
        <div class="qr-wrap"><img id="qrImg" src="" alt="QR"></div>
        <div class="join-url" id="joinUrl"></div>
        <div class="sheet-btn-row">
          <button class="copy-btn" id="copyLinkBtn" onclick="copyJoinLink()" style="flex:1;">📋 העתק</button>
          <button class="copy-btn" id="whatsappShareBtn" onclick="shareWhatsapp()" style="flex:1;background:#25D366;">📱 וואטסאפ</button>
          <button class="copy-btn" id="emailShareBtn" onclick="shareEmail()" style="flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);">📧 מייל</button>
        </div>
      </div>

      <!-- התראות -->
      <div class="sheet-section">
        <div class="section-label" id="notifLabelEl">התראות</div>
        <label class="notif-check-label">
          <input type="checkbox" id="notifCheck">
          <span id="notifCheckText">קבל התראות על הודעות חדשות</span>
        </label>
        <p id="notifMsg" style="font-size:.78rem;color:var(--muted);text-align:center;min-height:1em;"></p>
      </div>

      <!-- שם הקבוצה (מייסד בלבד) -->
      <div id="renameSection" style="display:none;" class="sheet-section">
        <div class="section-label" id="editNameLabel">שם הקבוצה</div>
        <div style="display:flex;flex-direction:column;gap:.5rem;width:100%;">
          <input id="nameHe" placeholder="עברית" style="direction:rtl;width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.5rem .8rem;font-size:.9rem;">
          <input id="nameAr" placeholder="عربي" style="direction:rtl;width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.5rem .8rem;font-size:.9rem;">
          <input id="nameEn" placeholder="English" style="direction:ltr;text-align:left;width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.5rem .8rem;font-size:.9rem;">
        </div>
        <div class="sheet-btn-row">
          <button class="copy-btn" id="translateNamesBtn" onclick="autoTranslateNames(event)" style="flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);">🔁 תרגם</button>
          <button class="copy-btn" id="saveNameBtn" onclick="saveRoomName()" style="flex:1;background:var(--accent);color:#fff;">✓ שמור</button>
        </div>
        <p id="nameMsg" style="font-size:.8rem;color:#7fc47f;text-align:center;min-height:1em;"></p>
      </div>
    </div>
  </div>

  <footer>
    <div class="reply-bar" id="replyBar">
      <span class="reply-bar-text" id="replyBarText"></span>
      <button class="reply-cancel" onclick="cancelReply()" title="בטל">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem;width:100%;">
      <textarea id="textInput" rows="1" placeholder="הקלד הודעה..."></textarea>
      <button id="sendBtn" onclick="sendText()" disabled>➤</button>
      <button id="attachBtn" onclick="document.getElementById('imageInput').click()" title="שלח תמונה">📎</button>
      <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" style="display:none;">
      <button id="recordBtn">🎤</button>
    </div>
    <canvas id="waveCanvas" style="display:none;width:100%;height:40px;border-radius:8px;margin:2px 0;"></canvas>
    <canvas id="imgCanvas" style="display:none;"></canvas>
    <div id="status" style="font-size:.8rem;color:var(--muted);text-align:center;min-height:1em;"></div>
  </footer>

  <script>
    // ── Real viewport height (fixes Android nav-bar / dvh instability) ──────
    // 100dvh is unreliable inside Android WebView/TWA when the system nav bar
    // shows/hides — this causes both the footer to hide behind the nav bar
    // and the scroll area to reflow mid-scroll (feels "shaky").
    // We compute the real height ourselves from window.innerHeight /
    // visualViewport and keep it in a CSS var instead of trusting dvh alone.
    function setRealVh() {
      const h = window.visualViewport?.height || window.innerHeight;
      document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
    }
    setRealVh();
    window.addEventListener('resize', setRealVh);
    window.addEventListener('orientationchange', () => setTimeout(setRealVh, 100));
    window.visualViewport?.addEventListener('resize', setRealVh);

    const params  = new URLSearchParams(location.search);
    const roomId  = params.get('room');

    // ── Registration guard ────────────────────────────────────────────────────
    if (!localStorage.getItem('bf_name') || !localStorage.getItem('bf_phone')) {
      location.href = '/settings.html?from=' + encodeURIComponent(location.href);
    }

    const myName   = localStorage.getItem('bf_name')    || 'אנונימי';
    const myLang   = localStorage.getItem('bf_lang')    || 'he';   // communication language
    const myUiLang = localStorage.getItem('bf_ui_lang') || myLang; // UI language
    const myEmoji  = localStorage.getItem('bf_emoji')   || '';
    const myPhone  = localStorage.getItem('bf_phone')   || '';

    if (!roomId) { location.href = '/home.html'; }
    const isDM = roomId.startsWith('D') && roomId.length <= 7;

    const LANG_NAMES = { he:'עברית', ar:'ערבית', en:'English', ru:'Русский', am:'አማርኛ' };
    const LANG_BCP47 = { he:'he-IL', ar:'ar-SA', en:'en-US', ru:'ru-RU', am:'am-ET', fr:'fr-FR', es:'es-ES', uk:'uk-UA', de:'de-DE', pt:'pt-BR', it:'it-IT', sv:'sv-SE', nl:'nl-NL', pl:'pl-PL', tr:'tr-TR', fa:'fa-IR', ur:'ur-PK', hi:'hi-IN', zh:'zh-CN', ja:'ja-JP', ko:'ko-KR', ro:'ro-RO', cs:'cs-CZ', hu:'hu-HU', fi:'fi-FI', da:'da-DK', no:'nb-NO', el:'el-GR', vi:'vi-VN', id:'id-ID', th:'th-TH', bg:'bg-BG', hr:'hr-HR', sk:'sk-SK', ms:'ms-MY' };

    let ttsOn = localStorage.getItem('bf_mute_tts') !== '0';
    let notifyOn = localStorage.getItem('bf_mute_notify') !== '0';
    let latestMsgTs = null;
    const displayedIds = new Set();
    const msgElements  = new Map(); // msgId → { reactionsEl, pickerEl }
    const REACTION_EMOJIS = ['❤️','👍','😂','😢','🤯','🙏','🦖'];

    // ── Reply state ────────────────────────────────────────────────────────
    let replyingTo = null; // { id, sender_name, text }
    const replyBar     = document.getElementById('replyBar');
    const replyBarText = document.getElementById('replyBarText');

    function startReply(msgId, senderName, text) {
      replyingTo = { id: msgId, sender_name: senderName, text };
      replyBarText.innerHTML = `<strong>${esc(senderName)}:</strong> ${esc(text.slice(0, 80))}${text.length > 80 ? '…' : ''}`;
      replyBar.classList.add('open');
      document.getElementById('textInput').focus();
    }
    function cancelReply() {
      replyingTo = null;
      replyBar.classList.remove('open');
    }

    function renderReactions(msgId, reactions) {
      const el = msgElements.get(String(msgId));
      if (!el) return;
      el.reactionsEl.innerHTML = '';
      Object.entries(reactions).forEach(([emoji, users]) => {
        if (!users.length) return;
        const chip = document.createElement('button');
        chip.className = 'reaction-chip' + (users.includes(myName) ? ' mine' : '');
        chip.innerHTML = `${emoji} <span>${users.length}</span>`;
        chip.title = users.join(', ');
        chip.addEventListener('click', () => sendReaction(msgId, emoji));
        el.reactionsEl.appendChild(chip);
      });
    }

    function togglePicker(msgId) {
      const el = msgElements.get(String(msgId));
      if (!el) return;
      // close all others
      msgElements.forEach((v, k) => { if (k !== String(msgId)) v.pickerEl.classList.remove('open'); });
      el.pickerEl.classList.toggle('open');
    }

    async function sendReaction(msgId, emoji) {
      const el = msgElements.get(String(msgId));
      if (el) el.pickerEl.classList.remove('open');
      try {
        await fetch(`/api/rooms/${roomId}/messages/${msgId}/react`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ emoji, name: myName })
        });
      } catch(e) { console.error('sendReaction:', e); }
    }
    const activeMembers = new Map();  // name → {lang, emoji} — online only
    const allMembers    = new Map();  // name → {lang, emoji} — all known

    // ── Member chip ────────────────────────────────────────────────────────
    const tooltip = document.getElementById('chip-tooltip');
    let tooltipTimer;
    function showTooltip(chip, text) {
      const r = chip.getBoundingClientRect();
      tooltip.textContent = text;
      tooltip.style.display = 'block';
      tooltip.style.top  = (r.top - 32) + 'px';
      tooltip.style.right = (window.innerWidth - r.right) + 'px';
      clearTimeout(tooltipTimer);
      tooltipTimer = setTimeout(() => { tooltip.style.display = 'none'; }, 2000);
    }

    function closeMembersPanel() {
      const panel = document.getElementById('members-panel');
      if (!panel.classList.contains('open')) return;
      panel.querySelectorAll('.dm-action-row').forEach(el => el.remove());
      panel.classList.remove('open');
      const btn = document.getElementById('members-toggle');
      const count = document.getElementById('members-count').textContent;
      btn.innerHTML = `<span id="members-count">${count}</span> ▾`;
    }
    function toggleMembersBar() {
      const panel = document.getElementById('members-panel');
      const isOpen = panel.classList.toggle('open');
      const btn = document.getElementById('members-toggle');
      const count = document.getElementById('members-count').textContent;
      btn.innerHTML = `<span id="members-count">${count}</span> ${isOpen ? '▴' : '▾'}`;
      if (isOpen) history.pushState({ membersOpen: true }, '');
      else panel.querySelectorAll('.dm-action-row').forEach(el => el.remove());
    }
    // Close panel when tapping messages area
    document.getElementById('messages').addEventListener('click', closeMembersPanel);
    // Close panel on browser back
    window.addEventListener('popstate', e => { closeMembersPanel(); });

    function renderMembers() {
      const bar = document.getElementById('members-bar');
      [...bar.querySelectorAll('.member-chip')].forEach(c => c.remove());
      const panel = document.getElementById('members-panel');
      panel.innerHTML = '';

      const merged = new Map([...allMembers]);
      activeMembers.forEach((v, k) => merged.set(k, { ...v, online: true }));
      const sorted = [...merged.entries()].sort(([a], [b]) => {
        if (a === myName) return -1; if (b === myName) return 1;
        const ao = activeMembers.has(a), bo = activeMembers.has(b);
        return ao === bo ? 0 : ao ? -1 : 1;
      });
      document.getElementById('members-count').textContent = merged.size;

      sorted.forEach(([name, { lang, emoji, phone, avatar, online, name_translations }]) => {
        // Display name: translated if available, otherwise original
        const displayName = (name_translations && name_translations[myUiLang]) || name;
        const shortDisplay = displayName.length > 8 ? displayName.slice(0, 8) + '…' : displayName;

        // chip (one-line bar)
        const chip = document.createElement('div');
        chip.className = 'member-chip' + (online ? ' online' : '') + (name === myName ? ' me' : '');
        const chipAvatar = avatar
          ? `<span class="chip-avatar"><img src="${avatar}" alt="${esc(displayName)}"></span>`
          : (emoji ? `<span class="chip-avatar">${emoji}</span>` : '');
        chip.innerHTML = `<span class="dot"></span>`
          + chipAvatar
          + `<span class="chip-label">${esc(shortDisplay)}</span>`;
        chip.addEventListener('click', () => {
          if (!panel.classList.contains('open')) toggleMembersBar();
        });
        bar.appendChild(chip);

        // panel row (expanded view)
        const row = document.createElement('div');
        row.className = 'member-row' + (online ? ' online' : '') + (name === myName ? ' me' : '');
        const rowAvatarHtml = avatar
          ? `<span class="row-avatar"><img src="${avatar}" alt="${esc(displayName)}"></span>`
          : `<span class="row-avatar">${emoji || '👤'}</span>`;
        row.innerHTML =
          `<span class="dot"></span>`
          + rowAvatarHtml
          + `<span class="row-name">${esc(displayName)}</span>`
          + (phone ? `<span class="row-phone">${esc(phone)}</span>` : '');
        row.style.cursor = 'pointer';
        row.addEventListener('click', () => {
          // TTS — read name aloud
          const utt = new SpeechSynthesisUtterance(name);
          if (/[؀-ۿ]/.test(name)) utt.lang = 'ar';
          else if (/[֐-׿]/.test(name)) utt.lang = 'he';
          else utt.lang = 'en';
          speechSynthesis.cancel();
          speechSynthesis.speak(utt);
          // Remove any existing DM action row
          panel.querySelectorAll('.dm-action-row').forEach(el => el.remove());
          // Show DM button for others
          if (name !== myName) {
            const dmRow = document.createElement('div');
            dmRow.className = 'dm-action-row';
            const dmBtn = document.createElement('button');
            dmBtn.textContent = ui.dmAction;
            dmBtn.onclick = () => { toggleMembersBar(); openDM(name); };
            dmRow.appendChild(dmBtn);
            row.insertAdjacentElement('afterend', dmRow);
          }
        });
        panel.appendChild(row);
      });
    }

    // Apply UI language
    const UI = {
      he: { placeholder: 'הקלד הודעה...', empty: '📭 אין הודעות עדיין<br><small>הקלד או לחץ והחזק לשליחה קולית</small>', members: 'חברים', record: 'לחץ והחזק להקלטה', settingsTitle: 'הגדרות קבוצה', copyLink: '📋 העתק קישור', linkCopied: '✓ הועתק!', notifOn: '🔔 התראות פעילות — לחץ לביטול', notifOff: '🔕 הפעל התראות לחדר זה', notifUnsupported: '🔕 לא נתמך בדפדפן זה', notifDenied: 'הרשאת התראות חסומה — שנה בהגדרות הדפדפן', notifCancelled: 'התראות בוטלו', notifActive: '✓ תקבל התראות כשמגיעות הודעות', notifNoKey: 'שרת לא מוגדר לפוש', notifNoPerm: 'לא אושרה הרשאה', editName: 'שם הקבוצה', saveName: 'שמור', nameSaved: '✓ נשמר', nameError: 'שגיאה', iosBanner: '📲 להוספת Babel Fish למסך הבית: לחץ <strong style="color:var(--text)">שתף ↑</strong> ← "הוסף למסך הבית" — ואז תקבל התראות גם כשהאפליקציה סגורה', deleteConfirm: 'למחוק את ההודעה?', editedTag: 'נערך', editAction: '✏️ ערוך', deleteAction: '🗑️ מחק', cancelAction: 'ביטול', saveAction: 'שמור', shareLabel: 'שיתוף', notifLabel: 'התראות', notifCheckText: 'קבל התראות על הודעות חדשות', translateBtn: '🔁 תרגם', copyBtn: '📋 העתק', whatsappBtn: '📱 וואטסאפ', emailBtn: '📧 מייל', dmAction: '💬 שיחה פרטית' },
      ar: { placeholder: 'اكتب رسالة...', empty: '📭 لا توجد رسائل بعد<br><small>اكتب أو اضغط مطولاً للإرسال الصوتي</small>', members: 'أعضاء', record: 'اضغط مطولاً للتسجيل', settingsTitle: 'إعدادات المجموعة', copyLink: '📋 نسخ الرابط', linkCopied: '✓ تم النسخ!', notifOn: '🔔 التنبيهات مفعّلة — اضغط للإلغاء', notifOff: '🔕 تفعيل التنبيهات لهذه الغرفة', notifUnsupported: '🔕 غير مدعوم في هذا المتصفح', notifDenied: 'إذن التنبيهات محظور — غيّر في إعدادات المتصفح', notifCancelled: 'تم إلغاء التنبيهات', notifActive: '✓ ستصلك تنبيهات عند وصول رسائل', notifNoKey: 'الخادم غير مهيأ للإشعارات', notifNoPerm: 'لم يتم منح الإذن', editName: 'اسم المجموعة', saveName: 'حفظ', nameSaved: '✓ تم الحفظ', nameError: 'خطأ', iosBanner: '📲 لإضافة Babel Fish إلى الشاشة الرئيسية: اضغط <strong style="color:var(--text)">مشاركة ↑</strong> ← "إضافة إلى الشاشة الرئيسية" — ثم ستصلك التنبيهات حتى عند إغلاق التطبيق', deleteConfirm: 'حذف الرسالة؟', editedTag: 'مُعدّلة', editAction: '✏️ تعديل', deleteAction: '🗑️ حذف', cancelAction: 'إلغاء', saveAction: 'حفظ', shareLabel: 'مشاركة', notifLabel: 'تنبيهات', notifCheckText: 'تلقّي تنبيهات على الرسائل الجديدة', translateBtn: '🔁 ترجم', copyBtn: '📋 نسخ', whatsappBtn: '📱 واتساب', emailBtn: '📧 بريد', dmAction: '💬 محادثة خاصة' },
      en: { placeholder: 'Type a message...', empty: '📭 No messages yet<br><small>Type or hold the button to record voice</small>', members: 'Members', record: 'Hold to record', settingsTitle: 'Group Settings', copyLink: '📋 Copy Link', linkCopied: '✓ Copied!', notifOn: '🔔 Notifications on — tap to disable', notifOff: '🔕 Enable notifications for this room', notifUnsupported: '🔕 Not supported in this browser', notifDenied: 'Notification permission blocked — change in browser settings', notifCancelled: 'Notifications disabled', notifActive: '✓ You will receive notifications when messages arrive', notifNoKey: 'Server not configured for push', notifNoPerm: 'Permission not granted', editName: 'Room Name', saveName: 'Save', nameSaved: '✓ Saved', nameError: 'Error', iosBanner: '📲 To add Babel Fish to your home screen: tap <strong style="color:var(--text)">Share ↑</strong> → "Add to Home Screen" — then you\'ll get notifications even when the app is closed', deleteConfirm: 'Delete this message?', editedTag: 'edited', editAction: '✏️ Edit', deleteAction: '🗑️ Delete', cancelAction: 'Cancel', saveAction: 'Save', shareLabel: 'Share', notifLabel: 'Notifications', notifCheckText: 'Receive notifications for new messages', translateBtn: '🔁 Translate', copyBtn: '📋 Copy', whatsappBtn: '📱 WhatsApp', emailBtn: '📧 Email', dmAction: '💬 Private chat' },
    };
    const ui = UI[myUiLang] || UI.he;
    document.getElementById('textInput').placeholder = ui.placeholder;
    if (myUiLang === 'ar') {
      document.documentElement.setAttribute('lang', 'ar');
      const emptyEl = document.getElementById('emptyMsg');
      if (emptyEl) emptyEl.innerHTML = ui.empty;
    } else if (myUiLang === 'en') {
      document.documentElement.setAttribute('dir', 'ltr');
      document.documentElement.setAttribute('lang', 'en');
      const emptyEl = document.getElementById('emptyMsg');
      if (emptyEl) emptyEl.innerHTML = ui.empty;
    }
    const _ttsBtn = document.getElementById('ttsBtn');
    _ttsBtn.classList.toggle('on', ttsOn);
    _ttsBtn.textContent = ttsOn ? '🔊' : '🔇';
    const _notifyBtn = document.getElementById('notifyBtn');
    _notifyBtn.classList.toggle('on', notifyOn);
    _notifyBtn.textContent = notifyOn ? '🔔' : '🔕';

    // ── Room code copy ─────────────────────────────────────────────────────
    const codeEl = document.getElementById('codeEl');
    codeEl.onclick = () => {
      navigator.clipboard.writeText(roomId).catch(() => {});
      codeEl.textContent = '✓ הועתק';
      setTimeout(() => codeEl.textContent = '📋 ' + roomId, 1800);
    };

    // ── Load history ───────────────────────────────────────────────────────
    async function loadRoom() {
      try {
        const r = await fetch('/api/rooms/' + roomId);
        if (!r.ok) { location.href = '/home.html'; return; }
        const data = await r.json();
        const names = data.names || {};
        if (!isDM) currentRoomNames = names;
        // Show rename section only for room creator
        if (!isDM) {
          creatorPhone = data.creator_phone || '';
          const isCreator = myPhone && creatorPhone && myPhone === creatorPhone;
          if (data.allMembers) {
            const m = data.allMembers.find(m => m.phone === creatorPhone);
            creatorName = m?.name || null;
          }
          document.getElementById('renameSection').style.display = isCreator ? '' : 'none';
        }
        const displayName = isDM
          ? (localStorage.getItem('bf_dm_peer_' + roomId) || data.name || roomId)
          : (names[myUiLang] || names.he || data.name || roomId);
        document.getElementById('roomNameEl').textContent = displayName;
        document.title = baseTitle = 'Babel Fish — ' + displayName;
        if (isDM) {
          codeEl.innerHTML = '<span class="dm-badge">👤 שיחה פרטית</span>';
        } else {
          codeEl.textContent = '📋 ' + roomId;
          document.getElementById('roomSettingsBtn').style.display = '';
        }
        // save to my rooms — preserve existing name if server returned a fallback (roomId)
        try {
          const rooms = JSON.parse(localStorage.getItem('bf_rooms') || '[]');
          const existing = rooms.find(r => r.id === roomId);
          const bestName = (displayName && displayName !== roomId) ? displayName : (existing?.name || displayName);
          const bestNames = (!isDM && names && Object.keys(names).length) ? names : (existing?.names || {});
          const filtered = rooms.filter(r => r.id !== roomId);
          const type = isDM ? 'dm' : 'group';
          filtered.unshift({ id: roomId, name: bestName, names: bestNames, type, ts: Date.now() });
          localStorage.setItem('bf_rooms', JSON.stringify(filtered.slice(0, 10)));
        } catch(e) {}
        if (data.allMembers) {
          data.allMembers.forEach(m => allMembers.set(m.name, { lang: m.lang, emoji: m.emoji || '', phone: m.phone || '', avatar: m.avatar || '', name_translations: m.name_translations || {} }));
          renderMembers();
        }
        if (data.messages && data.messages.length > 0) {
          document.querySelector('.empty')?.remove();
          data.messages.forEach(addMessage);
          scrollBottom();
        }
      } catch(e) { console.error('loadRoom:', e); }
    }

    // ── WebSocket ──────────────────────────────────────────────────────────
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    let ws, wsAlive = true;

    function connectWS() {
      ws = new WebSocket(
        `${wsProto}://${location.host}/ws?role=member&room=${roomId}&name=${encodeURIComponent(myName)}&lang=${myLang}&emoji=${encodeURIComponent(myEmoji)}&phone=${encodeURIComponent(myPhone)}`
      );
      ws.onmessage = e => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'joined') {
          activeMembers.clear();
          (msg.members || []).forEach(m => {
            const info = { lang: m.lang, emoji: m.emoji || '', phone: m.phone || '', avatar: m.avatar || '' };
            activeMembers.set(m.name, info);
            allMembers.set(m.name, info);
          });
          // Send our avatar to the room after joining
          const myAvatar = localStorage.getItem('bf_avatar') || '';
          if (myAvatar && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'set_avatar', avatar: myAvatar }));
            // Update both maps — activeMembers overwrites allMembers in renderMembers
            const myAll    = allMembers.get(myName);
            const myActive = activeMembers.get(myName);
            if (myAll)    myAll.avatar    = myAvatar;
            if (myActive) myActive.avatar = myAvatar;
          }
          renderMembers();
        } else if (msg.type === 'member_joined') {
          const info = { lang: msg.lang, emoji: msg.emoji || '', phone: msg.phone || '', avatar: msg.avatar || '' };
          activeMembers.set(msg.name, info);
          allMembers.set(msg.name, info);
          renderMembers();
        } else if (msg.type === 'member_left') {
          activeMembers.delete(msg.name);
          renderMembers();
        } else if (msg.type === 'room_renamed') {
          currentRoomNames = msg.names;
          const dn = msg.names[myUiLang] || msg.names.he || msg.names.ar || msg.names.en;
          if (dn) { document.getElementById('roomNameEl').textContent = dn; document.title = 'Babel Fish — ' + dn; }
        } else if (msg.type === 'member_avatar') {
          const existing = allMembers.get(msg.name) || activeMembers.get(msg.name);
          if (existing) {
            existing.avatar = msg.avatar || '';
            allMembers.set(msg.name, existing);
            const active = activeMembers.get(msg.name);
            if (active) { active.avatar = msg.avatar || ''; activeMembers.set(msg.name, active); }
            renderMembers();
          }
        } else if (msg.type === 'reaction_update') {
          renderReactions(msg.msg_id, msg.reactions);
        } else if (msg.type === 'message_deleted') {
          document.getElementById('msg-' + msg.msg_id)?.closest('.bubble')?.remove();
        } else if (msg.type === 'message_edited') {
          applyMessageEdit(msg);
        } else if (msg.type === 'member_renamed') {
          // Someone else in this room changed their display name — update the
          // member list and any already-rendered message bubbles live.
          const info = activeMembers.get(msg.old_name) || allMembers.get(msg.old_name);
          if (info) {
            activeMembers.delete(msg.old_name); allMembers.delete(msg.old_name);
            activeMembers.set(msg.new_name, info); allMembers.set(msg.new_name, info);
            renderMembers();
          }
          document.querySelectorAll('.bubble-sender').forEach(el => {
            if (el.textContent.trim() === msg.old_name) {
              const textNode = [...el.childNodes].find(n => n.nodeType === 3);
              if (textNode) textNode.textContent = msg.new_name;
            }
          });
        } else if (msg.type === 'room_message') {
          document.querySelector('.empty')?.remove();
          const msgEl = document.getElementById('messages');
          const atBottom = msgEl.scrollHeight - msgEl.scrollTop - msgEl.clientHeight < 60;
          addMessage(msg);
          if (atBottom) {
            scrollBottom();
          } else if (msg.sender_name !== myName) {
            unreadCount++;
            document.title = `(${unreadCount}) ${baseTitle}`;
            if (unreadCount === 1) {
              const lastBubble = msgEl.lastElementChild;
              if (lastBubble) lastBubble.dataset.firstUnread = '1';
            }
            showUnreadBadge();
          }
          if (msg.sender_name !== myName) {
            playTardisSound();
            if (ttsOn && !msg.image_url) {
              const text = msg.translations?.[myLang] || msg.original_text;
              speak(text, myLang);
            }
          }
        }
      };
      ws.onerror = () => console.warn('WS error');
      ws.onclose = () => {
        if (wsAlive) setTimeout(() => { connectWS(); loadRoom(); }, 2000);
      };
    }
    connectWS();

    // ── Unread badge ───────────────────────────────────────────────────────
    let unreadCount = 0;
    let baseTitle = document.title;
    const unreadBadge = document.getElementById('unreadBadge');
    const UNREAD_LABELS = {
      he: n => `↓ ${n} הודעות חדשות`,
      ar: n => `↓ ${n} رسائل جديدة`,
      en: n => `↓ ${n} new messages`,
    };
    function getUnreadLabel(n) { return (UNREAD_LABELS[myUiLang] || UNREAD_LABELS.he)(n); }

    function showUnreadBadge() {
      unreadBadge.textContent = getUnreadLabel(unreadCount);
      unreadBadge.style.display = '';
    }

    // Hides the badge/counter only — does NOT move the scroll position.
    // Used passively while the user scrolls, so it must never fight their gesture.
    function clearUnreadState() {
      unreadBadge.style.display = 'none';
      document.querySelector('[data-first-unread="1"]')
        && delete document.querySelector('[data-first-unread="1"]').dataset.firstUnread;
      unreadCount = 0;
      document.title = baseTitle;
    }

    // Full dismiss: jump to bottom AND clear the badge — only for explicit
    // user action (tapping the badge), never from a passive scroll listener.
    function dismissUnread() {
      scrollBottom();
      clearUnreadState();
    }

    // Hide badge when user manually scrolls to bottom — must not call
    // scrollBottom() here, or a slow drag away from the last message gets
    // snapped back on every scroll event (only a fast flick could escape it).
    document.getElementById('messages').addEventListener('scroll', () => {
      const el = document.getElementById('messages');
      if (el.scrollHeight - el.scrollTop - el.clientHeight < 60) clearUnreadState();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && unreadCount > 0) {
        // Insert separator before first unread message
        const firstUnread = document.querySelector('[data-first-unread="1"]');
        if (firstUnread) {
          delete firstUnread.dataset.firstUnread;
          const sep = document.createElement('div');
          sep.className = 'unread-sep';
          sep.textContent = getUnreadLabel(unreadCount);
          firstUnread.before(sep);
          setTimeout(() => sep.remove(), 5000);
        }
        showUnreadBadge();
      }
    });

    // ── Add message bubble ─────────────────────────────────────────────────
    function addMessage(msg) {
      if (msg.id && displayedIds.has(String(msg.id))) return;
      if (msg.id) displayedIds.add(String(msg.id));
      const isMine = msg.sender_name === myName;
      // Own messages: always show as written — no translation for sender
      const hasTrans = !isMine && !!msg.translations?.[myLang];
      const needsTrans = !isMine && !hasTrans && msg.sender_lang && msg.sender_lang !== myLang;
      const translated = isMine ? (msg.original_text || '') : (msg.translations?.[myLang] || msg.original_text || '');
      const original  = msg.original_text || '';
      const showOrig  = !isMine && translated !== original && original;
      if (msg.created_at && (!latestMsgTs || msg.created_at > latestMsgTs)) latestMsgTs = msg.created_at;
      const time = msg.created_at
        ? new Date(msg.created_at).toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' })
        : '';
      const editedTag = msg.edited ? ` · ${ui.editedTag || 'נערך'}` : '';
      const senderEmoji = msg.sender_emoji || '';
      const senderAvatar = allMembers.get(msg.sender_name)?.avatar || activeMembers.get(msg.sender_name)?.avatar || '';
      const senderAvatarHtml = msg.sender_name === 'Worf'
        ? `<img src="/worf.png" style="width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="Worf">`
        : senderAvatar
          ? `<img src="${senderAvatar}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="${esc(msg.sender_name)}">`
          : (senderEmoji ? `<span class="avatar">${senderEmoji}</span>` : '');
      const div = document.createElement('div');
      div.className = 'bubble ' + (isMine ? 'mine' : 'other');

      // Image message — render a tappable image, no text/TTS controls
      if (msg.image_url) {
        div.innerHTML =
          (!isMine
            ? `<div class="bubble-sender">${senderAvatarHtml}${esc(msg.sender_name)}</div>`
            : '') +
          `<div class="bubble-inner bubble-image-wrap" ${msg.id ? `id="msg-${msg.id}"` : ''}>
            <img class="bubble-image" src="${esc(msg.image_url)}" alt="📷"
              onclick="window.open('${esc(msg.image_url)}','_blank')"
              onerror="this.alt='🖼️ (תמונה לא זמינה)';this.style.display='none';this.nextSibling?.remove();this.parentNode.insertAdjacentText('afterbegin','🖼️');"
              loading="lazy">
          </div>` +
          `<div class="bubble-footer">
            <div class="bubble-time">${time}</div>
            <div style="display:flex;gap:.4rem;align-items:center;">
              ${msg.id ? `<button class="icon-btn" onclick="togglePicker('${msg.id}')" title="הגב">😊</button>` : ''}
            </div>
          </div>`;
      } else {
        div.innerHTML =
          (!isMine
            ? `<div class="bubble-sender">${senderAvatarHtml}${esc(msg.sender_name)}</div>`
            : '') +
          `<div class="bubble-inner" ${msg.id ? `id="msg-${msg.id}"` : ''}>
            ${msg.reply_to ? `<div class="reply-quote" onclick="document.getElementById('msg-${msg.reply_to.id}')?.scrollIntoView({behavior:'smooth',block:'center'})"><strong>${esc(msg.reply_to.sender_name)}</strong> ${esc((msg.reply_to.text||'').slice(0,80))}${(msg.reply_to.text||'').length>80?'…':''}</div>` : ''}
            <div class="bubble-main-row">
              <div class="bubble-text">${linkify(esc(translated))}</div>
              <button class="speak-main-btn" data-text="${encodeURIComponent(translated)}" data-lang="${myLang}" onclick="speakBtn(this)" title="השמע">🔊</button>
            </div>
            ${showOrig ? `<div class="bubble-original">${linkify(esc(original))}</div>` : ''}
          </div>` +
          `<div class="bubble-footer">
            <div class="bubble-time" data-edited="${msg.edited ? '1' : '0'}">${time}${editedTag}</div>
            <div style="display:flex;gap:.4rem;align-items:center;">
              ${showOrig ? `<button class="icon-btn" onclick="toggleOrig(this)" title="הצג מקור">🌐</button>` : ''}
              ${msg.id ? `<button class="icon-btn reply-btn" data-mid="${msg.id}" data-sender="${encodeURIComponent(msg.sender_name)}" data-text="${encodeURIComponent(translated)}" title="השב">↩️</button>` : ''}
              ${msg.id ? `<button class="icon-btn" onclick="togglePicker('${msg.id}')" title="הגב">😊</button>` : ''}
            </div>
          </div>`;
      }

      // Reactions + picker
      if (msg.id) {
        const reactionsEl = document.createElement('div');
        reactionsEl.className = 'reactions';
        div.appendChild(reactionsEl);

        const pickerEl = document.createElement('div');
        pickerEl.className = 'emoji-picker';
        REACTION_EMOJIS.forEach(em => {
          const btn = document.createElement('button');
          btn.className = 'emoji-pick-btn';
          btn.textContent = em;
          btn.addEventListener('click', e => { e.stopPropagation(); sendReaction(msg.id, em); });
          pickerEl.appendChild(btn);
        });
        div.appendChild(pickerEl);

        msgElements.set(String(msg.id), { reactionsEl, pickerEl });
        if (msg.reactions && Object.keys(msg.reactions).length) renderReactions(msg.id, msg.reactions);
      }

      document.getElementById('messages-inner').appendChild(div);

      // If this message has no translation in our language, fetch one in the background and save it
      if (needsTrans && msg.id) fetchMissingTranslation(msg, div);
    }

    // Fetch translation for a message that arrived without our language, then persist to DB
    async function fetchMissingTranslation(msg, div) {
      try {
        const r = await fetch(`/api/translate?text=${encodeURIComponent(msg.original_text)}&from=${encodeURIComponent(msg.sender_lang)}&to=${encodeURIComponent(myLang)}&room=${encodeURIComponent(roomId)}`);
        const data = await r.json();
        const t = data.text?.trim();
        if (!t || t === msg.original_text) return; // no real translation
        // Update DOM
        const inner = div.querySelector(`#msg-${msg.id}`);
        if (inner) {
          const textEl = inner.querySelector('.bubble-text');
          if (textEl) textEl.innerHTML = linkify(esc(t));
          const speakBtn = inner.querySelector('.speak-main-btn');
          if (speakBtn) { speakBtn.dataset.text = encodeURIComponent(t); }
        }
        // Persist to DB so next user doesn't need to fetch it
        fetch(`/api/rooms/${roomId}/messages/${msg.id}/translation`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lang: myLang, text: t })
        }).catch(() => {});
      } catch(e) {}
    }

        `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#7dd3fc;text-decoration:underline;word-break:break-all;">${url}</a>`
      );
    }

    // ── TTS ────────────────────────────────────────────────────────────────
    let _voices = [];
    function loadVoices() { _voices = window.speechSynthesis?.getVoices() || []; }
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }
    function getBestVoice(bcp47) {
      if (!_voices.length) _voices = window.speechSynthesis?.getVoices() || [];
      const lang = bcp47.toLowerCase(), prefix = lang.split('-')[0];
      return _voices.find(v => v.lang.toLowerCase() === lang)
          || _voices.find(v => v.lang.toLowerCase().startsWith(prefix + '-'))
          || _voices.find(v => v.lang.toLowerCase().startsWith(prefix))
          || null;
    }
    function speak(text, lang) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      const bcp47 = LANG_BCP47[lang] || lang;
      utt.lang = bcp47;
      const voice = getBestVoice(bcp47);
      if (voice) utt.voice = voice;
      utt.rate = 1.05;
      window.speechSynthesis.speak(utt);
    }
    function speakBtn(btn) { speak(decodeURIComponent(btn.dataset.text), btn.dataset.lang); }

    // Swap the message bubble into an inline editable textarea.
    function startEditMessage(msgId) {
      const inner = document.getElementById('msg-' + msgId);
      if (!inner) return;
      const textEl = inner.querySelector('.bubble-main-row .bubble-text');
      if (!textEl) return;
      const currentText = textEl.textContent;
      const mainRow = inner.querySelector('.bubble-main-row');
      mainRow.style.display = 'none';
      const wrap = document.createElement('div');
      wrap.className = 'bubble-edit-wrap';
      wrap.innerHTML = `
        <textarea class="bubble-edit-area" rows="2">${esc(currentText)}</textarea>
        <div class="bubble-edit-actions">
          <button class="bubble-edit-cancel">${ui.cancelAction || 'ביטול'}</button>
          <button class="bubble-edit-save">${ui.saveAction || 'שמור'}</button>
        </div>`;
      inner.insertBefore(wrap, mainRow);
      const textarea = wrap.querySelector('textarea');
      textarea.focus();
      textarea.setSelectionRange(textarea.value.length, textarea.value.length);

      function exitEdit() { wrap.remove(); mainRow.style.display = ''; }
      async function saveEdit() {
        const newText = textarea.value.trim();
        if (!newText || newText === currentText) { exitEdit(); return; }
        const saveBtn = wrap.querySelector('.bubble-edit-save');
        saveBtn.disabled = true;
        try {
          await fetch(`/api/rooms/${roomId}/messages/${msgId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: myName, text: newText })
          });
          // The message_edited WS broadcast (which we also receive) will
          // update the bubble's actual content; just close the edit UI here.
          exitEdit();
        } catch(e) { console.error('edit message:', e); saveBtn.disabled = false; }
      }
      wrap.querySelector('.bubble-edit-cancel').addEventListener('click', exitEdit);
      wrap.querySelector('.bubble-edit-save').addEventListener('click', saveEdit);
      textarea.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
        if (e.key === 'Escape') exitEdit();
      });
    }

    // Applied when a 'message_edited' WS event arrives — updates the bubble
    // in place (translation + original text) without moving its position.
    function applyMessageEdit(msg) {
      const inner = document.getElementById('msg-' + msg.id);
      if (!inner) return;
      const isMine = msg.sender_name === myName;
      const translated = isMine ? (msg.original_text || '') : (msg.translations?.[myLang] || msg.original_text || '');
      const original = msg.original_text || '';
      const showOrig = !isMine && translated !== original && original;

      const textEl = inner.querySelector('.bubble-main-row .bubble-text');
      if (textEl) textEl.innerHTML = linkify(esc(translated));
      const speakBtn = inner.querySelector('.speak-main-btn');
      if (speakBtn) speakBtn.dataset.text = encodeURIComponent(translated);

      let origEl = inner.querySelector('.bubble-original');
      if (showOrig) {
        if (!origEl) { origEl = document.createElement('div'); origEl.className = 'bubble-original'; inner.appendChild(origEl); }
        origEl.innerHTML = linkify(esc(original));
      } else if (origEl) {
        origEl.remove();
      }

      const timeEl = inner.closest('.bubble')?.querySelector('.bubble-time');
      if (timeEl && timeEl.dataset.edited !== '1') {
        timeEl.dataset.edited = '1';
        timeEl.textContent += ` · ${ui.editedTag || 'נערך'}`;
      }
    }

    // ── Long-press own message → action menu ─────────────────────────────────
    // Cancels itself if the finger moves (a scroll gesture) or lifts before
    // the hold duration, so it never fights normal scrolling.
    (function setupLongPressDelete() {
      const LONG_PRESS_MS = 550;
      const MOVE_CANCEL_PX = 10;
      const messagesEl = document.getElementById('messages');
      let timer = null, startX = 0, startY = 0, targetInner = null;

      function cancel() {
        clearTimeout(timer);
        timer = null;
        targetInner?.classList.remove('long-press-active');
        targetInner = null;
      }

      messagesEl.addEventListener('pointerdown', e => {
        const inner = e.target.closest('.bubble.mine .bubble-inner');
        if (!inner || !inner.id) return;
        targetInner = inner;
        startX = e.clientX; startY = e.clientY;
        inner.classList.add('long-press-active');
        timer = setTimeout(() => {
          const msgId = inner.id.replace('msg-', '');
          cancel();
          showMessageMenu(msgId);
        }, LONG_PRESS_MS);
      });
      messagesEl.addEventListener('pointermove', e => {
        if (!timer) return;
        if (Math.abs(e.clientX - startX) > MOVE_CANCEL_PX || Math.abs(e.clientY - startY) > MOVE_CANCEL_PX) cancel();
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => messagesEl.addEventListener(evt, cancel));
    })();

    textInput.addEventListener('input', () => {
      const hasText = !!textInput.value.trim();
      sendBtn.style.display  = hasText ? 'flex' : 'none';
      recordBtn.style.display = hasText ? 'none' : 'flex';
      textInput.style.height = 'auto';
      textInput.style.height = Math.min(textInput.scrollHeight, 100) + 'px';
    });
    textInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
    });

    async function sendText() {
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = '';
      textInput.style.height = 'auto';
      sendBtn.style.display  = 'none';
      recordBtn.style.display = 'flex';
      const reply_to = replyingTo;
      cancelReply();
      try {
        await fetch('/api/rooms/' + roomId + '/text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender_name: myName, sender_emoji: myEmoji, sender_lang: myLang, text, reply_to })
        });
      } catch(e) { console.error('sendText:', e); }
    }

    // ── Image upload ───────────────────────────────────────────────────────
    const attachBtn  = document.getElementById('attachBtn');
    const imageInput = document.getElementById('imageInput');
    const imgCanvas  = document.getElementById('imgCanvas');

    const IMG_MAX_PX   = 800;   // longest edge after resize
    const IMG_QUALITY  = 0.7;   // JPEG quality
    const IMG_MAX_RAW  = 15;    // MB — reject before compressing

    imageInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';   // reset so same file can be re-picked
      if (!file) return;

      const ALLOWED = ['image/jpeg', 'image/png', 'image/webp'];
      if (!ALLOWED.includes(file.type)) {
        document.getElementById('status').textContent = '⚠ פורמט לא נתמך (JPEG/PNG/WebP בלבד)';
        setTimeout(() => { document.getElementById('status').textContent = ''; }, 3000);
        return;
      }
      if (file.size > IMG_MAX_RAW * 1024 * 1024) {
        document.getElementById('status').textContent = `⚠ תמונה גדולה מדי (מקסימום ${IMG_MAX_RAW} MB)`;
        setTimeout(() => { document.getElementById('status').textContent = ''; }, 3000);
        return;
      }

      attachBtn.classList.add('uploading');
      document.getElementById('status').textContent = 'דוחסת תמונה…';

      try {
        // Load image
        const bitmap = await createImageBitmap(file);
        const ow = bitmap.width, oh = bitmap.height;
        const longer = Math.max(ow, oh);
        const scale  = longer > IMG_MAX_PX ? IMG_MAX_PX / longer : 1;
        const outW = Math.round(ow * scale), outH = Math.round(oh * scale);

        imgCanvas.width  = outW;
        imgCanvas.height = outH;
        const ctx = imgCanvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, outW, outH);
        bitmap.close?.();

        const blob = await new Promise(res => imgCanvas.toBlob(res, 'image/jpeg', IMG_QUALITY));

        document.getElementById('status').textContent = 'מעלה תמונה…';
        const fd = new FormData();
        fd.append('image', blob, 'image.jpg');
        fd.append('sender_name', myName);
        fd.append('sender_emoji', myEmoji || '');

        const r = await fetch(`/api/rooms/${roomId}/image`, { method: 'POST', body: fd });
        if (!r.ok) throw new Error(await r.text());
        document.getElementById('status').textContent = '';
      } catch(err) {
        console.error('sendImage:', err);
        document.getElementById('status').textContent = '⚠ שגיאה בהעלאת תמונה';
        setTimeout(() => { document.getElementById('status').textContent = ''; }, 4000);
      } finally {
        attachBtn.classList.remove('uploading');
      }
    });

    // ── Recording ──────────────────────────────────────────────────────────
    let mediaRecorder, audioChunks = [], stream, recordStart, shouldSend = false;
    let audioCtx, analyser, volumeCheckInterval, maxVolume = 0;
    let waveAnimFrame;

    function startWave() {
      const canvas = document.getElementById('waveCanvas');
      canvas.width  = canvas.offsetWidth  || 300;
      canvas.height = canvas.offsetHeight || 40;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const data = new Uint8Array(analyser.frequencyBinCount);
      function draw() {
        analyser.getByteTimeDomainData(data);
        ctx.clearRect(0, 0, W, H);
        ctx.shadowBlur  = 10;
        ctx.shadowColor = '#8B2FC9';
        ctx.beginPath();
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth   = 2.5;
        ctx.lineJoin    = 'round';
        const AMP  = 4;   // amplify so quiet audio still looks alive
        const step = W / (data.length - 1);
        for (let i = 0; i < data.length; i++) {
          const v = (data[i] - 128) / 128;          // -1 … +1
          const y = Math.max(2, Math.min(H - 2, H / 2 + v * (H / 2) * AMP));
          i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * step, y);
        }
        ctx.stroke();
        waveAnimFrame = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopWave() {
      cancelAnimationFrame(waveAnimFrame);
      const canvas = document.getElementById('waveCanvas');
      canvas.style.display = 'none';
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }
    const recordBtn = document.getElementById('recordBtn');
    const statusEl  = document.getElementById('status');
    const SILENCE_RMS_THRESHOLD = 0.01; // below this the whole recording is considered silent

    function startVolumeMonitor(mediaStream) {
      maxVolume = 0;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(mediaStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        source.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);
        volumeCheckInterval = setInterval(() => {
          analyser.getByteTimeDomainData(data);
          let sumSquares = 0;
          for (let i = 0; i < data.length; i++) {
            const norm = (data[i] - 128) / 128;
            sumSquares += norm * norm;
          }
          const rms = Math.sqrt(sumSquares / data.length);
          if (rms > maxVolume) maxVolume = rms;
        }, 150);
      } catch(e) { console.error('volume monitor:', e); maxVolume = 1; /* fail open — don't block sending */ }
    }

    function stopVolumeMonitor() {
      clearInterval(volumeCheckInterval);
      audioCtx?.close().catch(() => {});
      audioCtx = null; analyser = null;
    }

    async function startRec() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') return;
      document.getElementById('textInput').blur(); // prevent keyboard on mobile
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: {
          echoCancellation: true, noiseSuppression: true, autoGainControl: false
        }});
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        shouldSend = true;
        recordStart = Date.now();
        startVolumeMonitor(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = sendAudio;
        mediaRecorder.start();
        recordBtn.classList.add('recording');
        recordBtn.textContent = '▶';
        statusEl.textContent = 'מקליט... לחץ לשליחה';
        startWave();
      } catch(e) {
        statusEl.textContent = 'אין גישה למיק';
        setTimeout(() => statusEl.textContent = '', 2000);
      }
    }

    function stopRec() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      if (Date.now() - recordStart < 300) shouldSend = false;
      stopVolumeMonitor();
      stopWave();
      if (maxVolume < SILENCE_RMS_THRESHOLD) shouldSend = false; // never heard any real sound — skip Whisper entirely
      mediaRecorder.stop();
      stream?.getTracks().forEach(t => t.stop());
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '🎤';
      statusEl.textContent = shouldSend ? 'שולח...' : '';
    }

    async function sendAudio() {
      if (!shouldSend || audioChunks.length === 0) { statusEl.textContent = ''; return; }
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      if (blob.size < 800) { statusEl.textContent = ''; return; }
      const form = new FormData();
      form.append('audio', blob, 'audio.webm');
      form.append('sender_name', myName);
      form.append('sender_emoji', myEmoji);
      form.append('sender_lang', myLang);
      if (replyingTo) form.append('reply_to', JSON.stringify(replyingTo));
      cancelReply();
      try {
        await fetch('/api/rooms/' + roomId + '/message', { method: 'POST', body: form });
      } catch(e) { console.error('send error:', e); }
      statusEl.textContent = '';
    }

    // Tap to start, tap to stop-and-send (not hold) — single 'click' handles
    // both mouse and touch, avoiding double-fire from separate touch/mouse events.
    recordBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        stopRec();
      } else {
        startRec();
      }
    });

    window.addEventListener('pagehide', () => {
      wsAlive = false; ws?.close();
      if (latestMsgTs) {
        try {
          const rooms = JSON.parse(localStorage.getItem('bf_rooms') || '[]');
          const idx = rooms.findIndex(r => r.id === roomId);
          if (idx >= 0) { rooms[idx].lastSeen = latestMsgTs; localStorage.setItem('bf_rooms', JSON.stringify(rooms)); }
        } catch(e) {}
      }
    });

    loadRoom();

    // ── Web Push ──────────────────────────────────────────────────────────────
    let swReg = null;

    function urlBase64ToUint8Array(b64) {
      const padding = '='.repeat((4 - b64.length % 4) % 4);
      const base64 = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    async function initPushUI() {
      const cb  = document.getElementById('notifCheck');
      const msg = document.getElementById('notifMsg');
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        if (cb) { cb.disabled = true; }
        const lbl = document.getElementById('notifCheckText');
        if (lbl) lbl.textContent = ui.notifUnsupported || 'התראות לא נתמכות בדפדפן זה';
        return;
      }
      try {
        swReg = await navigator.serviceWorker.register('/sw.js');
        const sub = await swReg.pushManager.getSubscription();
        if (cb) cb.checked = !!sub;
        if (Notification.permission === 'denied' && msg) {
          msg.textContent = ui.notifDenied || 'הרשאת התראות חסומה — שנה בהגדרות הדפדפן';
          if (cb) cb.disabled = true;
        }
      } catch(e) { if (cb) cb.disabled = true; }
    }

    function updateNotifBtn(subscribed) {
      const cb = document.getElementById('notifCheck');
      if (cb) cb.checked = subscribed;
    }

    async function togglePushNotifications() {
      const cb  = document.getElementById('notifCheck');
      const msg = document.getElementById('notifMsg');
      if (msg) msg.textContent = '';
      if (!swReg) return;
      const wantSubscribe = cb ? cb.checked : true;
      if (cb) cb.disabled = true;
      try {
        const existing = await swReg.pushManager.getSubscription();
        if (!wantSubscribe && existing) {
          await existing.unsubscribe();
          await fetch('/api/push-subscribe', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room_id: roomId, name: myName })
          });
          if (msg) msg.textContent = ui.notifCancelled;
        } else if (wantSubscribe && !existing) {
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') {
            if (cb) cb.checked = false;
            if (msg) msg.textContent = ui.notifNoPerm;
            return;
          }
          const keyRes = await fetch('/api/vapid-public-key');
          const { key } = await keyRes.json();
          if (!key) {
            if (cb) cb.checked = false;
            if (msg) msg.textContent = ui.notifNoKey;
            return;
          }
          const sub = await swReg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(key)
          });
          await fetch('/api/push-subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room_id: roomId, name: myName, lang: myLang, subscription: sub.toJSON() })
          });
          if (msg) msg.textContent = ui.notifActive;
        }
      } catch(e) {
        if (cb) cb.checked = !wantSubscribe;
        if (msg) msg.textContent = 'שגיאה: ' + e.message;
      } finally {
        if (cb) cb.disabled = false;
      }
    }

    // Also add iOS install banner hint
    if (navigator.standalone === false && /iPhone|iPad/.test(navigator.userAgent)) {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:80px;right:0;left:0;margin:0 1rem;background:#2a1050;border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem;font-size:.82rem;color:var(--muted);text-align:center;z-index:50;';
      banner.innerHTML = ui.iosBanner;
      banner.innerHTML += '<button onclick="this.parentElement.remove()" style="position:absolute;top:.4rem;left:.6rem;background:none;border:none;color:var(--muted);font-size:1rem;cursor:pointer;">✕</button>';
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 12000);
    }

    initPushUI().then(async () => {
      if (!swReg) return;
      // iOS requires standalone (home screen PWA) for push — skip auto-subscribe otherwise
      const isIosNonStandalone = /iPhone|iPad/.test(navigator.userAgent) && navigator.standalone !== true;
      if (isIosNonStandalone) return;
      const sub = await swReg.pushManager.getSubscription();
      if (!sub && Notification.permission === 'default') {
        const cb = document.getElementById('notifCheck');
        if (cb) cb.checked = true; // signal intent to subscribe
        togglePushNotifications();
      }
    });
  </script>
</body>
</html>
