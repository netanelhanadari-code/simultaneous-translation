<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babel Fish</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #12082a; --surface: #1e0f3a; --border: #3d1f6b;
      --accent: #8B2FC9; --accent2: #7928b0; --text: #f0e8ff; --muted: #9b7fc4;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: .7rem 1rem; display: flex; align-items: center; gap: .7rem;
      flex-shrink: 0;
    }
    .back-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 0 .2rem;
    }
    .room-info { flex: 1; min-width: 0; }
    .room-name { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .room-code {
      font-size: .72rem; color: var(--muted); cursor: pointer;
      display: inline-flex; align-items: center; gap: .25rem;
    }
    .lang-badge {
      background: var(--border); border-radius: 6px;
      padding: .2rem .55rem; font-size: .72rem; color: var(--muted); flex-shrink: 0;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: .9rem 1rem;
      display: flex; flex-direction: column; gap: .65rem;
    }
    .empty { text-align: center; color: var(--muted); font-size: .9rem; margin: auto; }
    .bubble { max-width: 82%; display: flex; flex-direction: column; gap: .18rem; }
    .bubble.mine  { align-self: flex-start; }
    .bubble.other { align-self: flex-end; }
    .bubble-inner { padding: .55rem .85rem; border-radius: 12px; line-height: 1.5; }
    .bubble.mine  .bubble-inner { background: var(--accent2); border-radius: 12px 4px 12px 12px; }
    .bubble.other .bubble-inner { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 12px 12px 12px; }
    .bubble-sender { font-size: .7rem; color: var(--muted); padding: 0 .2rem; display: flex; align-items: center; gap: .3rem; }
    .bubble-sender .avatar { font-size: 1rem; }
    .bubble-text { font-size: .95rem; }
    .bubble-original {
      font-size: .75rem; color: var(--muted); margin-top: .3rem;
      padding-top: .3rem; border-top: 1px solid rgba(255,255,255,.08);
      display: none;
    }
    .bubble-original.visible { display: block; }
    .bubble-footer { display: flex; align-items: center; justify-content: space-between; padding: 0 .2rem; gap: .4rem; }
    .bubble-time { font-size: .67rem; color: var(--muted); }
    .icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: .8rem; padding: 0; line-height: 1;
    }
    .icon-btn:active { color: var(--text); }

    /* Members bar */
    #members-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: .35rem 1rem; display: flex; gap: .5rem; flex-wrap: wrap;
      flex-shrink: 0; max-height: 6rem; overflow-y: auto;
    }
    .member-chip {
      background: var(--border); border-radius: 20px;
      padding: .2rem .6rem; font-size: .72rem; color: var(--muted);
      display: flex; align-items: center; gap: .3rem; cursor: default;
      position: relative;
    }
    .member-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; }
    .member-chip.me { background: var(--accent2); border: 1px solid var(--accent); color: var(--text); font-weight: 600; }
    .member-chip .chip-avatar { font-size: 1rem; }
    .member-chip .chip-name {
      position: absolute; bottom: calc(100% + 4px); right: 50%; transform: translateX(50%);
      background: #333; color: #fff; font-size: .7rem; border-radius: 5px;
      padding: .15rem .4rem; white-space: nowrap; display: none; pointer-events: none; z-index: 10;
    }
    .member-chip:hover .chip-name { display: block; }

    /* Footer / input area */
    footer {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: .6rem .8rem; display: flex; align-items: center;
      gap: .6rem; flex-shrink: 0;
    }
    #textInput {
      flex: 1; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 20px;
      padding: .55rem 1rem; font-size: .95rem; outline: none;
      font-family: inherit; resize: none; max-height: 100px;
      direction: auto;
    }
    #textInput:focus { border-color: var(--accent); }
    #textInput::placeholder { color: var(--muted); }
    #sendBtn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity .15s;
    }
    #sendBtn:disabled { opacity: .4; cursor: default; }
    #recordBtn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--border); border: 2px solid rgba(255,255,255,.1);
      cursor: pointer; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .15s;
      -webkit-user-select: none; user-select: none; touch-action: none; flex-shrink: 0;
    }
    #recordBtn.recording {
      background: #c0392b; transform: scale(1.1);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 4px rgba(192,57,43,.3); }
      50%      { box-shadow: 0 0 0 9px rgba(192,57,43,.1); }
    }
    #status { color: var(--muted); font-size: .75rem; min-width: 50px; text-align: center; flex-shrink: 0; }
    .tts-toggle {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); border-radius: 20px; padding: .35rem .6rem;
      font-size: .8rem; cursor: pointer; flex-shrink: 0;
    }
    .tts-toggle.on { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" onclick="location.href='/home.html'">‹</button>
    <div class="room-info">
      <div class="room-name" id="roomNameEl">טוען...</div>
      <span class="room-code" id="codeEl" title="לחץ להעתיק">📋 ...</span>
    </div>
    <button class="back-btn" onclick="loadRoom()" title="רענן" style="font-size:1.1rem;">↻</button>
    <div class="lang-badge" id="langBadge" style="cursor:pointer;" onclick="location.href='/settings.html?from='+encodeURIComponent(location.href)" title="הגדרות"></div>
  </header>

  <div id="members-bar"></div>
  <div id="messages"><div class="empty">📭 אין הודעות עדיין<br><small>הקלד או לחץ והחזק את הכפתור לשליחה קולית</small></div></div>

  <footer>
    <button class="tts-toggle" id="ttsBtn" onclick="toggleTTS()">🔊 קול</button>
    <textarea id="textInput" rows="1" placeholder="הקלד הודעה..."></textarea>
    <button id="sendBtn" onclick="sendText()" disabled>➤</button>
    <button id="recordBtn">🎤</button>
    <div id="status"></div>
  </footer>

  <script>
    const params  = new URLSearchParams(location.search);
    const roomId  = params.get('room');
    const myName  = localStorage.getItem('bf_name')  || 'אנונימי';
    const myLang  = localStorage.getItem('bf_lang')  || 'he';
    const myEmoji = localStorage.getItem('bf_emoji') || '';

    if (!roomId) { location.href = '/home.html'; }

    const LANG_NAMES = { he:'עברית', ar:'ערבית', en:'English', ru:'Русский', am:'አማርኛ' };
    const LANG_BCP47 = { he:'he-IL', ar:'ar-SA', en:'en-US', ru:'ru-RU', am:'am-ET' };

    let ttsOn = true;
    const displayedIds = new Set();
    const activeMembers = new Map(); // name → {lang, emoji}

    // ── Member chip ────────────────────────────────────────────────────────
    function renderMembers() {
      const bar = document.getElementById('members-bar');
      bar.innerHTML = '';
      activeMembers.forEach(({ lang, emoji }, name) => {
        const chip = document.createElement('div');
        chip.className = 'member-chip' + (name === myName ? ' me' : '');
        const display = emoji || name.charAt(0);
        chip.innerHTML = `<span class="dot"></span><span class="chip-avatar">${emoji ? emoji : esc(display)}</span><span class="chip-name">${esc(name)} · ${LANG_NAMES[lang]||lang}</span>`;
        bar.appendChild(chip);
      });
    }

    document.getElementById('langBadge').textContent = (myEmoji || '') + ' ' + (LANG_NAMES[myLang] || myLang);
    document.getElementById('ttsBtn').classList.toggle('on', ttsOn);

    // ── Room code copy ─────────────────────────────────────────────────────
    const codeEl = document.getElementById('codeEl');
    codeEl.onclick = () => {
      navigator.clipboard.writeText(roomId).catch(() => {});
      codeEl.textContent = '✓ הועתק';
      setTimeout(() => codeEl.textContent = '📋 ' + roomId, 1800);
    };

    // ── Load history ───────────────────────────────────────────────────────
    async function loadRoom() {
      try {
        const r = await fetch('/api/rooms/' + roomId);
        if (!r.ok) { location.href = '/home.html'; return; }
        const data = await r.json();
        document.getElementById('roomNameEl').textContent = data.name;
        document.title = 'Babel Fish — ' + data.name;
        codeEl.textContent = '📋 ' + roomId;
        // save to my rooms
        try {
          const rooms = JSON.parse(localStorage.getItem('bf_rooms') || '[]').filter(r => r.id !== roomId);
          rooms.unshift({ id: roomId, name: data.name, ts: Date.now() });
          localStorage.setItem('bf_rooms', JSON.stringify(rooms.slice(0, 10)));
        } catch(e) {}
        if (data.messages && data.messages.length > 0) {
          document.querySelector('.empty')?.remove();
          data.messages.forEach(addMessage);
          scrollBottom();
        }
      } catch(e) { console.error('loadRoom:', e); }
    }

    // ── WebSocket ──────────────────────────────────────────────────────────
    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    let ws, wsAlive = true;

    function connectWS() {
      ws = new WebSocket(
        `${wsProto}://${location.host}/ws?role=member&room=${roomId}&name=${encodeURIComponent(myName)}&lang=${myLang}&emoji=${encodeURIComponent(myEmoji)}`
      );
      ws.onmessage = e => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'joined') {
          activeMembers.clear();
          (msg.members || []).forEach(m => activeMembers.set(m.name, { lang: m.lang, emoji: m.emoji || '' }));
          renderMembers();
        } else if (msg.type === 'member_joined') {
          activeMembers.set(msg.name, { lang: msg.lang, emoji: msg.emoji || '' });
          renderMembers();
        } else if (msg.type === 'member_left') {
          activeMembers.delete(msg.name);
          renderMembers();
        } else if (msg.type === 'room_message') {
          document.querySelector('.empty')?.remove();
          addMessage(msg);
          scrollBottom();
          if (ttsOn && msg.sender_name !== myName) {
            const text = msg.translations?.[myLang] || msg.original_text;
            speak(text, myLang);
          }
        }
      };
      ws.onerror = () => console.warn('WS error');
      ws.onclose = () => {
        if (wsAlive) setTimeout(() => { connectWS(); loadRoom(); }, 2000);
      };
    }
    connectWS();

    // ── Add message bubble ─────────────────────────────────────────────────
    function addMessage(msg) {
      if (msg.id && displayedIds.has(String(msg.id))) return;
      if (msg.id) displayedIds.add(String(msg.id));
      const isMine = msg.sender_name === myName;
      const translated = msg.translations?.[myLang] || msg.original_text || '';
      const original  = msg.original_text || '';
      const showOrig  = translated !== original && original;
      const time = msg.created_at
        ? new Date(msg.created_at).toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' })
        : '';
      const senderEmoji = msg.sender_emoji || '';
      const div = document.createElement('div');
      div.className = 'bubble ' + (isMine ? 'mine' : 'other');
      div.innerHTML =
        (!isMine
          ? `<div class="bubble-sender">${senderEmoji ? `<span class="avatar">${senderEmoji}</span>` : ''}${esc(msg.sender_name)}</div>`
          : '') +
        `<div class="bubble-inner">
          <div class="bubble-text">${esc(translated)}</div>
          ${showOrig ? `<div class="bubble-original">${esc(original)}</div>` : ''}
        </div>` +
        `<div class="bubble-footer">
          <div style="display:flex;gap:.4rem;align-items:center;">
            <button class="icon-btn" data-text="${encodeURIComponent(translated)}" data-lang="${myLang}" onclick="speakBtn(this)" title="השמע">🔊</button>
            ${showOrig ? `<button class="icon-btn" onclick="toggleOrig(this)" title="הצג מקור">🌐</button>` : ''}
          </div>
          <div class="bubble-time">${time}</div>
        </div>`;
      document.getElementById('messages').appendChild(div);
    }

    function toggleOrig(btn) {
      const orig = btn.closest('.bubble-inner')?.querySelector('.bubble-original');
      if (orig) orig.classList.toggle('visible');
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function scrollBottom() { const el = document.getElementById('messages'); el.scrollTop = el.scrollHeight; }

    // ── TTS ────────────────────────────────────────────────────────────────
    let _voices = [];
    function loadVoices() { _voices = window.speechSynthesis?.getVoices() || []; }
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }
    function getBestVoice(bcp47) {
      if (!_voices.length) _voices = window.speechSynthesis?.getVoices() || [];
      const lang = bcp47.toLowerCase(), prefix = lang.split('-')[0];
      return _voices.find(v => v.lang.toLowerCase() === lang)
          || _voices.find(v => v.lang.toLowerCase().startsWith(prefix + '-'))
          || _voices.find(v => v.lang.toLowerCase().startsWith(prefix))
          || null;
    }
    function speak(text, lang) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      const bcp47 = LANG_BCP47[lang] || lang;
      utt.lang = bcp47;
      const voice = getBestVoice(bcp47);
      if (voice) utt.voice = voice;
      utt.rate = 1.05;
      window.speechSynthesis.speak(utt);
    }
    function speakBtn(btn) { speak(decodeURIComponent(btn.dataset.text), btn.dataset.lang); }
    function toggleTTS() {
      ttsOn = !ttsOn;
      document.getElementById('ttsBtn').classList.toggle('on', ttsOn);
      if (!ttsOn) window.speechSynthesis?.cancel();
    }

    // ── Text input ─────────────────────────────────────────────────────────
    const textInput = document.getElementById('textInput');
    const sendBtn   = document.getElementById('sendBtn');

    textInput.addEventListener('input', () => {
      sendBtn.disabled = !textInput.value.trim();
      textInput.style.height = 'auto';
      textInput.style.height = Math.min(textInput.scrollHeight, 100) + 'px';
    });
    textInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
    });

    async function sendText() {
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = '';
      textInput.style.height = 'auto';
      sendBtn.disabled = true;
      try {
        await fetch('/api/rooms/' + roomId + '/text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender_name: myName, sender_emoji: myEmoji, sender_lang: myLang, text })
        });
      } catch(e) { console.error('sendText:', e); }
    }

    // ── Recording ──────────────────────────────────────────────────────────
    let mediaRecorder, audioChunks = [], stream, recordStart, shouldSend = false;
    const recordBtn = document.getElementById('recordBtn');
    const statusEl  = document.getElementById('status');

    async function startRec() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: {
          echoCancellation: true, noiseSuppression: true, autoGainControl: false
        }});
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        shouldSend = true;
        recordStart = Date.now();
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = sendAudio;
        mediaRecorder.start();
        recordBtn.classList.add('recording');
        recordBtn.textContent = '⏹';
        statusEl.textContent = 'מקליט...';
      } catch(e) {
        statusEl.textContent = 'אין גישה למיק';
        setTimeout(() => statusEl.textContent = '', 2000);
      }
    }

    function stopRec() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
      if (Date.now() - recordStart < 600) shouldSend = false;
      mediaRecorder.stop();
      stream?.getTracks().forEach(t => t.stop());
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '🎤';
      statusEl.textContent = shouldSend ? 'שולח...' : '';
    }

    async function sendAudio() {
      if (!shouldSend || audioChunks.length === 0) { statusEl.textContent = ''; return; }
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      if (blob.size < 800) { statusEl.textContent = ''; return; }
      const form = new FormData();
      form.append('audio', blob, 'audio.webm');
      form.append('sender_name', myName);
      form.append('sender_emoji', myEmoji);
      form.append('sender_lang', myLang);
      try {
        await fetch('/api/rooms/' + roomId + '/message', { method: 'POST', body: form });
      } catch(e) { console.error('send error:', e); }
      statusEl.textContent = '';
    }

    recordBtn.addEventListener('mousedown',  () => startRec());
    recordBtn.addEventListener('mouseup',    () => stopRec());
    recordBtn.addEventListener('mouseleave', () => stopRec());
    recordBtn.addEventListener('touchstart', e => { e.preventDefault(); startRec(); }, { passive: false });
    recordBtn.addEventListener('touchend',   e => { e.preventDefault(); stopRec(); },  { passive: false });

    window.addEventListener('pagehide', () => { wsAlive = false; ws?.close(); });

    loadRoom();
  </script>
</body>
</html>
