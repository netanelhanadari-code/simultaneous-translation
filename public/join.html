<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קבוצה — Babel Fish</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #12082a; --surface: #1e0f3a; --border: #3d1f6b;
      --accent: #8B2FC9; --text: #f0e8ff; --muted: #9b7fc4;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; padding: 0 1.25rem 2rem; gap: 1rem;
    }
    header {
      width: 100%; max-width: 360px;
      display: flex; align-items: center; gap: .75rem;
      padding: 1rem 0 .5rem;
    }
    .back-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.6rem; cursor: pointer; line-height: 1; padding: 0 .2rem;
    }
    h1 { font-size: 1.05rem; }
    .tabs {
      display: flex; width: 100%; max-width: 360px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: .3rem; gap: .3rem;
    }
    .tab {
      flex: 1; background: none; border: none; color: var(--muted);
      border-radius: 9px; padding: .55rem; font-size: .88rem;
      cursor: pointer; font-weight: 600; transition: background .15s, color .15s;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.3rem; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: .8rem;
    }
    input {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: .65rem .9rem; font-size: .95rem; outline: none;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }
    .code-input { text-transform: uppercase; letter-spacing: 3px; text-align: center; font-size: 1.1rem; }
    .primary-btn {
      width: 100%; background: var(--accent); color: white;
      border: none; border-radius: 10px; padding: .75rem;
      font-size: 1rem; cursor: pointer; font-weight: 600;
    }
    .primary-btn:active { opacity: .85; }
    .scan-btn {
      width: 100%; background: none; color: var(--muted);
      border: 1px solid var(--border); border-radius: 10px; padding: .65rem;
      font-size: .95rem; cursor: pointer; font-weight: 600;
      transition: border-color .15s, color .15s;
    }
    .scan-btn:hover { border-color: var(--accent); color: var(--text); }
    #err { color: #e07070; font-size: .85rem; min-height: 1.1em; text-align: center; }

    /* QR Scanner overlay */
    .qr-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.92); z-index: 100;
      flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem;
    }
    .qr-overlay.open { display: flex; }
    .qr-viewport {
      position: relative; width: min(320px, 90vw); height: min(320px, 90vw);
      border-radius: 16px; overflow: hidden; border: 2px solid var(--accent);
    }
    #qrVideo {
      width: 100%; height: 100%; object-fit: cover;
    }
    .qr-corner {
      position: absolute; inset: 0; pointer-events: none;
    }
    .qr-corner::before, .qr-corner::after {
      content: ''; position: absolute;
      width: 28px; height: 28px; border-color: var(--accent); border-style: solid;
    }
    .qr-corner::before { top: 10px; right: 10px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .qr-corner::after  { bottom: 10px; left: 10px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .qr-scan-line {
      position: absolute; right: 0; left: 0; height: 2px;
      background: var(--accent); opacity: .8;
      animation: scanline 2s linear infinite;
    }
    @keyframes scanline {
      0%   { top: 10%; }
      100% { top: 90%; }
    }
    .qr-status { color: var(--muted); font-size: .9rem; }
    .qr-close {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: .6rem 2rem;
      font-size: .95rem; cursor: pointer;
    }
    #qrCanvas { display: none; }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" onclick="history.back()">‹</button>
    <h1 id="pageTitle">קבוצה</h1>
  </header>

  <div class="tabs">
    <button class="tab" id="tabCreate" onclick="setMode('create')">➕ קבוצה חדשה</button>
    <button class="tab" id="tabJoin"   onclick="setMode('join')">🔗 הצטרף</button>
  </div>

  <div class="card" id="cardCreate">
    <input id="roomName" type="text" placeholder="שם הקבוצה" maxlength="40">
    <button class="primary-btn" onclick="createRoom()">צור קבוצה</button>
  </div>

  <div class="card" id="cardJoin" style="display:none;">
    <input id="roomCode" class="code-input" type="text" placeholder="ABCDE" maxlength="6">
    <button class="primary-btn" onclick="joinRoom()">הצטרף</button>
    <button class="scan-btn" onclick="openScanner()">📷 סרוק QR</button>
  </div>

  <p id="err"></p>

  <!-- QR Scanner overlay -->
  <div class="qr-overlay" id="qrOverlay">
    <div class="qr-viewport">
      <video id="qrVideo" autoplay playsinline muted></video>
      <div class="qr-corner"></div>
      <div class="qr-scan-line"></div>
    </div>
    <p class="qr-status" id="qrStatus">מכוון את הקוד למסגרת</p>
    <button class="qr-close" onclick="closeScanner()">סגור</button>
    <canvas id="qrCanvas"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
  <script>
    const myName = localStorage.getItem('bf_name') || '';
    if (!myName) { location.href = '/settings.html?from=' + encodeURIComponent(location.href); }

    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    if (code) {
      document.getElementById('roomCode').value = code.toUpperCase();
      setMode('join');
      joinRoom();
    } else {
      setMode(params.get('mode') || 'create');
    }

    function setMode(m) {
      const isCreate = m === 'create';
      document.getElementById('tabCreate').classList.toggle('active', isCreate);
      document.getElementById('tabJoin').classList.toggle('active', !isCreate);
      document.getElementById('cardCreate').style.display = isCreate ? '' : 'none';
      document.getElementById('cardJoin').style.display  = isCreate ? 'none' : '';
      document.getElementById('pageTitle').textContent   = isCreate ? 'קבוצה חדשה' : 'הצטרף לקבוצה';
      document.getElementById('err').textContent = '';
    }

    function addMyRoom(id, name, names) {
      const rooms = JSON.parse(localStorage.getItem('bf_rooms') || '[]').filter(r => r.id !== id);
      rooms.unshift({ id, name, names: names || {}, type: 'group', ts: Date.now() });
      localStorage.setItem('bf_rooms', JSON.stringify(rooms.slice(0, 10)));
    }

    async function createRoom() {
      const name = document.getElementById('roomName').value.trim();
      if (!name) { document.getElementById('err').textContent = 'הכנס שם קבוצה'; return; }
      document.getElementById('err').textContent = '';
      try {
        const r = await fetch('/api/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, lang: localStorage.getItem('bf_lang') || 'he' })
        });
        const data = await r.json();
        const { id, names } = data;
        addMyRoom(id, name, names);
        location.href = `/room.html?room=${id}`;
      } catch(e) { document.getElementById('err').textContent = 'שגיאה ביצירת הקבוצה'; }
    }

    function joinRoom() {
      const code = document.getElementById('roomCode').value.trim().toUpperCase();
      if (!code) { document.getElementById('err').textContent = 'הכנס קוד קבוצה'; return; }
      location.href = `/room.html?room=${code}`;
    }

    // ── QR Scanner ────────────────────────────────────────────────────────
    let scanStream = null, scanRaf = null;

    async function openScanner() {
      const overlay = document.getElementById('qrOverlay');
      const video   = document.getElementById('qrVideo');
      const status  = document.getElementById('qrStatus');
      status.textContent = 'פותח מצלמה...';
      overlay.classList.add('open');
      try {
        scanStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = scanStream;
        video.play();
        video.onloadedmetadata = () => {
          status.textContent = 'מכוון את הקוד למסגרת';
          scanFrame();
        };
      } catch(e) {
        status.textContent = 'אין גישה למצלמה';
      }
    }

    function scanFrame() {
      const video  = document.getElementById('qrVideo');
      const canvas = document.getElementById('qrCanvas');
      const ctx    = canvas.getContext('2d');
      if (video.readyState !== video.HAVE_ENOUGH_DATA) {
        scanRaf = requestAnimationFrame(scanFrame);
        return;
      }
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const qr = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'dontInvert'
      });
      if (qr) {
        onQRDetected(qr.data);
        return;
      }
      scanRaf = requestAnimationFrame(scanFrame);
    }

    function onQRDetected(data) {
      closeScanner();
      // Extract room code from URL or use raw value
      let code = data;
      try {
        const url = new URL(data);
        const roomParam = url.searchParams.get('room') || url.searchParams.get('code');
        if (roomParam) code = roomParam;
        else {
          // Try last path segment
          const parts = url.pathname.split('/').filter(Boolean);
          if (parts.length) code = parts[parts.length - 1];
        }
      } catch(e) { /* not a URL, use as-is */ }
      code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code) {
        document.getElementById('roomCode').value = code;
        setMode('join');
        joinRoom();
      }
    }

    function closeScanner() {
      cancelAnimationFrame(scanRaf);
      if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
      document.getElementById('qrOverlay').classList.remove('open');
      document.getElementById('qrVideo').srcObject = null;
    }

    document.getElementById('roomCode').addEventListener('input', e => {
      e.target.value = e.target.value.toUpperCase();
    });
    document.getElementById('roomName').addEventListener('keydown', e => {
      if (e.key === 'Enter') createRoom();
    });
    document.getElementById('roomCode').addEventListener('keydown', e => {
      if (e.key === 'Enter') joinRoom();
    });
  </script>
</body>
</html>
