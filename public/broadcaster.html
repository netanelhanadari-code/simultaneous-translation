<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תרגום סימולטני | עומדים ביחד | نقف معاً</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    #splash { position:fixed;inset:0;z-index:999;background:#12082a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;transition:opacity .5s ease; }
    #splash.hidden { opacity:0;pointer-events:none; }
    #splash img { width:min(220px,62vw);object-fit:contain; }
    #langSwitcher { position:fixed;top:.75rem;left:.75rem;z-index:200; }
    #langSwitcher button { background:rgba(30,15,58,.85);border:1px solid #3d1f6b;color:#9b7fc4;border-radius:8px;padding:.35rem .7rem;font-size:.95rem;cursor:pointer; }
    #langSwitcher button:hover { color:#f0e8ff;border-color:#8B2FC9; }
    #langMenu { display:none;position:absolute;top:110%;left:0;background:#1e0f3a;border:1px solid #3d1f6b;border-radius:10px;overflow:hidden;min-width:110px; }
    #langMenu.open { display:block; }
    #langMenu button { display:block;width:100%;background:none;border:none;color:#f0e8ff;padding:.55rem .9rem;text-align:right;cursor:pointer;font-size:.9rem; }
    #langMenu button:hover { background:#3d1f6b; }

    :root {
      --bg:      #12082a;
      --surface: #1e0f3a;
      --border:  #3d1f6b;
      --accent:  #8B2FC9;
      --accent2: #7928b0;
      --text:    #f0e8ff;
      --muted:   #9b7fc4;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1.25rem 2rem;
      gap: 1.4rem;
    }

    .logo { height: 64px; object-fit: contain; }
    h1 { font-size: 1.1rem; color: var(--muted); margin-top: -.4rem; }

    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }
    .tab {
      border: none; border-radius: 999px;
      padding: .45rem 1.25rem; font-size: .88rem;
      cursor: pointer; background: transparent;
      color: var(--muted); transition: all .2s;
    }
    .tab.active { background: var(--accent); color: #fff; }

    .pill {
      display: flex; align-items: center; gap: .6rem;
      background: var(--surface); border-radius: 999px;
      padding: .5rem 1.2rem; font-size: .85rem; color: var(--muted);
    }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    .dot.live { background:#22c55e; box-shadow:0 0 6px #22c55e; animation:blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    .big-btn {
      width:140px; height:140px; border-radius:50%; border:none; cursor:pointer;
      font-size:2.8rem; background:var(--accent); color:#fff;
      box-shadow:0 4px 24px rgba(37,99,235,.4);
      transition: background .2s, transform .15s;
      display:flex; align-items:center; justify-content:center;
    }
    .big-btn:hover  { transform:scale(1.05); }
    .big-btn:active { transform:scale(.97); }
    .big-btn.on { background:#dc2626; animation:ripple 1.6s ease-out infinite; }
    @keyframes ripple {
      0%   { box-shadow:0 0 0 0   rgba(220,38,38,.5); }
      100% { box-shadow:0 0 0 28px rgba(220,38,38,0); }
    }
    .btn-label { font-size:.88rem; color:var(--muted); margin-top:-.6rem; }

    .ai-section {
      width:100%; max-width:420px;
      display:flex; flex-direction:column; gap:1rem;
    }
    .lang-row { display:flex; align-items:center; gap:.75rem; }
    .lang-row label { font-size:.82rem; color:var(--muted); white-space:nowrap; }
    select {
      flex:1; background:var(--surface); color:#f1f5f9;
      border:1px solid var(--border); border-radius:8px;
      padding:.45rem .75rem; font-size:.88rem; cursor:pointer;
    }

    .ai-start-btn {
      width:100%; padding:.85rem; border:none; border-radius:10px;
      background:var(--accent); color:#fff; font-size:1rem;
      cursor:pointer; transition:background .15s;
    }
    .ai-start-btn:hover { background:var(--accent2); }
    .ai-start-btn.on { background:#dc2626; }

    .transcript-box {
      width:100%; max-width:420px;
      background:var(--surface); border-radius:12px;
      padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.75rem;
    }
    .transcript-label { font-size:.75rem; color:var(--muted); }
    .transcript-text  { font-size:1rem; color:#f1f5f9; min-height:2.5em; line-height:1.5; }

    .counter-wrap { text-align:center; }
    .counter-num  { font-size:2.5rem; font-weight:700; }
    .counter-lbl  { font-size:.8rem; color:var(--muted); }

    .share-box {
      background:var(--surface); border-radius:1rem;
      padding:1.25rem; width:100%; max-width:380px;
      display:flex; flex-direction:column; align-items:center; gap:.9rem;
    }
    .share-title { font-size:.82rem; color:var(--muted); }
    .room-code {
      font-size:1.6rem; font-weight:700; letter-spacing:.15em;
      color: var(--text); font-family: monospace;
    }
    #qrcode { background:#fff; padding:10px; border-radius:8px; }
    .url-row { width:100%; display:flex; gap:.5rem; }
    .url-txt {
      flex:1; background:var(--bg); color:var(--muted);
      border:1px solid var(--border); border-radius:8px;
      padding:.42rem .7rem; font-size:.76rem;
      direction:ltr; text-align:left;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .copy-btn {
      background:var(--accent); color:#fff; border:none;
      border-radius:8px; padding:.42rem .9rem;
      font-size:.8rem; cursor:pointer; white-space:nowrap;
    }

    .gender-toggle { display:flex; gap:.4rem; }
    .gender-btn {
      background:var(--surface); color:var(--muted);
      border:1px solid var(--border); border-radius:8px;
      padding:.4rem .85rem; font-size:.85rem; cursor:pointer;
      transition:all .15s;
    }
    .gender-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .error { color:#f87171; font-size:.83rem; text-align:center; max-width:340px; }
    .hidden { display:none !important; }
    .version { position:fixed; bottom:.6rem; left:.8rem; font-size:.7rem; color:var(--muted); opacity:.5; pointer-events:none; }
  </style>
</head>
<body>

  <div id="langSwitcher">
    <button onclick="document.getElementById('langMenu').classList.toggle('open')">🌐</button>
    <div id="langMenu">
      <button onclick="switchLang('he')">עברית</button>
      <button onclick="switchLang('ar')">العربية</button>
      <button onclick="switchLang('en')">English</button>
    </div>
  </div>

  <div id="splash">
    <img src="logo.png" alt="עומדים ביחד">
    <img src="babel-fish.png" alt="Babel Fish">
  </div>

  <div style="display:flex;align-items:center;gap:1rem;justify-content:center;">
    <img src="logo.png" class="logo" alt="עומדים ביחד">
    <img src="babel-fish.png" style="height:56px;object-fit:contain;" alt="Babel Fish">
  </div>
  <h1 id="pageTitle">🎙️ תרגום סימולטני — משדר</h1>

  <div class="tabs">
    <button class="tab active" id="tabHuman" onclick="setMode('human')">🎙️ מתרגם אנושי</button>
    <button class="tab"        id="tabAI"    onclick="setMode('ai')">🤖 תרגום AI</button>
  </div>
  <a id="toolsLink" href="/recorder.html" style="display:block;background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:.55rem 1.5rem;font-size:.9rem;text-decoration:none;text-align:center;">🔧 כלים</a>

  <div class="pill">
    <div class="dot" id="dot"></div>
    <span id="statusTxt">מחובר לשרת</span>
  </div>

  <div id="humanSection">
    <button class="big-btn" id="micBtn" onclick="toggleHuman()">🎙️</button>
  </div>
  <div class="btn-label" id="btnLabel">לחץ להתחיל שידור</div>

  <div class="ai-section hidden" id="aiSection">
    <div class="lang-row">
      <label id="srcLangLabel">שפת הדובר:</label>
      <select id="srcLang">
        <option value="he-IL|he">עברית</option>
        <option value="ar|ar">العربية</option>
        <option value="en-US|en">English</option>
        <option value="ru-RU|ru">Русский</option>
        <option value="am-ET|am">አማርኛ</option>
        <option value="fr-FR|fr">Français</option>
        <option value="es-ES|es">Español</option>
        <option value="uk-UA|uk">Українська</option>
        <option value="de-DE|de">Deutsch</option>
      </select>
    </div>
    <button class="ai-start-btn" id="aiBtn" onclick="toggleAI()">▶ התחל תרגום AI</button>
  </div>

  <div class="transcript-box hidden" id="transcriptBox">
    <div class="transcript-label" id="transcriptLabel">מזהה דיבור:</div>
    <div class="transcript-text" id="origTxt">—</div>
  </div>

  <div class="counter-wrap">
    <div class="counter-num" id="count">0</div>
    <div class="counter-lbl" id="counterLbl">מאזינים מחוברים</div>
  </div>

  <div class="share-box">
    <div class="share-title" id="shareTitle">שתף עם הקהל:</div>
    <div class="room-code" id="roomCodeDisplay"></div>
    <div id="qrcode"></div>
    <div class="url-row">
      <div class="url-txt" id="urlTxt"></div>
      <button class="copy-btn" id="copyBtn" onclick="copyUrl()">העתק</button>
    </div>
  </div>

  <div class="error hidden" id="errMsg"></div>

  <div id="sessionWarning" class="hidden" style="position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#7c2d12;color:#fff;border-radius:12px;padding:1rem 1.5rem;text-align:center;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:320px;width:90%;">
    <div id="sessionWarnTxt" style="font-size:.95rem;margin-bottom:.75rem;">⏱ השידור פעיל כבר <strong>3 שעות</strong>.<br>להמשיך?</div>
    <div style="display:flex;gap:.75rem;justify-content:center;">
      <button id="continueBtn" onclick="continueSession()" style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:.5rem 1.2rem;font-size:.9rem;cursor:pointer;">המשך</button>
      <button id="stopBtn" onclick="stopAI()" style="background:#374151;color:#fff;border:none;border-radius:8px;padding:.5rem 1.2rem;font-size:.9rem;cursor:pointer;">עצור</button>
    </div>
  </div>

  <div class="version">v0.6</div>

  <script>
    // Splash
    setTimeout(() => { const s=document.getElementById('splash'); s.classList.add('hidden'); setTimeout(()=>s.remove(),500); }, 2200);

    // ── Localization ──────────────────────────────────────────────────────────
    function switchLang(lang) {
      localStorage.setItem('bf_bc_lang', lang);
      document.getElementById('langMenu').classList.remove('open');
      applyLang(lang);
    }
    function applyLang(lang) {
      if (lang === 'ar') { document.documentElement.setAttribute('dir','rtl'); document.documentElement.setAttribute('lang','ar'); }
      else if (lang === 'en') { document.documentElement.setAttribute('dir','ltr'); document.documentElement.setAttribute('lang','en'); }
      else { document.documentElement.setAttribute('dir','rtl'); document.documentElement.setAttribute('lang','he'); }
      const BT = BL[lang] || BL.he;
      document.getElementById('pageTitle').textContent       = BT.title;
      document.getElementById('tabHuman').textContent        = BT.tabHuman;
      document.getElementById('tabAI').textContent           = BT.tabAI;
      document.getElementById('toolsLink').textContent       = BT.tools;
      document.getElementById('statusTxt').textContent       = (window._BT||BL.he).connected;
      document.getElementById('btnLabel').textContent        = (window._BT||BL.he).startBroadcast;
      document.getElementById('srcLangLabel').textContent    = BT.srcLang;
      document.getElementById('aiBtn').textContent           = (window._BT||BL.he).startAI;
      document.getElementById('transcriptLabel').textContent = BT.transcript;
      document.getElementById('counterLbl').textContent      = BT.listeners;
      document.getElementById('shareTitle').textContent      = BT.share;
      document.getElementById('copyBtn').textContent         = (window._BT||BL.he).copy;
      document.getElementById('sessionWarnTxt').innerHTML    = BT.sessionWarn;
      document.getElementById('continueBtn').textContent     = BT.continueBtn;
      document.getElementById('stopBtn').textContent         = BT.stopBtn;
      window._BT = BT; // make available to dynamic JS
    }
    const myUiLang = localStorage.getItem('bf_bc_lang') || localStorage.getItem('bf_ui_lang') || 'he';
    const BL = {
      he: { title:'🎙️ תרגום סימולטני — משדר', tabHuman:'🎙️ מתרגם אנושי', tabAI:'🤖 תרגום AI', tools:'🔧 כלים', connected:'מחובר לשרת', startBroadcast:'לחץ להתחיל שידור', stopBroadcast:'לחץ לעצור שידור', broadcastingNow:'● משדר עכשיו', aiActive:'● תרגום AI פעיל', srcLang:'שפת הדובר:', startAI:'▶ התחל תרגום AI', stopAI:'⏹ עצור תרגום AI', transcript:'מזהה דיבור:', listeners:'מאזינים מחוברים', share:'שתף עם הקהל:', copy:'העתק', copied:'✓ הועתק', sessionWarn:'⏱ השידור פעיל כבר <strong>3 שעות</strong>.<br>להמשיך?', continueBtn:'המשך', stopBtn:'עצור', autoStop:'השידור הופסק אוטומטית אחרי 3 שעות' },
      ar: { title:'🎙️ ترجمة فورية — المذيع', tabHuman:'🎙️ مترجم بشري', tabAI:'🤖 ترجمة AI', tools:'🔧 أدوات', connected:'متصل بالخادم', startBroadcast:'اضغط لبدء البث', stopBroadcast:'اضغط لإيقاف البث', broadcastingNow:'● يبث الآن', aiActive:'● ترجمة AI نشطة', srcLang:'لغة المتحدث:', startAI:'▶ بدء ترجمة AI', stopAI:'⏹ إيقاف ترجمة AI', transcript:'التعرف على الكلام:', listeners:'مستمعون متصلون', share:'شارك مع الجمهور:', copy:'نسخ', copied:'✓ تم النسخ', sessionWarn:'⏱ البث نشط منذ <strong>3 ساعات</strong>.<br>هل تريد المتابعة?', continueBtn:'متابعة', stopBtn:'إيقاف', autoStop:'تم إيقاف البث تلقائياً بعد 3 ساعات' },
      en: { title:'🎙️ Simultaneous Translation — Broadcaster', tabHuman:'🎙️ Human Translator', tabAI:'🤖 AI Translation', tools:'🔧 Tools', connected:'Connected to server', startBroadcast:'Press to start broadcasting', stopBroadcast:'Press to stop broadcasting', broadcastingNow:'● Broadcasting now', aiActive:'● AI translation active', srcLang:'Speaker language:', startAI:'▶ Start AI translation', stopAI:'⏹ Stop AI translation', transcript:'Speech recognition:', listeners:'Connected listeners', share:'Share with audience:', copy:'Copy', copied:'✓ Copied', sessionWarn:'⏱ Broadcast has been active for <strong>3 hours</strong>.<br>Continue?', continueBtn:'Continue', stopBtn:'Stop', autoStop:'Broadcast stopped automatically after 3 hours' },
    };
    applyLang(myUiLang);

    // ── Room ID ───────────────────────────────────────────────────────────────
    function generateRoomId() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let id = '';
      for (let i = 0; i < 6; i++) {
        if (i === 3) id += '-';
        id += chars[Math.floor(Math.random() * chars.length)];
      }
      return id;
    }
    const params = new URLSearchParams(location.search);
    let roomId = params.get('room');
    if (!roomId) {
      roomId = generateRoomId();
      history.replaceState(null, '', '?room=' + roomId);
    }

    // ── QR & URL ──────────────────────────────────────────────────────────────
    const listenerUrl = location.protocol + '//' + location.host + '/listener.html?room=' + roomId;
    document.getElementById('roomCodeDisplay').textContent = roomId;
    document.getElementById('urlTxt').textContent = listenerUrl;
    new QRCode(document.getElementById('qrcode'), {
      text: listenerUrl, width:150, height:150,
      colorDark:'#000', colorLight:'#fff',
      correctLevel: QRCode.CorrectLevel.M
    });
    function copyUrl() {
      navigator.clipboard.writeText(listenerUrl).then(() => {
        const b = document.getElementById('copyBtn');
        b.textContent = '✓ הועתק';
        setTimeout(() => b.textContent = (window._BT||BL.he).copy, 2200);
      });
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(wsProto + '//' + location.host + '/ws?role=broadcaster&room=' + roomId);
    ws.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'ready' || msg.type === 'count')
        document.getElementById('count').textContent = msg.count != null ? msg.count : 0;
    };
    ws.onclose = () => showErr('החיבור לשרת נותק. רענן את הדף.');

    // ── Mode toggle ───────────────────────────────────────────────────────────
    let currentMode = 'human';
    function setMode(m) {
      if (currentMode === 'human' && humanOn) toggleHuman();
      if (currentMode === 'ai'    && aiOn)    toggleAI();
      currentMode = m;
      document.getElementById('tabHuman').classList.toggle('active', m === 'human');
      document.getElementById('tabAI')   .classList.toggle('active', m === 'ai');
      document.getElementById('humanSection') .classList.toggle('hidden', m !== 'human');
      document.getElementById('btnLabel')     .classList.toggle('hidden', m !== 'human');
      document.getElementById('aiSection')    .classList.toggle('hidden', m !== 'ai');
      document.getElementById('transcriptBox').classList.add('hidden');
      renderStatus(false);
    }

    // ── Wake Lock ─────────────────────────────────────────────────────────────
    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch(_) {}
      }
    }
    function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock && document.visibilityState === 'visible') requestWakeLock();
    });

    // ── HUMAN mode ────────────────────────────────────────────────────────────
    let humanOn = false, recorder = null, stream = null;

    async function toggleHuman() { humanOn ? stopHuman() : await startHuman(); }
    async function startHuman() {
      clearErr();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
        });
      } catch(err) {
        return showErr(err.name === 'NotAllowedError'
          ? 'אין גישה למיקרופון — אשר גישה בדפדפן.'
          : 'שגיאת מיקרופון: ' + err.message);
      }
      const types = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
      const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
      if (!mime) return showErr('הדפדפן אינו תומך בהקלטת אודיו. השתמש בכרום.');
      ws.send(JSON.stringify({ type:'meta', mimeType: mime }));
      recorder = new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 64000 });
      recorder.ondataavailable = e => {
        if (e.data.size > 0 && ws.readyState === WebSocket.OPEN) ws.send(e.data);
      };
      recorder.start(400);
      humanOn = true; renderStatus(true); requestWakeLock();
    }
    function stopHuman() {
      recorder && recorder.stop();
      stream && stream.getTracks().forEach(t => t.stop());
      recorder = null; stream = null;
      humanOn = false; renderStatus(false); releaseWakeLock();
    }

    // ── Gender ────────────────────────────────────────────────────────────────
    let speakerGender = 'm';
    function setGender(g) {
      speakerGender = g;
      document.getElementById('genderM').classList.toggle('active', g === 'm');
      document.getElementById('genderF').classList.toggle('active', g === 'f');
      if (aiOn) ws.send(JSON.stringify({ type: 'gender', gender: g }));
    }

    // ── AI mode ───────────────────────────────────────────────────────────────
    let aiOn = false, recognition = null;
    let whisperRecorder = null, whisperStream = null;

    async function toggleAI() { aiOn ? stopAI() : await startAI(); }

    // Auto-restart when language changes mid-broadcast
    document.getElementById('srcLang').addEventListener('change', async () => {
      if (aiOn) { stopAI(); await startAI(); }
    });
    async function startAI() {
      clearErr();
      const [bcp47Init, srcCodeInit] = document.getElementById('srcLang').value.split('|');

      // Arabic → Whisper mode
      ws.send(JSON.stringify({ type: 'gender', gender: speakerGender }));
      if (srcCodeInit === 'ar') return await startWhisper(bcp47Init, srcCodeInit);

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return showErr('זיהוי דיבור לא זמין. פתח את הדף ב-Chrome.');

      let [bcp47, srcCode] = document.getElementById('srcLang').value.split('|');

      recognition = new SR();
      recognition.lang = bcp47;
      recognition.continuous = true;
      recognition.interimResults = true;

      // ── Sending state ────────────────────────────────────────────────────────
      // lastSentPos: how far into the current session's fullText we've already sent
      // cumulativeSent: all text sent across all sessions (for dedup on restart)
      let debounceTimer = null;
      let lastSentPos     = 0;
      let cumulativeSent  = '';
      let pendingText = '';
      let pendingPos  = 0;

      function sendChunk(text) {
        const t = text.trim();
        if (!t || ws.readyState !== WebSocket.OPEN) return;
        cumulativeSent += (cumulativeSent ? ' ' : '') + t;
        ws.send(JSON.stringify({ type: 'original', text: t, sourceLang: srcCode }));
      }

      recognition.onresult = event => {
        // Build full transcript: all finals + current interim
        let allFinals = '', interim = '';
        for (let i = 0; i < event.results.length; i++) {
          if (event.results[i].isFinal) allFinals += event.results[i][0].transcript;
          else interim = event.results[i][0].transcript;
        }
        const fullText = allFinals + interim;
        document.getElementById('origTxt').textContent = fullText || '…';

        // ── Dedup on session restart ─────────────────────────────────────────
        // After onend+restart, Chrome may replay the last phrase.
        // If fullText (trimmed) is already inside cumulativeSent, skip it.
        if (lastSentPos === 0 && cumulativeSent) {
          const ft = fullText.trim();
          if (cumulativeSent.includes(ft)) {
            lastSentPos = fullText.length; // already sent entirely
            return;
          }
          // Partial prefix overlap: find how many chars at start of fullText
          // are already at the end of cumulativeSent
          let overlap = 0;
          for (let len = Math.min(ft.length - 1, 60); len >= 2; len--) {
            if (cumulativeSent.endsWith(ft.slice(0, len))) { overlap = len; break; }
          }
          if (overlap > 0) lastSentPos = overlap;
        }

        // Text we haven't sent yet in this session
        const unsent = fullText.slice(lastSentPos);
        if (!unsent.trim()) return;

        // ── All finals: flush everything remaining ───────────────────────────
        if (!interim) {
          clearTimeout(debounceTimer);
          sendChunk(unsent);
          lastSentPos = fullText.length;
          return;
        }

        // ── Interim: look for punctuation in unsent portion ──────────────────
        const puncIdx = unsent.search(/[.!?,;]/);
        if (puncIdx !== -1) {
          const toSend = unsent.slice(0, puncIdx + 1);
          clearTimeout(debounceTimer);
          sendChunk(toSend);
          lastSentPos += puncIdx + 1;
          return;
        }

        // ── Interim: clause markers — send what came before ─────────────────
        const clauseMatch = unsent.match(/^(.*?\S)\s+(כי|ש־|אבל|אך|ולכן|לכן|כאשר|אם|למרות|בגלל|אולם|but|because|however|when|if|although)\s/i);
        if (clauseMatch) {
          clearTimeout(debounceTimer);
          sendChunk(clauseMatch[1]);
          lastSentPos += clauseMatch[1].length;
          return;
        }

        // ── Interim: emergency fallback only — very long phrase with no pause ─
        const wordCount = unsent.trim().split(/\s+/).length;
        if (wordCount >= 20) {
          clearTimeout(debounceTimer);
          sendChunk(unsent);
          lastSentPos = fullText.length;
          return;
        }

        // Wait for natural pause (isFinal) — 1500ms debounce
        clearTimeout(debounceTimer);
        pendingText = unsent.trim();
        pendingPos  = fullText.length;
        debounceTimer = setTimeout(() => {
          if (pendingText) { sendChunk(pendingText); lastSentPos = pendingPos; pendingText = ''; }
        }, 1500);
      };

      recognition.onerror = ev => {
        if (ev.error !== 'no-speech') showErr('שגיאת זיהוי: ' + ev.error);
      };
      recognition.onend = () => {
        clearTimeout(debounceTimer);
        if (pendingText) { sendChunk(pendingText); pendingText = ''; }
        lastSentPos = 0;
        if (aiOn) {
          // Pick up language change if user switched mid-broadcast
          const [newBcp47, newSrcCode] = document.getElementById('srcLang').value.split('|');
          if (newBcp47 !== bcp47) {
            bcp47 = newBcp47; srcCode = newSrcCode;
            recognition.lang = newBcp47;
            cumulativeSent = ''; // reset dedup for new language
          }
          recognition.start();
        }
      };

      recognition.start();
      aiOn = true;
      document.getElementById('aiBtn').textContent = (window._BT||BL.he).stopAI;
      document.getElementById('aiBtn').classList.add('on');
      document.getElementById('transcriptBox').classList.remove('hidden');
      renderStatus(true); requestWakeLock();
    }

    // ── Whisper mode (Arabic) ─────────────────────────────────────────────────
    async function startWhisper(bcp47, srcCode) {
      console.log('[Whisper] startWhisper called, bcp47:', bcp47);
      try {
        whisperStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        console.log('[Whisper] got microphone stream');
      } catch(err) {
        return showErr('אין גישה למיקרופון: ' + err.message);
      }
      const mime = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus']
        .find(t => MediaRecorder.isTypeSupported(t)) || '';
      console.log('[Whisper] mime:', mime);
      if (!mime) return showErr('הדפדפן לא תומך בהקלטה');

      whisperRecorder = new MediaRecorder(whisperStream, { mimeType: mime });
      console.log('[Whisper] recorder created, starting...');
      whisperRecorder.ondataavailable = async e => {
        console.log('[Whisper] chunk size:', e.data.size, 'aiOn:', aiOn);
        if (!aiOn || e.data.size < 100) return; // skip near-empty chunks
        const form = new FormData();
        form.append('audio', e.data, 'audio.webm');
        try {
          const res = await fetch('/api/transcribe?room=' + roomId + '&lang=' + bcp47, {
            method: 'POST', body: form
          });
          const data = await res.json();
          if (data.text) document.getElementById('origTxt').textContent = data.text;
        } catch(err) { console.error('Whisper fetch error:', err); }
      };
      whisperRecorder.start(8000); // send every 8 seconds
      aiOn = true;
      document.getElementById('aiBtn').textContent = (window._BT||BL.he).stopAI;
      document.getElementById('aiBtn').classList.add('on');
      document.getElementById('transcriptBox').classList.remove('hidden');
      renderStatus(true); requestWakeLock();
      startSessionTimer();
    }

    // ── Session timeout (3 hours) ─────────────────────────────────────────────
    let sessionTimer = null, sessionWarningTimer = null;
    const SESSION_LIMIT_MS = 3 * 60 * 60 * 1000; // 3 hours
    const WARNING_TIMEOUT_MS = 2 * 60 * 1000;      // 2 min to respond

    function startSessionTimer() {
      clearTimeout(sessionTimer);
      sessionTimer = setTimeout(() => {
        showSessionWarning();
      }, SESSION_LIMIT_MS);
    }

    function showSessionWarning() {
      const banner = document.getElementById('sessionWarning');
      banner.classList.remove('hidden');
      sessionWarningTimer = setTimeout(() => {
        banner.classList.add('hidden');
        stopAI();
        showErr((window._BT||BL.he).autoStop);
      }, WARNING_TIMEOUT_MS);
    }

    function continueSession() {
      document.getElementById('sessionWarning').classList.add('hidden');
      clearTimeout(sessionWarningTimer);
      startSessionTimer(); // restart 3-hour timer
    }

    function stopAI() {
      clearTimeout(sessionTimer); clearTimeout(sessionWarningTimer);
      document.getElementById('sessionWarning').classList.add('hidden');
      if (whisperRecorder) { whisperRecorder.stop(); whisperRecorder = null; }
      if (whisperStream)   { whisperStream.getTracks().forEach(t => t.stop()); whisperStream = null; }
      recognition && recognition.stop(); recognition = null;
      aiOn = false; releaseWakeLock();
      document.getElementById('aiBtn').textContent = (window._BT||BL.he).startAI;
      document.getElementById('aiBtn').classList.remove('on');
      document.getElementById('transcriptBox').classList.add('hidden');
      renderStatus(false);
    }

    // ── UI helpers ────────────────────────────────────────────────────────────
    function renderStatus(active) {
      document.getElementById('dot').classList.toggle('live', active);
      const btn = document.getElementById('micBtn');
      const lbl = document.getElementById('btnLabel');
      const st  = document.getElementById('statusTxt');
      if (currentMode === 'human') {
        btn.textContent = active ? '⏹' : '🎙️';
        btn.classList.toggle('on', active);
        lbl.textContent = active ? (window._BT||BL.he).stopBroadcast : (window._BT||BL.he).startBroadcast;
        st.textContent  = active ? (window._BT||BL.he).broadcastingNow : (window._BT||BL.he).connected;
      } else {
        st.textContent = active ? (window._BT||BL.he).aiActive : (window._BT||BL.he).connected;
      }
    }
    function showErr(msg) { const el = document.getElementById('errMsg'); el.textContent = msg; el.classList.remove('hidden'); }
    function clearErr()   { document.getElementById('errMsg').classList.add('hidden'); }
  </script>
</body>
