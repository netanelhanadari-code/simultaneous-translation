<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babel Fish | עומדים ביחד | نقف معاً</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Babel Fish">
  <link rel="apple-touch-icon" href="/babel-fish.png">
  <meta name="theme-color" content="#8B2FC9">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Splash screen */
    #splash {
      position: fixed; inset: 0; z-index: 999;
      background: #12082a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.5rem;
      transition: opacity .5s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: min(220px, 62vw); object-fit: contain; }

    :root {
      --bg: #12082a; --surface: #1e0f3a; --border: #3d1f6b;
      --accent: #8B2FC9; --text: #f0e8ff; --muted: #9b7fc4;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      height: calc(var(--vh, 1vh) * 100);
      display: flex; flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    .scroll-area {
      flex: 1; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: .75rem 1.2rem; display: flex; align-items: center; gap: .8rem;
    }
    .logo { height: 34px; object-fit: contain; }
    .greeting { flex: 1; font-size: .97rem; font-weight: 600; }
    .settings-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.25rem; cursor: pointer; padding: .2rem;
    }
    .actions {
      display: flex; gap: .7rem; padding: 1rem 1rem .5rem;
    }
    .action-btn {
      flex: 1; border-radius: 12px; padding: .75rem .5rem;
      font-size: .9rem; cursor: pointer; font-weight: 600; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); transition: border-color .15s;
    }
    .action-btn:active { opacity: .85; }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); }
    .section-label { font-size: .78rem; color: var(--muted); padding: .8rem 1.2rem .3rem; }
    .rooms-list { display: flex; flex-direction: column; gap: .4rem; padding: 0 .8rem 2rem; }
    .room-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: .75rem 1rem;
      display: flex; align-items: center; gap: .6rem; cursor: pointer;
      transition: border-color .15s; touch-action: manipulation;
    }
    .room-chip:active { opacity: .85; }
    .room-chip.has-new { border-color: var(--accent); }
    .unread-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .unread-badge {
      background: var(--accent); color: #fff;
      font-size: .65rem; font-weight: 700; line-height: 1;
      min-width: 18px; height: 18px; border-radius: 9px;
      padding: 0 4px; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .room-chip-info { flex: 1; min-width: 0; }
    .room-chip-name {
      font-size: .93rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .room-chip-code { font-size: .72rem; color: var(--muted); letter-spacing: 1px; }
    .empty { text-align: center; color: var(--muted); font-size: .9rem; padding: 2.5rem 1rem; line-height: 1.7; }
    footer {
      padding: 1rem 1.2rem 1.3rem;
      display: flex; flex-direction: column; gap: .5rem;
      flex-shrink: 0;
    }
    /* Context menu */
    #chip-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.45);
    }
    #chip-overlay.open { display: block; }
    #chip-menu {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 201;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 18px 18px 0 0; padding: 1rem .8rem 1.5rem;
      display: flex; flex-direction: column; gap: .5rem;
      transform: translateY(100%); transition: transform .22s ease;
    }
    #chip-menu.open { transform: translateY(0); }
    .chip-menu-btn {
      width: 100%; padding: .85rem 1rem; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .chip-menu-btn.danger { color: #e07070; border-color: rgba(224,112,112,.35); }
    .chip-menu-btn.cancel { color: var(--muted); }
    .notice {
      font-size: .72rem; color: var(--muted); line-height: 1.5; text-align: center;
    }
    .notice.warn { color: #c0845a; }
    .notice a { color: inherit; text-decoration: underline; }
    .mute-icon { font-size: .8rem; opacity: .7; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="logo.png" alt="עומדים ביחד">
    <img src="babel-fish.png" alt="Babel Fish">
  </div>

  <header>
    <img class="logo" src="logo.png" alt="עומדים ביחד">
    <img class="logo" src="babel-fish.png" alt="Babel Fish">
    <div class="greeting" id="greeting"></div>
    <button class="settings-btn" onclick="location.href='/guide.html'" title="מדריך">ℹ️</button>
    <button class="settings-btn" id="notifSettingsBtn" onclick="openNotifSheet()" title="הגדרות התראות">🔔</button>
    <button class="settings-btn" onclick="location.href='/settings.html?from=/home.html'" title="הגדרות">⚙️</button>
  </header>

  <div class="scroll-area">
    <div class="actions">
      <button class="action-btn primary" onclick="location.href='/join.html?mode=create'">➕ קבוצה חדשה</button>
      <button class="action-btn" onclick="location.href='/join.html?mode=join'">🔗 הצטרף</button>
    </div>

    <p class="section-label" id="rooms-label" style="display:none;">הקבוצות שלי</p>
    <div class="rooms-list" id="rooms-list"></div>
  </div>

  <!-- ── Notification settings sheet ────────────────────────── -->
  <div id="notif-overlay" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);" onclick="closeNotifSheet()"></div>
  <div id="notif-sheet" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:301;background:#1e0f3a;border-top:1px solid #3d1f6b;border-radius:18px 18px 0 0;padding:1rem .8rem 1.8rem;transform:translateY(100%);transition:transform .22s ease;">
    <div style="font-size:.85rem;font-weight:700;color:#9b7fc4;margin-bottom:.9rem;text-align:center;">🔔 הגדרות התראות</div>
    <label style="display:flex;align-items:center;justify-content:space-between;padding:.7rem .2rem;border-bottom:1px solid #3d1f6b;">
      <span style="font-size:.93rem;">🔊 צליל התרעות</span>
      <input type="checkbox" id="soundToggle" onchange="onSoundToggle(this.checked)" style="width:20px;height:20px;accent-color:#8B2FC9;cursor:pointer;">
    </label>
    <label style="display:flex;align-items:center;justify-content:space-between;padding:.7rem .2rem;border-bottom:1px solid #3d1f6b;">
      <span style="font-size:.93rem;">🖥 התראות על המסך</span>
      <input type="checkbox" id="notifToggle" onchange="onNotifToggle(this.checked)" style="width:20px;height:20px;accent-color:#8B2FC9;cursor:pointer;">
    </label>
    <p id="notifSheetMsg" style="font-size:.75rem;color:#9b7fc4;text-align:center;margin-top:.6rem;min-height:1em;"></p>
    <button onclick="closeNotifSheet()" style="width:100%;margin-top:.5rem;background:#3d1f6b;color:#f0e8ff;border:none;border-radius:10px;padding:.75rem;font-size:.95rem;cursor:pointer;">סגור</button>
  </div>

  <div id="chip-overlay"></div>
  <div id="chip-menu">
    <button class="chip-menu-btn" id="chip-mute-btn"></button>
    <button class="chip-menu-btn danger" id="chip-main-btn"></button>
    <button class="chip-menu-btn cancel" id="chip-cancel-btn"></button>
  </div>

  <footer>
    <p class="notice warn" id="noticeWarn"></p>
    <p class="notice" id="noticeTerms"></p>
  </footer>

  <script>
    // Real viewport height (same fix as room.html) — 100dvh is unreliable
    // right after a fresh page load in Android WebView/TWA before the
    // browser chrome finishes settling, which is why this only showed up
    // on refresh and not when navigating back within the app.
    function setRealVh() {
      const h = window.visualViewport?.height || window.innerHeight;
      document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
    }
    setRealVh();
    window.addEventListener('resize', setRealVh);
    window.addEventListener('orientationchange', () => setTimeout(setRealVh, 100));
    window.visualViewport?.addEventListener('resize', setRealVh);

    const myName   = localStorage.getItem('bf_name')    || '';
    const myEmoji  = localStorage.getItem('bf_emoji')   || '';
    const myUiLang = localStorage.getItem('bf_ui_lang') || localStorage.getItem('bf_lang') || 'he';
    if (!myName) { location.href = '/lang-select.html'; }
    if (myUiLang === 'ar') { document.documentElement.setAttribute('lang', 'ar'); }
    if (myUiLang === 'en') { document.documentElement.setAttribute('dir', 'ltr'); document.documentElement.setAttribute('lang', 'en'); }

    const HOME_UI = {
      he: { greeting: 'שלום, ', newGroup: '➕ קבוצה חדשה', join: '🔗 הצטרף', myGroups: 'הקבוצות שלי', empty: 'אין קבוצות עדיין\nצור קבוצה חדשה או הצטרף לקבוצה קיימת', dm: 'שיחה פרטית', settings: '⚙️', warn: '⚠️ Babel Fish אינה מוגנת מפני פריצה או חדירה לפרטיות. אין להעביר בה מידע רגיש על אנשים או פעילות התנועה.', terms: 'בשימוש באפליקציה אני מסכים/ה', termsLink: 'לתנאי השימוש', deleteChat: 'מחק שיחה', leaveGroup: 'צא מהקבוצה', cancel: 'ביטול', deleteConfirm: 'למחוק את השיחה?', leaveConfirm: 'לצאת מהקבוצה?' },
      ar: { greeting: 'مرحباً، ', newGroup: '➕ مجموعة جديدة', join: '🔗 انضم', myGroups: 'مجموعاتي', empty: 'لا توجد مجموعات بعد\nأنشئ مجموعة جديدة أو انضم إلى مجموعة', dm: 'محادثة خاصة', settings: '⚙️', warn: '⚠️ Babel Fish غير محمية من الاختراق أو انتهاك الخصوصية. لا تشاركوا معلومات حساسة عن أشخاص أو نشاط الحركة.', terms: 'باستخدام التطبيق أوافق', termsLink: 'على شروط الاستخدام', deleteChat: 'حذف المحادثة', leaveGroup: 'مغادرة المجموعة', cancel: 'إلغاء', deleteConfirm: 'هل تريد حذف المحادثة؟', leaveConfirm: 'هل تريد مغادرة المجموعة؟' },
      en: { greeting: 'Hello, ', newGroup: '➕ New Group', join: '🔗 Join', myGroups: 'My Groups', empty: 'No groups yet\nCreate a new group or join an existing one', dm: 'Private chat', settings: '⚙️', warn: '⚠️ Babel Fish is not protected against hacking or privacy breaches. Do not share sensitive information about people or movement activity.', terms: 'By using this app I agree', termsLink: 'to the Terms of Use', deleteChat: 'Delete chat', leaveGroup: 'Leave group', cancel: 'Cancel', deleteConfirm: 'Delete this chat?', leaveConfirm: 'Leave this group?' },
    };
    const homeUi = HOME_UI[myUiLang] || HOME_UI.he;

    document.getElementById('greeting').textContent =
      homeUi.greeting + (myEmoji ? myEmoji + ' ' : '') + myName;
    document.querySelector('.action-btn.primary').textContent = homeUi.newGroup;
    document.querySelectorAll('.action-btn')[1].textContent   = homeUi.join;
    document.getElementById('noticeWarn').textContent = homeUi.warn;
    document.getElementById('noticeTerms').innerHTML = `${homeUi.terms} <a href="/terms.html">${homeUi.termsLink}</a>`;

    function getMyRooms() {
      try { return JSON.parse(localStorage.getItem('bf_rooms') || '[]'); } catch { return []; }
    }
    function saveMyRooms(rooms) {
      localStorage.setItem('bf_rooms', JSON.stringify(rooms.slice(0, 10)));
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // Context menu for long-press on room chip
    let chipMenuTargetId = null;
    let chipMenuIsDM = false;

    function openChipMenu(id, isDM) {
      chipMenuTargetId = id;
      chipMenuIsDM = isDM;
      const mainBtn = document.getElementById('chip-main-btn');
      const cancelBtn = document.getElementById('chip-cancel-btn');
      const muteBtn = document.getElementById('chip-mute-btn');
      mainBtn.textContent = isDM ? homeUi.deleteChat : homeUi.leaveGroup;
      cancelBtn.textContent = homeUi.cancel;
      // Mute / unmute
      const rooms = getMyRooms();
      const room = rooms.find(r => r.id === id);
      muteBtn.textContent = room?.muted ? '🔔 בטל השתקה' : '🔕 השתק קבוצה';
      document.getElementById('chip-overlay').classList.add('open');
      document.getElementById('chip-menu').classList.add('open');
    }

    function closeChipMenu() {
      document.getElementById('chip-overlay').classList.remove('open');
      document.getElementById('chip-menu').classList.remove('open');
      chipMenuTargetId = null;
    }

    function confirmChipAction() {
      if (!chipMenuTargetId) return;
      const confirm = chipMenuIsDM ? homeUi.deleteConfirm : homeUi.leaveConfirm;
      if (!window.confirm(confirm)) { closeChipMenu(); return; }
      saveMyRooms(getMyRooms().filter(r => r.id !== chipMenuTargetId));
      closeChipMenu();
      renderRooms({});
    }

    document.getElementById('chip-overlay').addEventListener('click', closeChipMenu);
    document.getElementById('chip-cancel-btn').addEventListener('click', closeChipMenu);
    document.getElementById('chip-main-btn').addEventListener('click', confirmChipAction);
    document.getElementById('chip-mute-btn').addEventListener('click', () => {
      if (!chipMenuTargetId) return;
      const rooms = getMyRooms();
      const room = rooms.find(r => r.id === chipMenuTargetId);
      if (room) { room.muted = !room.muted; saveMyRooms(rooms); }
      closeChipMenu();
      renderRooms(latestMapCache, {});
    });

    function setupChipLongPress(chip, id, isDM) {
      let timer = null;
      let moved = false;
      let longPressed = false;
      let startX = 0, startY = 0;

      chip.addEventListener('pointerdown', e => {
        moved = false;
        longPressed = false;
        startX = e.clientX; startY = e.clientY;
        timer = setTimeout(() => {
          if (!moved) {
            longPressed = true;
            navigator.vibrate?.(40);
            openChipMenu(id, isDM);
          }
        }, 550);
      });
      chip.addEventListener('pointermove', e => {
        if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
          moved = true;
          clearTimeout(timer);
        }
      });
      chip.addEventListener('pointerup', () => clearTimeout(timer));
      chip.addEventListener('pointercancel', () => clearTimeout(timer));
      // Swallow the click event that fires after a long-press
      chip.addEventListener('click', e => {
        if (longPressed) { e.stopImmediatePropagation(); longPressed = false; }
      }, true);
    }

    // ── Notification settings ─────────────────────────────────────────────────
    let soundOn  = localStorage.getItem('bf_sound')  !== '0';
    let notifOn  = localStorage.getItem('bf_notify') !== '0';

    function updateNotifBtn() {
      document.getElementById('notifSettingsBtn').textContent = (soundOn || notifOn) ? '🔔' : '🔕';
    }
    updateNotifBtn();

    function openNotifSheet() {
      const overlay = document.getElementById('notif-overlay');
      const sheet   = document.getElementById('notif-sheet');
      document.getElementById('soundToggle').checked = soundOn;
      document.getElementById('notifToggle').checked = notifOn && Notification.permission === 'granted';
      document.getElementById('notifSheetMsg').textContent = '';
      overlay.style.display = 'block';
      sheet.style.display = 'block';
      requestAnimationFrame(() => { sheet.style.transform = 'translateY(0)'; });
    }
    function closeNotifSheet() {
      const sheet = document.getElementById('notif-sheet');
      sheet.style.transform = 'translateY(100%)';
      setTimeout(() => {
        document.getElementById('notif-overlay').style.display = 'none';
        sheet.style.display = 'none';
      }, 240);
    }
    function onSoundToggle(val) {
      soundOn = val;
      localStorage.setItem('bf_sound', val ? '1' : '0');
      updateNotifBtn();
      if (val) playNotifSound(); // demo
    }
    function onNotifToggle(val) {
      if (val) {
        Notification.requestPermission().then(perm => {
          notifOn = perm === 'granted';
          document.getElementById('notifToggle').checked = notifOn;
          localStorage.setItem('bf_notify', notifOn ? '1' : '0');
          const msg = document.getElementById('notifSheetMsg');
          if (!notifOn) msg.textContent = 'הדפדפן חסם הרשאת התראות — שנה בהגדרות';
          updateNotifBtn();
        });
      } else {
        notifOn = false;
        localStorage.setItem('bf_notify', '0');
        updateNotifBtn();
      }
    }

    // ── Notification sound ────────────────────────────────────────────────────
    const _homeAudio = new Audio("/BBC_Records,_The_Hitch_Hiker's_Guide_To_The_Galaxy_(Sound_Effects_From_The_Radio_Dramatisation)_-_The_Book's_Activating_Code2.ogg");
    _homeAudio.volume = 0.5;
    let _homeAudioReady = false;
    document.addEventListener('pointerdown', function() {
      if (_homeAudioReady) return;
      _homeAudio.play().then(() => { _homeAudio.pause(); _homeAudio.currentTime = 0; _homeAudioReady = true; }).catch(() => {});
    }, { once: true, passive: true });
    function playNotifSound() {
      if (!soundOn) return;
      try { _homeAudio.currentTime = 0; _homeAudio.play().catch(() => {}); setTimeout(() => _homeAudio.pause(), 1500); } catch(_) {}
    }

    // ── Live unread counts (from WebSocket) ───────────────────────────────────
    let liveCounts = {};
    let latestMapCache = {};

    function incrementLive(roomId) {
      liveCounts[roomId] = (liveCounts[roomId] || 0) + 1;
      // Update badge on existing chip without full re-render
      const chip = document.querySelector(`[data-room-id="${CSS.escape(roomId)}"]`);
      if (chip) {
        const count = liveCounts[roomId];
        let badge = chip.querySelector('.unread-badge,.unread-dot');
        if (!badge) { badge = document.createElement('span'); chip.insertBefore(badge, chip.firstChild); }
        badge.className = 'unread-badge';
        badge.textContent = count > 99 ? '99+' : count;
        chip.classList.add('has-new');
        // Move chip to top
        chip.parentElement.insertBefore(chip, chip.parentElement.firstChild);
      }
    }

    // ── Home WebSocket (background listener) ──────────────────────────────────
    let _homeWs = null;
    let _homeWsReconnectTimer = null;

    function initHomeWS() {
      const rooms = getMyRooms();
      if (!rooms.length) return;
      const roomIds = rooms.map(r => r.id).join(',');
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${location.host}/ws?role=home&rooms=${encodeURIComponent(roomIds)}&name=${encodeURIComponent(myName)}`;
      try { _homeWs?.close(); } catch(_) {}

      const ws = new WebSocket(url);
      _homeWs = ws;

      ws.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type !== 'home_message') return;
          if (msg.sender_name === myName) return; // own message
          const rooms = getMyRooms();
          const room = rooms.find(r => r.id === msg.room_id);
          if (!room) return;

          // Sound
          if (!room.muted) playNotifSound();

          // Browser notification
          if (notifOn && Notification.permission === 'granted') {
            const text = msg.translations?.[myUiLang] || msg.original_text || '';
            const roomName = room.names?.[myUiLang] || room.name || msg.room_id;
            try {
              const n = new Notification(`${msg.sender_emoji || '💬'} ${msg.sender_name} · ${roomName}`, {
                body: text.slice(0, 120),
                tag: msg.room_id,
                icon: '/babel-fish.png'
              });
              n.onclick = () => { window.focus(); location.href = `/room.html?room=${msg.room_id}`; };
            } catch(_) {}
          }

          // Update badge
          incrementLive(msg.room_id);
        } catch(_) {}
      };

      ws.onclose = () => {
        if (_homeWs !== ws) return; // replaced
        clearTimeout(_homeWsReconnectTimer);
        _homeWsReconnectTimer = setTimeout(initHomeWS, 5000);
      };
      ws.onerror = () => ws.close();
    }

    function enterRoom(id) {
      const rooms = getMyRooms();
      const idx = rooms.findIndex(r => r.id === id);
      if (idx >= 0) { rooms[idx].ts = Date.now(); saveMyRooms(rooms); }
      location.href = `/room.html?room=${id}`;
    }

    function renderRooms(latestMap, countMap) {
      countMap = countMap || {};
      const rooms = getMyRooms();
      const label = document.getElementById('rooms-label');
      const list  = document.getElementById('rooms-list');

      if (rooms.length === 0) {
        label.style.display = 'none';
        const [line1, line2] = homeUi.empty.split('\n');
        list.innerHTML = `<div class="empty">${esc(line1)}<br><small>${esc(line2)}</small></div>`;
        return;
      }
      label.style.display = '';
      label.textContent = homeUi.myGroups;

      const enriched = rooms.map(r => {
        const latest = latestMap[r.id];
        const hasNew = latest && (!r.lastSeen || latest > r.lastSeen);
        return { ...r, hasNew, latest };
      });
      enriched.sort((a, b) => {
        if (a.hasNew !== b.hasNew) return a.hasNew ? -1 : 1;
        if (a.hasNew && b.hasNew) return new Date(b.latest) - new Date(a.latest);
        return (b.ts || 0) - (a.ts || 0);
      });

      list.innerHTML = '';
      enriched.forEach(r => {
        const chip = document.createElement('div');
        chip.className = 'room-chip' + (r.hasNew ? ' has-new' : '');
        const isDM = r.type === 'dm' || (r.id?.startsWith('D') && r.id.length <= 7);
        const displayName = isDM ? r.name : (r.names?.[myUiLang] || r.name);
        const unreadCount = countMap[r.id];
        const badgeHtml = unreadCount > 0
          ? `<span class="unread-badge">${unreadCount > 99 ? '99+' : unreadCount}</span>`
          : r.hasNew ? '<span class="unread-dot"></span>' : '';
        chip.dataset.roomId = r.id;
        const muteHtml = r.muted ? '<span class="mute-icon">🔕</span>' : '';
        chip.innerHTML =
          badgeHtml +
          `<div class="room-chip-info">
            <div class="room-chip-name">${isDM ? '👤 ' : '💬 '}${esc(displayName)}</div>
            <div class="room-chip-code">${isDM ? homeUi.dm : r.id}</div>
          </div>` + muteHtml;
        chip.addEventListener('click', () => enterRoom(r.id));
        setupChipLongPress(chip, r.id, isDM);
        list.appendChild(chip);
      });
    }

    async function init() {
      renderRooms({});
      const rooms = getMyRooms();
      if (!rooms.length) return;
      const ids = rooms.map(r => r.id).join(',');
      try {
        // Build unread-counts request from rooms that have lastSeen
        const roomsWithSince = rooms.filter(r => r.lastSeen).map(r => ({ id: r.id, since: r.lastSeen }));
        // Fetch latest timestamps, translated names, and unread counts in parallel
        const [latestRes, namesRes, countRes] = await Promise.all([
          fetch(`/api/rooms/latest?ids=${encodeURIComponent(ids)}`),
          fetch(`/api/rooms/names?ids=${encodeURIComponent(ids)}`),
          roomsWithSince.length
            ? fetch('/api/rooms/unread-counts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rooms: roomsWithSince })
              })
            : Promise.resolve(null)
        ]);
        const latestMap = await latestRes.json();
        const namesMap  = await namesRes.json();
        const countMap  = countRes ? await countRes.json() : {};
        // Update bf_rooms with fresh translated names
        const stored = getMyRooms();
        stored.forEach(r => {
          if (namesMap[r.id]) r.names = namesMap[r.id];
        });
        saveMyRooms(stored);
        latestMapCache = latestMap;
        renderRooms(latestMap, countMap);
      } catch(e) { renderRooms({}); }
    }
    init();
    initHomeWS();

    // Splash fade-out — only show the full splash on first load of the
    // session or an explicit refresh (F5). Navigating back to home.html
    // from a room (via the back button/location.href) shouldn't replay it
    // every time.
    const splash = document.getElementById('splash');
    const navType = performance.getEntriesByType('navigation')[0]?.type;
    const isFreshLoad = navType === 'reload' || !sessionStorage.getItem('bf_splash_shown');
    if (!isFreshLoad) {
      splash.remove();
    } else {
      sessionStorage.setItem('bf_splash_shown', '1');
      setTimeout(() => {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 500);
      }, 1200);
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
  <script src="/pull-refresh.js"></script>
</body>
</html>
