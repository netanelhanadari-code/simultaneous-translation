<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babel Fish | עומדים ביחד | نقف معاً</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Babel Fish">
  <link rel="apple-touch-icon" href="/babel-fish.png">
  <meta name="theme-color" content="#8B2FC9">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Splash screen */
    #splash {
      position: fixed; inset: 0; z-index: 999;
      background: #12082a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1.5rem;
      transition: opacity .5s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img { width: min(220px, 62vw); object-fit: contain; }

    :root {
      --bg: #12082a; --surface: #1e0f3a; --border: #3d1f6b;
      --accent: #8B2FC9; --text: #f0e8ff; --muted: #9b7fc4;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: calc(var(--vh, 1vh) * 100);
      display: flex; flex-direction: column;
      -webkit-user-select: none; user-select: none;
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: .75rem 1.2rem; display: flex; align-items: center; gap: .8rem;
    }
    .logo { height: 34px; object-fit: contain; }
    .greeting { flex: 1; font-size: .97rem; font-weight: 600; }
    .settings-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.25rem; cursor: pointer; padding: .2rem;
    }
    .actions {
      display: flex; gap: .7rem; padding: 1rem 1rem .5rem;
    }
    .action-btn {
      flex: 1; border-radius: 12px; padding: .75rem .5rem;
      font-size: .9rem; cursor: pointer; font-weight: 600; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); transition: border-color .15s;
    }
    .action-btn:active { opacity: .85; }
    .action-btn.primary { background: var(--accent); border-color: var(--accent); }
    .section-label { font-size: .78rem; color: var(--muted); padding: .8rem 1.2rem .3rem; }
    .rooms-list { display: flex; flex-direction: column; gap: .4rem; padding: 0 .8rem 2rem; }
    .room-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: .75rem 1rem;
      display: flex; align-items: center; gap: .6rem; cursor: pointer;
      transition: border-color .15s; touch-action: manipulation;
    }
    .room-chip:active { opacity: .85; }
    .room-chip.has-new { border-color: var(--accent); }
    .unread-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .room-chip-info { flex: 1; min-width: 0; }
    .room-chip-name {
      font-size: .93rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .room-chip-code { font-size: .72rem; color: var(--muted); letter-spacing: 1px; }
    .room-chip-leave {
      background: none; border: none; color: var(--muted);
      font-size: 1rem; cursor: pointer; padding: .3rem .4rem; border-radius: 6px; flex-shrink: 0;
    }
    .room-chip-leave:hover { color: #e07070; background: rgba(224,112,112,.1); }
    .empty { text-align: center; color: var(--muted); font-size: .9rem; padding: 2.5rem 1rem; line-height: 1.7; }
    footer {
      margin-top: auto; padding: 1rem 1.2rem 1.3rem;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .notice {
      font-size: .72rem; color: var(--muted); line-height: 1.5; text-align: center;
    }
    .notice.warn { color: #c0845a; }
    .notice a { color: inherit; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="logo.png" alt="עומדים ביחד">
    <img src="babel-fish.png" alt="Babel Fish">
  </div>

  <header>
    <img class="logo" src="logo.png" alt="עומדים ביחד">
    <img class="logo" src="babel-fish.png" alt="Babel Fish">
    <div class="greeting" id="greeting"></div>
    <button class="settings-btn" onclick="location.href='/guide.html'" title="מדריך">ℹ️</button>
    <button class="settings-btn" onclick="location.href='/settings.html?from=/home.html'" title="הגדרות">⚙️</button>
  </header>

  <div class="actions">
    <button class="action-btn primary" onclick="location.href='/join.html?mode=create'">➕ קבוצה חדשה</button>
    <button class="action-btn" onclick="location.href='/join.html?mode=join'">🔗 הצטרף</button>
  </div>

  <p class="section-label" id="rooms-label" style="display:none;">הקבוצות שלי</p>
  <div class="rooms-list" id="rooms-list"></div>

  <footer>
    <p class="notice warn" id="noticeWarn"></p>
    <p class="notice" id="noticeTerms"></p>
  </footer>

  <script>
    // Real viewport height (same fix as room.html) — 100dvh is unreliable
    // right after a fresh page load in Android WebView/TWA before the
    // browser chrome finishes settling, which is why this only showed up
    // on refresh and not when navigating back within the app.
    function setRealVh() {
      const h = window.visualViewport?.height || window.innerHeight;
      document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
    }
    setRealVh();
    window.addEventListener('resize', setRealVh);
    window.addEventListener('orientationchange', () => setTimeout(setRealVh, 100));
    window.visualViewport?.addEventListener('resize', setRealVh);

    const myName   = localStorage.getItem('bf_name')    || '';
    const myEmoji  = localStorage.getItem('bf_emoji')   || '';
    const myUiLang = localStorage.getItem('bf_ui_lang') || localStorage.getItem('bf_lang') || 'he';
    if (!myName) { location.href = '/lang-select.html'; }
    if (myUiLang === 'ar') { document.documentElement.setAttribute('lang', 'ar'); }
    if (myUiLang === 'en') { document.documentElement.setAttribute('dir', 'ltr'); document.documentElement.setAttribute('lang', 'en'); }

    const HOME_UI = {
      he: { greeting: 'שלום, ', newGroup: '➕ קבוצה חדשה', join: '🔗 הצטרף', myGroups: 'הקבוצות שלי', empty: 'אין קבוצות עדיין\nצור קבוצה חדשה או הצטרף לקבוצה קיימת', dm: 'שיחה פרטית', settings: '⚙️', warn: '⚠️ Babel Fish אינה מוגנת מפני פריצה או חדירה לפרטיות. אין להעביר בה מידע רגיש על אנשים או פעילות התנועה.', terms: 'בשימוש באפליקציה אני מסכים/ה', termsLink: 'לתנאי השימוש' },
      ar: { greeting: 'مرحباً، ', newGroup: '➕ مجموعة جديدة', join: '🔗 انضم', myGroups: 'مجموعاتي', empty: 'لا توجد مجموعات بعد\nأنشئ مجموعة جديدة أو انضم إلى مجموعة', dm: 'محادثة خاصة', settings: '⚙️', warn: '⚠️ Babel Fish غير محمية من الاختراق أو انتهاك الخصوصية. لا تشاركوا معلومات حساسة عن أشخاص أو نشاط الحركة.', terms: 'باستخدام التطبيق أوافق', termsLink: 'على شروط الاستخدام' },
      en: { greeting: 'Hello, ', newGroup: '➕ New Group', join: '🔗 Join', myGroups: 'My Groups', empty: 'No groups yet\nCreate a new group or join an existing one', dm: 'Private chat', settings: '⚙️', warn: '⚠️ Babel Fish is not protected against hacking or privacy breaches. Do not share sensitive information about people or movement activity.', terms: 'By using this app I agree', termsLink: 'to the Terms of Use' },
    };
    const homeUi = HOME_UI[myUiLang] || HOME_UI.he;

    document.getElementById('greeting').textContent =
      homeUi.greeting + (myEmoji ? myEmoji + ' ' : '') + myName;
    document.querySelector('.action-btn.primary').textContent = homeUi.newGroup;
    document.querySelectorAll('.action-btn')[1].textContent   = homeUi.join;
    document.getElementById('noticeWarn').textContent = homeUi.warn;
    document.getElementById('noticeTerms').innerHTML = `${homeUi.terms} <a href="/terms.html">${homeUi.termsLink}</a>`;

    function getMyRooms() {
      try { return JSON.parse(localStorage.getItem('bf_rooms') || '[]'); } catch { return []; }
    }
    function saveMyRooms(rooms) {
      localStorage.setItem('bf_rooms', JSON.stringify(rooms.slice(0, 10)));
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function leaveRoom(id, e) {
      e.stopPropagation();
      saveMyRooms(getMyRooms().filter(r => r.id !== id));
      renderRooms({});
    }

    function enterRoom(id) {
      const rooms = getMyRooms();
      const idx = rooms.findIndex(r => r.id === id);
      if (idx >= 0) { rooms[idx].ts = Date.now(); saveMyRooms(rooms); }
      location.href = `/room.html?room=${id}`;
    }

    function renderRooms(latestMap) {
      const rooms = getMyRooms();
      const label = document.getElementById('rooms-label');
      const list  = document.getElementById('rooms-list');

      if (rooms.length === 0) {
        label.style.display = 'none';
        const [line1, line2] = homeUi.empty.split('\n');
        list.innerHTML = `<div class="empty">${esc(line1)}<br><small>${esc(line2)}</small></div>`;
        return;
      }
      label.style.display = '';
      label.textContent = homeUi.myGroups;

      const enriched = rooms.map(r => {
        const latest = latestMap[r.id];
        const hasNew = latest && (!r.lastSeen || latest > r.lastSeen);
        return { ...r, hasNew, latest };
      });
      enriched.sort((a, b) => {
        if (a.hasNew !== b.hasNew) return a.hasNew ? -1 : 1;
        if (a.hasNew && b.hasNew) return new Date(b.latest) - new Date(a.latest);
        return (b.ts || 0) - (a.ts || 0);
      });

      list.innerHTML = '';
      enriched.forEach(r => {
        const chip = document.createElement('div');
        chip.className = 'room-chip' + (r.hasNew ? ' has-new' : '');
        const isDM = r.type === 'dm' || (r.id?.startsWith('D') && r.id.length <= 7);
        const displayName = isDM ? r.name : (r.names?.[myUiLang] || r.name);
        chip.innerHTML =
          (r.hasNew ? '<span class="unread-dot"></span>' : '') +
          `<div class="room-chip-info">
            <div class="room-chip-name">${isDM ? '👤 ' : '💬 '}${esc(displayName)}</div>
            <div class="room-chip-code">${isDM ? homeUi.dm : r.id}</div>
          </div>
          <button class="room-chip-leave" title="הסר">✕</button>`;
        chip.addEventListener('click', () => enterRoom(r.id));
        chip.querySelector('.room-chip-leave').addEventListener('click', e => leaveRoom(r.id, e));
        list.appendChild(chip);
      });
    }

    async function init() {
      renderRooms({});
      const rooms = getMyRooms();
      if (!rooms.length) return;
      const ids = rooms.map(r => r.id).join(',');
      try {
        // Fetch unread + translated names in parallel
        const [latestRes, namesRes] = await Promise.all([
          fetch(`/api/rooms/latest?ids=${encodeURIComponent(ids)}`),
          fetch(`/api/rooms/names?ids=${encodeURIComponent(ids)}`)
        ]);
        const latestMap = await latestRes.json();
        const namesMap  = await namesRes.json();
        // Update bf_rooms with fresh translated names
        const stored = getMyRooms();
        stored.forEach(r => {
          if (namesMap[r.id]) r.names = namesMap[r.id];
        });
        saveMyRooms(stored);
        renderRooms(latestMap);
      } catch(e) { renderRooms({}); }
    }
    init();

    // Splash fade-out — only show the full splash on first load of the
    // session or an explicit refresh (F5). Navigating back to home.html
    // from a room (via the back button/location.href) shouldn't replay it
    // every time.
    const splash = document.getElementById('splash');
    const navType = performance.getEntriesByType('navigation')[0]?.type;
    const isFreshLoad = navType === 'reload' || !sessionStorage.getItem('bf_splash_shown');
    if (!isFreshLoad) {
      splash.remove();
    } else {
      sessionStorage.setItem('bf_splash_shown', '1');
      setTimeout(() => {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 500);
      }, 1200);
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
